<html lang="pl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zarządzania zmianą (PZZ) — Grupa Merito</title>
<meta name="description" content="Uproszczony Plan Zarządzania Zmianą wg szablonu Grupy Merito.">
<meta name="theme-color" content="#0F2027">
<style>
  :root{
    --ink:#0F2027; --ink-soft:#27404a; --paper:#f7f8f9; --card:#ffffff;
    --line:#c7ced3; --muted:#4b5560; --accent:#0F7173; --accent-soft:#e3f1f1;
    --red:#9c261e; --red-bg:#fdeceb; --orange:#8a4f00; --orange-bg:#fdf0dc;
    --green:#1a5c33; --green-bg:#e7f5ec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);}
  header.app{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
  header.app h1{font-size:19px;margin:0;font-weight:700;}
  header.app .sub{font-size:14px;opacity:.9;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{font:inherit;font-size:15px;cursor:pointer;border-radius:7px;border:1.5px solid var(--line);background:var(--card);padding:9px 14px;color:var(--ink);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.small{padding:6px 11px;font-size:14px;}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;background:var(--paper);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);}
  nav.tabs button{border:none;background:transparent;padding:11px 15px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;font-size:15px;}
  nav.tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset;}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px;}
  .card h2{margin:0 0 4px;font-size:19px;}
  .card h3{margin:20px 0 10px;font-size:14.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;}
  .card p.hint{color:var(--muted);font-size:14.5px;margin:2px 0 14px;}
  .grid{display:grid;gap:14px;}
  .grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .grid.cols4{grid-template-columns:repeat(4,minmax(0,1fr));}

  label{display:block;font-size:14.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;font:inherit;font-size:15.5px;background:#fff;color:var(--ink);
  }

<script type="text/plain" id="app-source">
const {useState, useMemo, useEffect, useRef} = React;

/* ---------- Model referencyjny (zgodny z arkuszem PZZ Grupy Merito) ---------- */

const CATEGORIES = [
  {id:"kierunek", label:"Nadają kierunek i usuwają bariery"},
  {id:"przelozeni", label:"Bezpośredni przełożeni — usuwają bariery i/lub sami zmieniają nawyki"},
  {id:"nowezasady", label:"Pracują według nowych zasad"},
  {id:"wdrozenie", label:"Przygotowują i wspierają wdrożenie"},
];
const OPTIONAL_CATEGORY = {id:"klienci", label:"Klienci / studenci (zewnętrzni odbiorcy zmiany) — opcjonalna, do przetestowania", optional:true};
const ALL_CATEGORIES = [...CATEGORIES, OPTIONAL_CATEGORY];
const MAX_ACTIONS_PER_CATEGORY = 3;
const MAX_WIP_ACTIONS = 5;

const ADKAR_DIMS = [
  {id:"awareness", label:"Awareness", sub:"świadomość potrzeby zmiany"},
  {id:"desire", label:"Desire", sub:"chęć wspierania i uczestnictwa w zmianie"},
  {id:"knowledge", label:"Knowledge", sub:"wiedza, jak pracować w nowy sposób"},
  {id:"ability", label:"Ability", sub:"praktyczne umiejętności pracy w nowy sposób"},
  {id:"reinforcement", label:"Reinforcement", sub:"trwałe stosowanie nowego sposobu pracy"},
];
const ADKAR_SUGGESTIONS = {
  awareness: "Zaplanuj wspólny rezultat wyjaśniający sens i rolę w zmianie.",
  desire: "Pokaż korzyści, daj wpływ i uruchom widoczne sponsorstwo.",
  knowledge: "Zapewnij wspólną bazę wiedzy z modułami dla różnych ról.",
  ability: "Dodaj ćwiczenia, testy i wsparcie w rzeczywistej pracy.",
  reinforcement: "Ustal właścicieli, pomiary, przeglądy i sposób reagowania na powrót do starych praktyk.",
};

const STATUS_OPTIONS = ["Do zaplanowania","W realizacji","Do weryfikacji","Zablokowane","Zrealizowane"];
const CHANNEL_SUGGESTIONS = ["mail","Intranet GM","Teams","spotkanie stacjonarne","spotkanie online","ankieta","SharePoint"];

const SURVEY = {
  partI: [
    {id:"i1", q:"Ilu obszarów działalności dotyka zmiana?", hint:"1 – jeden obszar … 5 – praktycznie wszystkie obszary"},
    {id:"i2", q:"Ilu pracowników dotyka zmiana?", hint:"1 – do 100 osób … 5 – powyżej 300 osób"},
    {id:"i3", q:"W jakim stopniu pracownicy rozumieją, po co wprowadzana jest zmiana?", hint:"1 – rozumieją sens … 5 – brak spójnego zrozumienia"},
    {id:"i4", q:"Ile mamy czasu na przygotowanie pracowników do zmiany?", hint:"1 – dużo czasu … 5 – brak czasu, zmiana musi być wdrożona bardzo szybko"},
  ],
  partII_items: [
    {id:"ii_procesy", label:"Procesy / sposób pracy"},
    {id:"ii_it", label:"Systemy IT, inne narzędzia"},
    {id:"ii_role", label:"Role i zakres obowiązków"},
    {id:"ii_nawyki", label:"Nawyki i codzienny sposób pracy"},
    {id:"ii_warunki", label:"Warunki pracy (ocena, nagradzanie, benefity)"},
    {id:"ii_lokalizacja", label:"Lokalizacja (miejsce pracy)"},
  ],
  partII_extra: {id:"ii_sukces", q:"Jaki % sukcesu zmiany zależy od zmiany zachowań/sposobu pracy ludzi?", hint:"1 – 0-20% … 5 – 81-100%"},
  partIII: [
    {id:"iii1", q:"Na ile pracownicy są obecnie obciążeni innymi zmianami?", hint:"1 – brak innych zmian … 5 – bardzo dużo zmian"},
    {id:"iii2", q:"Na ile pracownicy są otwarci na zmianę?", hint:"1 – akceptują zmiany … 5 – całkowity brak otwartości"},
  ],
};

const SURVEY_QUESTION_COUNT =
  SURVEY.partI.length + SURVEY.partII_items.length + 1 /* partII_extra */ + SURVEY.partIII.length;

// Zwraca stan "nieukończona" dopóki nie odpowiedziano na wszystkie pytania — inaczej narzędzie
// pokazywałoby poziom ryzyka wyliczony z pustych/domyślnych odpowiedzi, czyli fałszywy wynik
// zanim ktokolwiek cokolwiek wypełnił.
function surveyLevel(total, answeredCount){
  if (answeredCount < SURVEY_QUESTION_COUNT){
    return {poziom:null, label:"Ankieta nieukończona", risk:"", color:"gray", complete:false};
  }
  if (total <= 25) return {poziom:1, label:"Mała zmiana", risk:"Niskie ryzyko", color:"green", complete:true};
  if (total <= 45) return {poziom:2, label:"Średnia zmiana", risk:"Średnie ryzyko", color:"orange", complete:true};
  return {poziom:3, label:"Duża zmiana", risk:"Wysokie ryzyko", color:"red", complete:true};
}

function pctTone(v){
  if (v == null || v === "") return "gray";
  if (v < 20) return "red";
  if (v < 25) return "orange";
  return "green";
}

const PCT_TONE_LABELS = {gray:"brak danych", red:"wymaga działania", orange:"wymaga uwagi", green:"mocny obszar"};

/* ---------- Stan początkowy ---------- */

function emptySurveyAnswers(){
  const a = {};
  SURVEY.partI.forEach(q => a[q.id] = null);
  SURVEY.partII_items.forEach(it => a[it.id] = null);
  a[SURVEY.partII_extra.id] = null;
  SURVEY.partIII.forEach(q => a[q.id] = null);
  return a;
}

function emptyAdkarByCategory(){
  const o = {};
  ALL_CATEGORIES.forEach(c => {
    o[c.id] = {awareness:null, desire:null, knowledge:null, ability:null, reinforcement:null, wniosek:""};
  });
  return o;
}

function newProjectState(){
  return {
    project: {
      nazwa:"", sponsor:"", pm:"", cm:"", typProjektu:"", okresRealizacji:"",
      terminPrzygotowania:"", czestotliwosc:"",
      nick:"", filie:"", zwiazekZeStrategia:"", celProjektu:"", powodyProjektu:"", glownaKorzysc:"", budzetRazem:"",
      wylaczenia:"", zrodloFinansowania:"",
    },
    surveyAnswers: emptySurveyAnswers(),
    pctHistory: [
      {id:cryptoId(), data:"", punktKontrolny:"Diagnoza wejściowa", definicjaSukcesu:"", przywodztwo:"", zarzadzanieProjektem:"", zarzadzanieZmiana:"", decyzja:"", kolejnyPrzeglad:""},
    ],
    groups: [],
    adkarByCategory: emptyAdkarByCategory(),
    actions: [],
    checklist12: {},
    milestones: [],
    teamMembers: [],
    risks: [],
    deliverables: [],
    budgetItems: [],
    links: [],
    maintenanceCosts: [],
    savedAt: null,
  };
}

function cryptoId(){
  try { if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID(); } catch(e){}
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

function sanitizeProjectState(data){
  const base = newProjectState();
  if (!data || typeof data !== "object") return base;
  const project = (data.project && typeof data.project === "object") ? {...base.project, ...data.project} : base.project;
  const surveyAnswers = (data.surveyAnswers && typeof data.surveyAnswers === "object") ? {...base.surveyAnswers, ...data.surveyAnswers} : base.surveyAnswers;
  const pctHistory = Array.isArray(data.pctHistory) && data.pctHistory.length ? data.pctHistory : base.pctHistory;
  const groups = Array.isArray(data.groups) ? data.groups : base.groups;
  const adkarByCategory = (data.adkarByCategory && typeof data.adkarByCategory === "object")
    ? {...base.adkarByCategory, ...data.adkarByCategory} : base.adkarByCategory;
  const actions = Array.isArray(data.actions) ? data.actions : base.actions;
  const checklist12 = (data.checklist12 && typeof data.checklist12 === "object") ? data.checklist12 : base.checklist12;
  const milestones = Array.isArray(data.milestones) ? data.milestones : base.milestones;
  const teamMembers = Array.isArray(data.teamMembers) ? data.teamMembers : base.teamMembers;
  const risks = Array.isArray(data.risks) ? data.risks : base.risks;
  const deliverables = Array.isArray(data.deliverables) ? data.deliverables : base.deliverables;
  const budgetItems = Array.isArray(data.budgetItems) ? data.budgetItems : base.budgetItems;
  const links = Array.isArray(data.links) ? data.links : base.links;
  const maintenanceCosts = Array.isArray(data.maintenanceCosts) ? data.maintenanceCosts : base.maintenanceCosts;
  return {
    ...base, ...data,
    project, surveyAnswers, pctHistory, groups, adkarByCategory, actions, checklist12, milestones, teamMembers, risks,
    deliverables, budgetItems, links, maintenanceCosts,
  };
}

/* ---------- Import karty projektu (.docx) ---------- */

// Etykieta i wartość mogą siedzieć w tej samej komórce/wierszu ("Lp | ETYKIETA | wartość")
// albo etykieta zajmuje cały wiersz, a wartość jest w kolejnym (tak jest np. przy "CEL
// PROJEKTU" czy "POWODY PODJĘCIA PROJEKTU", gdzie odpowiedź to osobny akapit/lista).
// Szablony kart (uczelniana / grupowa-projektowa / programowa) różnią się nazewnictwem etykiet
// ("MENADŻER PROJEKTU" vs "MENADŻER PROGRAMU", "ZWIĄZEK" vs "POWIĄZANIE ZE STRATEGIĄ" itd.) —
// każdy matcher musi łapać wszystkie warianty, nie tylko ten z jednego przykładowego dokumentu.
const KARTA_FIELD_MATCHERS = [
  ["nazwa", /^NAZWA (PROJEKTU|PROGRAMU)/i],
  ["nick", /^NICK\/?\s*SYMBOL/i],
  ["sponsor", /^SPONSOR/i],
  ["pm", /^MENADŻER (PROJEKTU|PROGRAMU)/i],
  ["typProjektu", /^TYP (PROJEKTU|PROGRAMU)/i],
  ["filie", /^(FILIE OBJĘTE PROJEKTEM|PODMIOTY OBJĘTE (PROGRAMEM|PROJEKTEM))/i],
  ["zwiazekZeStrategia", /^(ZWIĄZEK|POWIĄZANIE) ZE STRATEGI/i],
  ["okresRealizacji", /^(OKRES|TERMIN) REALIZACJI/i],
  ["powodyProjektu", /^(POWODY PODJĘCIA (PROJEKTU|PROGRAMU)|PROBLEMY\s*\/?\s*SZANSE DO ROZWIĄZANIA)/i],
  ["celProjektu", /^CEL (PROJEKTU|PROGRAMU)/i],
  ["budzetRazem", /^RAZEM/i],
  ["wylaczenia", /^WYŁĄCZENIA/i],
  ["zrodloFinansowania", /^ŹRÓDŁO FINANSOWANIA/i],
];

// textContent samych <td> zlewa akapity/pozycje listy w jeden ciąg bez odstępu — dodajemy
// spację między blokami (<p>, <li>), żeby np. wielopunktowe "Powody podjęcia projektu" dało
// się w ogóle przeczytać.
function cellText(node){
  const blocks = node.querySelectorAll("p, li");
  const text = blocks.length
    ? Array.from(blocks).map(b => (b.textContent||"").trim()).filter(Boolean).join(" ")
    : (node.textContent || "");
  return text.replace(/\s+/g, " ").trim();
}

function extractFields(tables){
  const fields = {};
  tables.forEach(table => {
    const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
    rows.forEach((cells, r) => {
      for (let i = 0; i < cells.length; i++){
        const label = cells[i].replace(/\*/g, "").trim();
        if (!label) continue;
        KARTA_FIELD_MATCHERS.forEach(([key, re]) => {
          if (fields[key] || !re.test(label)) return;
          // Wartość to komórka TUŻ OBOK etykiety (i+1), nie zawsze ostatnia w wierszu — niektóre
          // szablony mieszczą dwie pary etykieta-wartość w jednym wierszu (np. "Nick/symbol | ... |
          // Nazwa we Flexi | ..."), gdzie branie zawsze ostatniej komórki podstawiłoby cudzą wartość.
          // Sięgamy do kolejnego wiersza TYLKO gdy etykieta nie ma sąsiedniej komórki w ogóle (np.
          // długi tekst opisowy pod nagłówkiem) — pusta-ale-istniejąca komórka obok etykiety oznacza
          // po prostu niewypełnione pole i nie powinna być podmieniana wartością z innego wiersza.
          if (i < cells.length - 1){
            const value = cells[i + 1];
            if (value) fields[key] = value;
            return;
          }
          const nextRow = rows[r + 1];
          if (nextRow && nextRow.length){
            const value = nextRow[nextRow.length - 1];
            if (value) fields[key] = value;
          }
        });
      }
    });
  });
  // "Główna korzyść biznesowa" siedzi w osobnej mini-tabeli: wiersz nagłówka
  // "KORZYŚĆ BIZNESOWA | KIEDY WYSTĄPI? | SUGEROWANY MIERNIK", wartość w kolejnym wierszu,
  // pierwsza komórka — nie pasuje do schematu etykieta-w-tym-samym-lub-ostatniej-komórce powyżej.
  tables.forEach(table => {
    const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
    const idx = rows.findIndex(r => r[0] && /^KORZYŚĆ BIZNESOWA$/i.test(r[0].trim()));
    if (idx !== -1 && rows[idx+1] && rows[idx+1][0] && !fields.glownaKorzysc){
      fields.glownaKorzysc = rows[idx+1][0];
    }
  });
  return fields;
}

// "GRUPY OBJĘTE ZMIANĄ" (szablony 2026) zastąpiło "INTERESARIUSZE PROJEKTU" (starszy wzór) —
// dopasowujemy oba. Liczba kolumn różni się między wzorami (karta programu ma tylko 2: grupa +
// opis zmiany, bez trzeciej kolumny "jak przygotujemy") i tabela bywa zaśmiecona dodatkowymi
// wierszami o skali zmiany ("OCENA SKALI ZMIANY...", "LICZBA PUNKTÓW...") — odrzucamy je po treści.
function extractGroups(tables){
  const groups = [];
  const stakeholderTable = tables.find(t => /GRUPY OBJ[EĘ]TE ZMIAN|INTERESARIUSZE PROJEKTU/i.test(cellText(t.rows[0])));
  if (!stakeholderTable) return groups;
  Array.from(stakeholderTable.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 2) return;
    const grupa = cells[0];
    if (!grupa || grupa.length > 140) return;
    if (/^\d+$/.test(grupa.trim())) return; // wiersz tytułowy sekcji ("Lp | TYTUŁ"), nie dana
    if (/^(grupa( interesariuszy)?|kto\?)$/i.test(grupa)) return;
    if (/INTERESARIUSZE PROJEKTU|GRUPY OBJ[EĘ]TE ZMIAN|OCENA SKALI ZMIANY|LICZBA PUNKTÓW|KONIECZNOŚĆ PRZYGOTOWANIA|TERMIN PRZYGOTOWANIA/i.test(grupa)) return;
    groups.push({nazwa: grupa, wplyw: cells.slice(1).filter(Boolean).join(" — ")});
  });
  return groups;
}

// Kamienie milowe występują w dwóch formach zależnie od szablonu:
// A) dedykowana tabela "KLUCZOWE KAMIENIE MILOWE (PROJEKTU|PROGRAMU)" — KAŻDY numerowany
//    wiersz to kamień milowy (Lp | Nazwa | Termin);
// B) harmonogram/etapy ("ETAPY REALIZACJI", "RAMOWY PLAN REALIZACJI", "PLANOWANE DZIAŁANIA I
//    KAMIENIE MILOWE"), gdzie tylko NIEKTÓRE wiersze są kamieniami, oznaczone prefiksem
//    "Kamień milowy:" (starszy wzór) albo skrótem "KM:" (wzór 2026) na początku opisu.
// Kolumny etapu/terminu mają w Wordzie rowspan na wiele wierszy, więc liczba komórek bywa różna —
// termin to pierwsza NIEPUSTA komórka po tej z nazwą, nie zawsze ostatnia w wierszu.
function extractMilestones(tables){
  const milestones = [];
  const dedicatedTable = tables.find(t => Array.from(t.rows).some(r => /NAZWA KAMIENIA/i.test(cellText(r))));
  if (dedicatedTable){
    // Tytuł sekcji ("Lp | NAZWA SEKCJI") ma w pierwszej komórce numer karty (np. "17"), nie do
    // odróżnienia od Lp kamienia milowego samą tylko cyfrą — dlatego zaczynamy DOPIERO za
    // wierszem nagłówka kolumn ("L.p. | NAZWA KAMIENIA | TERMIN..."), a nie od początku tabeli.
    const rows = Array.from(dedicatedTable.rows).map(r => Array.from(r.cells).map(cellText));
    const headerIdx = rows.findIndex(r => r.some(c => /NAZWA KAMIENIA/i.test(c)));
    if (headerIdx !== -1){
      for (let i = headerIdx + 1; i < rows.length; i++){
        const cells = rows[i];
        if (cells.length < 2 || !/^\d+$/.test((cells[0]||"").trim())) continue;
        if (cells[1]) milestones.push({nazwa: cells[1], termin: cells[2] || ""});
      }
    }
  }
  const scheduleTable = tables.find(t => /ETAPY REALIZACJI|RAMOWY PLAN REALIZACJI|PLANOWANE DZIAŁANIA I KAMIENIE MILOWE/i.test(cellText(t.rows[0])));
  if (scheduleTable){
    Array.from(scheduleTable.rows).forEach(row => {
      const cells = Array.from(row.cells).map(cellText);
      const idx = cells.findIndex(c => /^(Kamień milowy|KM)\s*[:\s]/i.test(c));
      if (idx === -1) return;
      const nazwa = cells[idx].replace(/^(Kamień milowy|KM)\s*:?\s*/i, "").trim();
      const termin = cells.slice(idx + 1).find(c => c && c.trim()) || "";
      if (nazwa) milestones.push({nazwa, termin});
    });
  }
  return milestones;
}

// "OSOBY ZAANGAŻOWANE W PROJEKT..." (wzór 2026) zastąpiło "SKŁAD ZESPOŁU PROJEKTOWEGO..."
// (starszy wzór) i ma o kolumnę mniej (bez "szacowane zaangażowanie") — akceptujemy 3 lub 4 komórki.
function extractTeam(tables){
  const team = [];
  const table = tables.find(t => /SKŁAD ZESPOŁU PROJEKTOWEGO|OSOBY ZAANGAŻOWANE W (PROJEKT|PROGRAM)/i.test(cellText(t.rows[0])));
  if (!table) return team;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 3) return;
    const [imie, dzial, rola, zaangazowanie] = cells;
    if (!imie || /^imi. i nazwisko$/i.test(imie)) return;
    team.push({imie, dzial, rola, zaangazowanie: zaangazowanie || ""});
  });
  return team;
}

// "NAJWAŻNIEJSZE RYZYKA PROJEKTU" (uczelnie/projekty, wzór 2026) i "KLUCZOWE RYZYKA PROGRAMOWE"
// (programy) obok starszego "KLUCZOWE RYZYKA PROJEKTU".
function extractRisks(tables){
  const risks = [];
  const table = tables.find(t => /(NAJWAŻNIEJSZE|KLUCZOWE) RYZYKA/i.test(cellText(t.rows[0])));
  if (!table) return risks;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 3) return;
    const [, ryzyko, zarzadzanie] = cells;
    if (!ryzyko || /^ryzyko\b/i.test(ryzyko.trim())) return;
    risks.push({ryzyko, zarzadzanie});
  });
  return risks;
}

// "Sporadyczne zaangażowanie" ma dokładnie ten sam układ kolumn co "Skład zespołu"
// (imię | dział | zadania/rola | termin/zaangażowanie), więc to też są ludzie do podpowiedzi
// w polu "Odpowiedzialny" — dokładamy ich do tej samej listy zespołu.
function extractSporadicTeam(tables){
  const team = [];
  const table = tables.find(t => /SPORADYCZNE ZAANGAŻOWANIE DO PROJEKTU/i.test(cellText(t.rows[0])));
  if (!table) return team;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 3) return;
    const [imie, dzial, rola, zaangazowanie] = cells;
    if (!imie || /^imi. i nazwisko$/i.test(imie)) return;
    team.push({imie, dzial, rola, zaangazowanie: zaangazowanie || ""});
  });
  return team;
}

// Produkty/komponenty: kolumny i ich KOLEJNOŚĆ różnią się między wzorami (stary ma "wartość
// liczbową", nowy jej nie ma i zamienia kolejność terminu/odbiorcy; karta programu w ogóle nie ma
// "produktów", tylko "komponenty programu" z inną nazwą kolumny). Zamiast zakładać stałą pozycję,
// znajdujemy nagłówek (wiersz z komórką "L.p.") i mapujemy kolumny po treści etykiety.
function extractDeliverables(tables){
  const items = [];
  const table = tables.find(t => Array.from(t.rows).some(r =>
    /WYPRACOWANE\s+w\s+ramach\s+projektu\s+PRODUKTY|PLANOWANE\s+PRODUKT|PLANOWANE\s+KOMPONENTY/i.test(cellText(r))));
  if (!table) return items;
  const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
  const headerIdx = rows.findIndex(r => r.some(c => /^L\.?\s?P\.?$/i.test(c.trim())));
  if (headerIdx === -1) return items;
  const header = rows[headerIdx];
  const findCol = re => header.findIndex(c => re.test(c));
  const produktCol = findCol(/PRODUKT|KOMPONENT/i);
  const terminCol = findCol(/TERMIN|DATA DOSTARCZENIA|OKRES REALIZACJI/i);
  const odbiorcaCol = findCol(/ODBIERAJ|ODBIORC|GRONO/i);
  const wartoscCol = findCol(/WARTOŚĆ|LICZBOW|RODZAJ/i);
  for (let r = headerIdx + 1; r < rows.length; r++){
    const cells = rows[r];
    if (!/^\d+$/.test((cells[0] || "").trim())) continue;
    const produkt = produktCol >= 0 ? cells[produktCol] : cells[1];
    if (!produkt) continue;
    items.push({
      produkt,
      wartosc: wartoscCol >= 0 ? (cells[wartoscCol] || "") : "",
      termin: terminCol >= 0 ? (cells[terminCol] || "") : "",
      odbiorca: odbiorcaCol >= 0 ? (cells[odbiorcaCol] || "") : "",
    });
  }
  return items;
}

// Pozycje budżetowe: liczba i kolejność kolumn różni się (czasem jest Lp, czasem nie; czasem
// dochodzi "kwota dofinansowania zewnętrznego"). Zamiast zakładać pozycję, rozpoznajemy komórki
// po TREŚCI w danym wierszu: kwota to komórka złożona głównie z cyfr, pozycja to najdłuższy
// pozostały tekst — działa niezależnie od tego, która to kolumna po kolei.
function extractBudgetItems(tables){
  const items = [];
  const table = tables.find(t => /BUDŻET (PROJEKTU|PROGRAMU)/i.test(cellText(t.rows[0])) && !/SZACUNKOWE/i.test(cellText(t.rows[0])));
  if (!table) return items;
  const isAmount = c => /\d/.test(c) && /^[\d\s.,?]+$/.test(c.trim());
  const isExcludedLabel = c => /^(RAZEM|ŹRÓDŁO FINANSOWANIA|WAŻNE ZAŁOŻENIA|MPK|ZLECENIE|POZYCJA KOSZTOWA|KWOTA)/i.test(c.trim());
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText).filter(Boolean);
    // Etykiety typu "Źródło finansowania" / nagłówek kolumn mogą wylądować w KTÓREJKOLWIEK
    // komórce (nie tylko tej wybranej jako "pozycja" wg długości tekstu) — trzeba sprawdzić cały
    // wiersz, inaczej taki wiersz-etykieta (np. "ŹRÓDŁO FINANSOWANIA* | Budżet centralny IT")
    // zostanie błędnie potraktowany jak pozycja kosztowa.
    if (cells.some(isExcludedLabel)) return;
    const nonLp = cells.filter(c => !/^\d{1,3}$/.test(c.trim()));
    if (nonLp.length < 2) return;
    const amountCell = nonLp.find(isAmount);
    const textCells = nonLp.filter(c => c !== amountCell);
    const pozycja = textCells.sort((a, b) => b.length - a.length)[0];
    if (!pozycja) return;
    items.push({pozycja, kwota: amountCell || ""});
  });
  return items;
}

function extractLinks(tables){
  const links = [];
  const table = tables.find(t => /POWIĄZANIA.*PUNKTY STYKU (PROJEKTU|PROGRAMU)/i.test(cellText(t.rows[0])));
  if (!table) return links;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 2) return;
    const [projekt, zaleznosc, wspolpraca] = cells;
    if (!projekt) return;
    if (/^\d+$/.test(projekt.trim())) return; // wiersz tytułowy sekcji ("Lp | TYTUŁ"), nie dana
    if (/^projekt\/? ?portfel/i.test(projekt)) return;
    links.push({projekt, zaleznosc: zaleznosc || "", wspolpraca: wspolpraca || ""});
  });
  return links;
}

function extractMaintenanceCosts(tables){
  const items = [];
  const table = tables.find(t => /SZACUNKOWE KOSZTY UTRZYMANIA/i.test(cellText(t.rows[0])));
  if (!table) return items;
  const rows = Array.from(table.rows).map(r => Array.from(r.cells).map(cellText));
  const headerIdx = rows.findIndex(r => r.some(c => /^ROK/i.test(c)) && r.some(c => /KATEGORI/i.test(c)));
  if (headerIdx === -1) return items;
  const rokFirst = /^ROK/i.test(rows[headerIdx][0] || "");
  if (rokFirst) {
    // wariant: wiersz = rok, kolumny ROK | kategorie | kwota (np. karta uczelniana)
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const cells = rows[i];
      if (cells.length < 3) break;
      const [rok, kategorie, kwota] = cells;
      if (!rok || /^sum/i.test(rok)) break;
      items.push({rok, kategorie, kwota: kwota || ""});
    }
  } else {
    // wariant: wiersz = kategoria kosztu, kolumny = lata; etykiety lat w kolejnym wierszu
    const years = (rows[headerIdx + 1] || []).filter(c => c && c.trim());
    for (let i = headerIdx + 2; i < rows.length; i++) {
      const cells = rows[i];
      if (cells.length < 2 || !/^\d+$/.test((cells[0] || "").trim())) break;
      const rest = cells.slice(1);
      const kategorie = rest.find(c => c && c.trim() && !/^[\d\s.,]+$/.test(c.trim())) || "";
      const amounts = rest.filter(c => c && c.trim() && /^[\d\s.,]+$/.test(c.trim()));
      if (!kategorie && !amounts.length) continue;
      items.push({rok: years.join(" / "), kategorie, kwota: amounts.join(", ")});
    }
  }
  return items;
}

// Karta projektu Grupy Merito ma stałą, numerowaną strukturę tabel. Parser dopasowuje pola po
// treści etykiety (nie po sztywnej pozycji kolumny/wiersza), ale zakłada te same nagłówki sekcji
// co w referencyjnym szablonie — inny układ karty może nic nie znaleźć (stąd podgląd przed
// zastosowaniem, a nie ciche nadpisanie danych).
function parseKartaHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tables = Array.from(doc.querySelectorAll("table"));
  const team = [...extractTeam(tables), ...extractSporadicTeam(tables)];
  return {
    fields: extractFields(tables),
    groups: extractGroups(tables),
    milestones: extractMilestones(tables),
    team,
    risks: extractRisks(tables),
    deliverables: extractDeliverables(tables),
    budgetItems: extractBudgetItems(tables),
    links: extractLinks(tables),
    maintenanceCosts: extractMaintenanceCosts(tables),
  };
}

/* ---------- localStorage ---------- */

const LS_KEY = "pzz_merito_versions_v1";

function loadVersions(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ return []; }
}
function saveVersions(list){
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function storageIsAvailable(){
  try {
    const t = "__pzz_test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return true;
  } catch(e){ return false; }
}

/* ---------- Drobne komponenty ---------- */

function Badge({tone, children}){
  return <span className={"badge " + tone}>{children}</span>;
}

function Likert({value, onChange, max=5}){
  return (
    <div style={{display:"flex", gap:6}}>
      {Array.from({length:max}, (_,i)=>i+1).map(n => (
        <button key={n} type="button" className="small"
          onClick={()=>onChange(n)}
          style={{
            width:30, height:30, padding:0, fontWeight:700,
            background: value===n ? "var(--accent)" : "#fff",
            color: value===n ? "#fff" : "var(--ink)",
            borderColor: value===n ? "var(--accent)" : "var(--line)",
          }}>{n}</button>
      ))}
    </div>
  );
}

function Field({label, hint, children}){
  return (
    <div className="field">
      <label>{label}</label>
      {children}
      {hint ? <p className="hint" style={{margin:"4px 0 0"}}>{hint}</p> : null}
    </div>
  );
}

function Bar({label, value, max=5, tone}){
  const pct = value==null ? 0 : Math.max(0, Math.min(100, (value/max)*100));
  const color = tone || (value==null ? "#cfd5d9" : value<=2 ? "var(--red)" : value===3 ? "var(--orange)" : "var(--green)");
  return (
    <div className="bar-row">
      <div className="label">{label}</div>
      <div className="bar-track"><div className="bar-fill" style={{width:pct+"%", background:color}}/></div>
      <div className="bar-val">{value==null?"–":value}</div>
    </div>
  );
}

/* ---------- Aplikacja ---------- */

function App(){
  const [state, setState] = useState(newProjectState);
  const [tab, setTab] = useState("dane");
  const [versions, setVersions] = useState(loadVersions);
  const [storageOk] = useState(storageIsAvailable);
  const [showVersions, setShowVersions] = useState(false);
  const [toast, setToast] = useState(null);
  const [kartaImport, setKartaImport] = useState(null);
  const fileInputRef = useRef(null);
  const kartaInputRef = useRef(null);
  const versionsDialogRef = useRef(null);

  useEffect(()=>{
    const d = versionsDialogRef.current;
    if (!d) return;
    if (showVersions && !d.open) d.showModal();
    if (!showVersions && d.open) d.close();
  }, [showVersions]);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 2600);
    return ()=>clearTimeout(t);
  }, [toast]);

  const {surveyTotal, surveyAnsweredCount} = useMemo(()=>{
    let sum = 0, answered = 0;
    const allIds = [...SURVEY.partI.map(q=>q.id), ...SURVEY.partII_items.map(it=>it.id), SURVEY.partII_extra.id, ...SURVEY.partIII.map(q=>q.id)];
    allIds.forEach(id => {
      const v = state.surveyAnswers[id];
      if (v !== null && v !== undefined && v !== ""){ sum += Number(v); answered += 1; }
    });
    return {surveyTotal: sum, surveyAnsweredCount: answered};
  }, [state.surveyAnswers]);
  const level = surveyLevel(surveyTotal, surveyAnsweredCount);

  // Ostatni WYPEŁNIONY pomiar, nie ostatni wiersz tabeli — dodanie pustego "kolejnego pomiaru"
  // na przyszły przegląd nie może cofnąć pulpitu do "brak danych", skoro realny wynik już jest.
  const PCT_FIELDS = ["definicjaSukcesu","przywodztwo","zarzadzanieProjektem","zarzadzanieZmiana"];
  const pctLatest = [...state.pctHistory].reverse().find(p => PCT_FIELDS.some(k => p[k] !== "" && p[k] != null)) || {};
  const pctNums = PCT_FIELDS.map(k => pctLatest[k]).filter(v => v !== "" && v != null).map(Number);
  const pctAvg = pctNums.length ? (pctNums.reduce((a,b)=>a+b,0)/pctNums.length) : null;
  const pctWeakestKey = (() => {
    const labels = {definicjaSukcesu:"Definicja sukcesu", przywodztwo:"Przywództwo / sponsoring", zarzadzanieProjektem:"Zarządzanie projektem", zarzadzanieZmiana:"Zarządzanie zmianą"};
    let worst = null, worstVal = Infinity;
    Object.keys(labels).forEach(k => {
      const v = pctLatest[k];
      if (v !== "" && v != null && Number(v) < worstVal){ worstVal = Number(v); worst = labels[k]; }
    });
    return worst;
  })();

  const adkarRollup = useMemo(()=>{
    const activeCats = CATEGORIES.concat(state.usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
    return ADKAR_DIMS.map(dim => {
      const vals = activeCats
        .map(c => state.adkarByCategory[c.id]?.[dim.id])
        .filter(v => v !== null && v !== undefined && v !== "")
        .map(Number);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      const min = vals.length ? Math.min(...vals) : null;
      const atRisk = activeCats.filter(c => {
        const v = state.adkarByCategory[c.id]?.[dim.id];
        return v !== null && v !== undefined && v !== "" && Number(v) <= 2;
      }).map(c => c.label);
      return {...dim, avg, min, atRiskCount: atRisk.length, atRisk, suggestion: ADKAR_SUGGESTIONS[dim.id]};
    });
  }, [state.adkarByCategory, state.usesOptionalCategory]);

  function categoryBarrier(catId){
    const d = state.adkarByCategory[catId];
    if (!d) return null;
    let worst = null, worstVal = Infinity;
    ADKAR_DIMS.forEach(dim => {
      const v = d[dim.id];
      if (v !== null && v !== undefined && v !== "" && Number(v) < worstVal){ worstVal = Number(v); worst = dim; }
    });
    return worst;
  }

  const actionsByCategory = useMemo(()=>{
    const m = {};
    ALL_CATEGORIES.forEach(c => m[c.id] = state.actions.filter(a => a.categoryId === c.id));
    return m;
  }, [state.actions]);

  const statusCounts = useMemo(()=>{
    const m = {all: state.actions.length};
    STATUS_OPTIONS.forEach(s => m[s] = state.actions.filter(a=>a.status===s).length);
    m.linkedToFlexi = state.actions.filter(a => (a.flexiRef||"").trim() !== "").length;
    return m;
  }, [state.actions]);

  const signals = useMemo(()=>({
    brakOdpowiedzialnego: state.actions.filter(a => !(a.odpowiedzialny||"").trim()).length,
    brakTerminu: state.actions.filter(a => !(a.termin||"").trim() && !(a.kamien||"").trim()).length,
    zablokowane: state.actions.filter(a => a.status === "Zablokowane").length,
  }), [state.actions]);

  /* -------- persistence -------- */

  function persistAsNewVersion(name){
    const entry = {id:cryptoId(), name: name || (state.project.nazwa || "Bez nazwy"), savedAt: new Date().toISOString(), data: state};
    const next = [entry, ...versions].slice(0, 50);
    setVersions(next);
    const ok = saveVersions(next);
    setToast(ok
      ? "Wersja zapisana: " + entry.name
      : "Uwaga: przeglądarka zablokowała zapis na dysku — wersja jest widoczna tylko do zamknięcia karty. Użyj „Eksport JSON”, żeby jej nie stracić.");
  }
  function loadVersion(entry){
    setState(sanitizeProjectState(entry.data));
    setShowVersions(false);
    setToast("Wczytano wersję: " + entry.name);
  }
  function deleteVersion(id){
    const next = versions.filter(v=>v.id!==id);
    setVersions(next);
    saveVersions(next);
  }
  function exportJson(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (state.project.nazwa || "pzz") + ".json";
    a.click(); URL.revokeObjectURL(url);
  }
  function importJson(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setState(sanitizeProjectState(data));
        setToast("Wczytano plik: " + file.name);
      } catch(e){ alert("Nie udało się wczytać pliku JSON."); }
    };
    reader.readAsText(file);
  }

  const EMPTY_KARTA_IMPORT = {fields:{}, groups:[], milestones:[], team:[], risks:[], deliverables:[], budgetItems:[], links:[], maintenanceCosts:[]};

  function handleKartaFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      mammoth.convertToHtml({arrayBuffer: reader.result})
        .then(result => {
          const parsed = parseKartaHtml(result.value);
          const found = Object.keys(parsed.fields).length + parsed.groups.length + parsed.milestones.length
            + parsed.team.length + parsed.risks.length + parsed.deliverables.length + parsed.budgetItems.length
            + parsed.links.length + parsed.maintenanceCosts.length;
          setKartaImport(found === 0
            ? {fileName: file.name, ...EMPTY_KARTA_IMPORT, failed:true}
            : {fileName: file.name, ...parsed, failed:false});
        })
        .catch(() => setKartaImport({fileName: file.name, ...EMPTY_KARTA_IMPORT, failed:true}));
    };
    reader.readAsArrayBuffer(file);
  }
  function applyKartaFields(){
    if (!kartaImport) return;
    setState(s => ({...s, project: {...s.project, ...kartaImport.fields}}));
    setToast("Zastosowano dane z karty projektu.");
  }
  function applyKartaGroups(){
    if (!kartaImport) return;
    setState(s => {
      const existingNames = new Set(s.groups.map(g => (g.nazwa||"").trim().toLowerCase()));
      const toAdd = kartaImport.groups
        .filter(g => g.nazwa && !existingNames.has(g.nazwa.trim().toLowerCase()))
        .map(g => ({id:cryptoId(), nazwa:g.nazwa, wplyw:g.wplyw, categoryId: ""}));
      return {...s, groups: [...s.groups, ...toAdd]};
    });
    setToast("Dodano grupy interesariuszy z karty projektu — przypisz im właściwe kategorie w zakładce Diagnoza.");
  }
  function applyKartaMilestones(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.milestones.map(m => (m.nazwa||"").trim().toLowerCase()));
      const toAdd = kartaImport.milestones
        .filter(m => m.nazwa && !existing.has(m.nazwa.trim().toLowerCase()))
        .map(m => ({id:cryptoId(), ...m}));
      return {...s, milestones: [...s.milestones, ...toAdd]};
    });
    setToast("Dodano kamienie milowe z karty projektu — będą podpowiadane w Planie działań.");
  }
  function applyKartaTeam(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.teamMembers.map(m => (m.imie||"").trim().toLowerCase()));
      const toAdd = kartaImport.team
        .filter(m => m.imie && !existing.has(m.imie.trim().toLowerCase()))
        .map(m => ({id:cryptoId(), ...m}));
      return {...s, teamMembers: [...s.teamMembers, ...toAdd]};
    });
    setToast("Dodano skład zespołu z karty projektu — będzie podpowiadany jako „Odpowiedzialny”.");
  }
  function applyKartaRisks(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.risks.map(r => (r.ryzyko||"").trim().toLowerCase()));

        .filter(r => r.ryzyko && !existing.has(r.ryzyko.trim().toLowerCase()))

    });
    setToast("Dodano ryzyka projektu z karty (referencyjnie, do wglądu w Danych projektu).");
  }
  function applyKartaDeliverables(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.deliverables.map(d => (d.produkt||"").trim().toLowerCase()));
      const toAdd = kartaImport.deliverables
        .filter(d => d.produkt && !existing.has(d.produkt.trim().toLowerCase()))

      return {...s, deliverables: [...s.deliverables, ...toAdd]};
    });
    setToast("Dodano wypracowane produkty z karty (referencyjnie).");
  }
  function applyKartaBudgetItems(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.budgetItems.map(b => (b.pozycja||"").trim().toLowerCase()));
      const toAdd = kartaImport.budgetItems
        .filter(b => b.pozycja && !existing.has(b.pozycja.trim().toLowerCase()))
        .map(b => ({id:cryptoId(), ...b}));
      return {...s, budgetItems: [...s.budgetItems, ...toAdd]};
    });
    setToast("Dodano pozycje budżetowe z karty (referencyjnie).");
  }
  function applyKartaLinks(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.links.map(l => (l.projekt||"").trim().toLowerCase()));
      const toAdd = kartaImport.links
        .filter(l => l.projekt && !existing.has(l.projekt.trim().toLowerCase()))
        .map(l => ({id:cryptoId(), ...l}));
      return {...s, links: [...s.links, ...toAdd]};
    });
    setToast("Dodano powiązania z innymi projektami (referencyjnie).");
  }
  function applyKartaMaintenanceCosts(){
    if (!kartaImport) return;
    setState(s => {
      const existing = new Set(s.maintenanceCosts.map(m => (m.rok||"").trim().toLowerCase()));
      const toAdd = kartaImport.maintenanceCosts
        .filter(m => m.rok && !existing.has(m.rok.trim().toLowerCase()))
        .map(m => ({id:cryptoId(), ...m}));
      return {...s, maintenanceCosts: [...s.maintenanceCosts, ...toAdd]};
    });
    setToast("Dodano koszty utrzymania po projekcie (referencyjnie).");
  }
  function applyKartaAll(){
    applyKartaFields();
    applyKartaGroups();
    applyKartaMilestones();
    applyKartaTeam();
    applyKartaRisks();
    applyKartaDeliverables();
    applyKartaBudgetItems();
    applyKartaLinks();
    applyKartaMaintenanceCosts();
    setToast("Zastosowano wszystko, co udało się wykryć w karcie projektu.");
  }
  function dismissKartaImport(){ setKartaImport(null); }

  function exportExcel(){
    const wb = XLSX.utils.book_new();
    const activeCategories = CATEGORIES.concat(state.usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);

    const daneRows = [
      ["PLAN ZARZĄDZANIA ZMIANĄ — DANE PROJEKTU"],
      [],
      ["Nazwa projektu/programu", state.project.nazwa],
      ["Sponsor", state.project.sponsor],
      ["PM", state.project.pm],
      ["CM (jeśli powołany)", state.project.cm],
      ["Typ projektu", state.project.typProjektu],
      ["Okres realizacji projektu", state.project.okresRealizacji],
      ["Termin przygotowania PZZ", state.project.terminPrzygotowania],
      ["Częstotliwość przeglądu", state.project.czestotliwosc],
      [],
      ["Nick/symbol", state.project.nick],
      ["Filie objęte projektem", state.project.filie],
      ["Budżet razem (brutto)", state.project.budzetRazem],
      ["Źródło finansowania", state.project.zrodloFinansowania],
      ["Związek ze strategią", state.project.zwiazekZeStrategia],
      ["Powody podjęcia projektu", state.project.powodyProjektu],
      ["Cel projektu", state.project.celProjektu],
      ["Główna korzyść biznesowa", state.project.glownaKorzysc],
      ["Wyłączenia", state.project.wylaczenia],
      [],
      ["Liczba punktów w ankiecie skali zmiany", surveyTotal],
      ["Poziom zmiany", level.complete ? (level.poziom + " — " + level.label) : "Ankieta nieukończona"],
      ["Ocena ryzyka", level.risk],
      [],
      ["KAMIENIE MILOWE Z KARTY PROJEKTU"],
      ["Kamień milowy", "Termin"],
      ...state.milestones.map(m => [m.nazwa, m.termin]),
      [],
      ["SKŁAD ZESPOŁU Z KARTY PROJEKTU"],
      ["Imię i nazwisko", "Dział", "Rola", "Zaangażowanie"],
      ...state.teamMembers.map(t => [t.imie, t.dzial, t.rola, t.zaangazowanie]),
      [],
      ["KLUCZOWE RYZYKA Z KARTY PROJEKTU"],
      ["Ryzyko", "Sposób zarządzania"],
      ...state.risks.map(r => [r.ryzyko, r.zarzadzanie]),
      [],
      ["WYPRACOWANE PRODUKTY Z KARTY PROJEKTU"],
      ["Produkt", "Wartość", "Termin", "Odbiorca"],
      ...state.deliverables.map(d => [d.produkt, d.wartosc, d.termin, d.odbiorca]),
      [],
      ["POZYCJE BUDŻETOWE Z KARTY PROJEKTU"],
      ["Pozycja", "Kwota"],
      ...state.budgetItems.map(b => [b.pozycja, b.kwota]),
      [],
      ["POWIĄZANIA Z INNYMI PROJEKTAMI"],
      ["Projekt", "Zależność", "Współpraca"],
      ...state.links.map(l => [l.projekt, l.zaleznosc, l.wspolpraca]),
      [],
      ["KOSZTY UTRZYMANIA PO PROJEKCIE"],
      ["Rok", "Kategorie kosztów", "Kwota"],
      ...state.maintenanceCosts.map(m => [m.rok, m.kategorie, m.kwota]),
    ];
    const wsDane = XLSX.utils.aoa_to_sheet(daneRows);
    XLSX.utils.book_append_sheet(wb, wsDane, "Dane projektu");

    const diagRows = [
      ["PCT — KONDYCJA CAŁEGO PRZEDSIĘWZIĘCIA"],
      ["Data","Punkt kontrolny","Definicja sukcesu","Przywództwo/sponsoring","Zarządzanie projektem","Zarządzanie zmianą","Średnia PCT","Decyzja/działanie","Kolejny przegląd"],
      ...state.pctHistory.map(p => {
        const nums = [p.definicjaSukcesu,p.przywodztwo,p.zarzadzanieProjektem,p.zarzadzanieZmiana].filter(v=>v!=="" && v!=null).map(Number);
        const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1) : "";
        return [p.data,p.punktKontrolny,p.definicjaSukcesu,p.przywodztwo,p.zarzadzanieProjektem,p.zarzadzanieZmiana,avg,p.decyzja,p.kolejnyPrzeglad];
      }),
      [],
      ["GRUPY OBJĘTE ZMIANĄ"],
      ["Grupa","Co zmienia się w ich pracy?","Kategoria"],
      ...state.groups.map(g => [g.nazwa, g.wplyw, ALL_CATEGORIES.find(c=>c.id===g.categoryId)?.label || ""]),
      [],
      ["ADKAR PER KATEGORIA (1-5)"],
      ["Kategoria","Awareness","Desire","Knowledge","Ability","Reinforcement","Największa bariera","Wniosek"],
      ...activeCategories.map(c => {
        const d = state.adkarByCategory[c.id] || {};
        const b = categoryBarrier(c.id);
        return [c.label, d.awareness, d.desire, d.knowledge, d.ability, d.reinforcement, b ? b.label : "", d.wniosek || ""];
      }),
      [],
      ["ADKAR — SZYBKI SKAN"],
      ["Element","Średnia","Min","Kategorie z oceną ≤2","Podpowiedź"],
      ...adkarRollup.map(r => [r.label, r.avg!=null?r.avg.toFixed(2):"", r.min, r.atRisk.join("; "), r.suggestion]),
    ];
    const wsDiag = XLSX.utils.aoa_to_sheet(diagRows);
    XLSX.utils.book_append_sheet(wb, wsDiag, "Diagnoza");

    const planRows = [
      ["Kategoria","Działanie","Kamień milowy/etap","Termin","Odpowiedzialny","Jak sprawdzimy gotowość","Kanały komunikacji","Zadanie w Flexi","Status"],
      ...state.actions.map(a => [
        ALL_CATEGORIES.find(c=>c.id===a.categoryId)?.label || "",
        a.dzialanie, a.kamien, a.termin, a.odpowiedzialny, a.weryfikacja, a.kanaly, a.flexiRef, a.status,
      ]),
    ];
    const wsPlan = XLSX.utils.aoa_to_sheet(planRows);
    XLSX.utils.book_append_sheet(wb, wsPlan, "Plan działań");

    const pulpitRows = [
      ["PULPIT PZZ"],
      ["Skala zmiany", level.complete ? (surveyTotal + " pkt — poziom " + level.poziom + " (" + level.label + ")") : "Ankieta nieukończona"],
      ["PCT — średnia ostatniego pomiaru", pctAvg!=null?pctAvg.toFixed(1):""],
      ["PCT — najsłabszy obszar", pctWeakestKey || ""],
      [],
      ["Wszystkie działania", statusCounts.all],
      ...STATUS_OPTIONS.map(s => [s, statusCounts[s]]),
      ["Powiązane z zadaniem w Flexi", statusCounts.linkedToFlexi],
      [],
      ["SYGNAŁY DO DECYZJI"],
      ["Brak odpowiedzialnego", signals.brakOdpowiedzialnego],
      ["Brak terminu / kamienia milowego", signals.brakTerminu],
      ["Zablokowane", signals.zablokowane],
    ];
    const wsPulpit = XLSX.utils.aoa_to_sheet(pulpitRows);
    XLSX.utils.book_append_sheet(wb, wsPulpit, "Pulpit");

    XLSX.writeFile(wb, (state.project.nazwa || "PZZ") + "_export.xlsx");
  }

  /* -------- drobne mutatory -------- */

  function setProjectField(key, value){
    setState(s => ({...s, project: {...s.project, [key]: value}}));
  }
  function setSurveyAnswer(id, value){
    setState(s => ({...s, surveyAnswers: {...s.surveyAnswers, [id]: value}}));
  }
  function setPct(idx, key, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], [key]: value};
      return {...s, pctHistory: hist};
    });
  }
  function addPctCheckpoint(){
    setState(s => ({...s, pctHistory: [...s.pctHistory, {id:cryptoId(), data:"", punktKontrolny:"", definicjaSukcesu:"", przywodztwo:"", zarzadzanieProjektem:"", zarzadzanieZmiana:"", decyzja:"", kolejnyPrzeglad:""}]}));
  }
  function addGroup(){
    setState(s => ({...s, groups: [...s.groups, {id:cryptoId(), nazwa:"", wplyw:"", categoryId: ""}]}));
  }
  function updateGroup(id, key, value){
    setState(s => ({...s, groups: s.groups.map(g => g.id===id ? {...g, [key]:value} : g)}));
  }
  function removeGroup(id){
    setState(s => ({...s, groups: s.groups.filter(g=>g.id!==id)}));
  }
  function setAdkar(catId, key, value){
    setState(s => ({...s, adkarByCategory: {...s.adkarByCategory, [catId]: {...s.adkarByCategory[catId], [key]: value}}}));
  }
  function enableOptionalCategory(){
    setState(s => ({...s, usesOptionalCategory: true}));
  }
  function addAction(categoryId){
    if ((actionsByCategory[categoryId]||[]).length >= MAX_ACTIONS_PER_CATEGORY) return;
    setState(s => ({...s, actions: [...s.actions, {
      id:cryptoId(), categoryId, dzialanie:"", kamien:"", termin:"", odpowiedzialny:"",
      weryfikacja:"", kanaly:"", flexiRef:"", status:"Do zaplanowania",
    }]}));
  }
  function updateAction(id, key, value){
    setState(s => ({...s, actions: s.actions.map(a => a.id===id ? {...a, [key]:value} : a)}));
  }
  function removeAction(id){
    setState(s => ({...s, actions: s.actions.filter(a=>a.id!==id)}));
  }
  function toggleChecklist(key){
    setState(s => ({...s, checklist12: {...s.checklist12, [key]: !s.checklist12[key]}}));
  }

  // Poziom 3 (duża zmiana) dostaje pełny Diagnoza/Plan działań/Pulpit (PCT + ADKAR + plan);
  // poziom 1-2 dostaje tylko uproszczoną checklistę — nie pokazujemy PCT/ADKAR/planu, dopóki
  // ankieta nie wskaże, że zmiana jest na tyle duża, żeby ich potrzebować.
  // Obie flagi liczone raz i używane też przy renderze w <main> — żeby warunek nie rozjechał
  // się między tabsDef i renderem (tak jak się rozjechał, zanim ta flaga istniała).
  const canSeeChecklist = level.complete && level.poziom < 3;
  const canSeeFullPlan = level.complete && level.poziom === 3;
  const tabsDef = [
    {id:"dane", label:"Dane projektu"},
    {id:"ankieta", label:"Ankieta — skala zmiany"},
    canSeeChecklist ? {id:"checklisty", label:"Checklisty (poziom " + level.poziom + ")"} : null,
    canSeeFullPlan ? {id:"diagnoza", label:"Diagnoza"} : null,
    canSeeFullPlan ? {id:"plan", label:"Plan działań"} : null,
    canSeeFullPlan ? {id:"pulpit", label:"Pulpit"} : null,
    {id:"przewodnik", label:"Przewodnik"},
  ].filter(Boolean);

  useEffect(()=>{
    if (!tabsDef.some(t => t.id === tab)) setTab("dane");
  }, [tab, tabsDef]);

  return (
    <React.Fragment>
      <header className="app">
        <div>
          <h1>Plan zarządzania zmianą — Grupa Merito</h1>
          <div className="sub">{state.project.nazwa || "Nowy projekt"} · {level.complete ? (surveyTotal + " pkt · Poziom " + level.poziom + " (" + level.label + ")") : ("ankieta: " + surveyAnsweredCount + "/" + SURVEY_QUESTION_COUNT + " pytań")}</div>
        </div>
        <div className="toolbar">
          <button className="ghost" onClick={()=>setShowVersions(true)}>Wersje ({versions.length})</button>
          <button className="ghost" onClick={()=>persistAsNewVersion(state.project.nazwa)}>Zapisz wersję</button>
          <button className="ghost" onClick={exportJson}>Eksport JSON</button>
          <button className="primary" onClick={exportExcel}>Eksport Excel</button>
          <input ref={fileInputRef} type="file" accept=".json" style={{display:"none"}}
            onChange={e => { if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=""; }} />
          <button className="ghost" onClick={()=>fileInputRef.current.click()}>Wczytaj JSON</button>
        </div>
      </header>

      <nav className="tabs">
        {tabsDef.map(t => (
          <button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </nav>

      <main>
        {!storageOk && (
          <div className="banner warn">
            Ta przeglądarka blokuje lokalny zapis (localStorage) — np. tryb prywatny albo ustawienia bezpieczeństwa.
            „Zapisz wersję” nie przetrwa zamknięcia karty. Używaj „Eksport JSON” / „Wczytaj JSON”, żeby nie stracić pracy.
          </div>
        )}
        {tab==="dane" && <DaneProjektu project={state.project} setField={setProjectField} level={level} surveyTotal={surveyTotal}
          kartaInputRef={kartaInputRef} onKartaFile={handleKartaFile}
          kartaImport={kartaImport} onApplyKartaFields={applyKartaFields} onApplyKartaGroups={applyKartaGroups}
          onApplyKartaMilestones={applyKartaMilestones} onApplyKartaTeam={applyKartaTeam} onApplyKartaRisks={applyKartaRisks}
          onApplyKartaDeliverables={applyKartaDeliverables} onApplyKartaBudgetItems={applyKartaBudgetItems}
          onApplyKartaLinks={applyKartaLinks} onApplyKartaMaintenanceCosts={applyKartaMaintenanceCosts}
          onApplyKartaAll={applyKartaAll}
          onDismissKarta={dismissKartaImport}
          milestones={state.milestones} teamMembers={state.teamMembers} risks={state.risks}
          deliverables={state.deliverables} budgetItems={state.budgetItems} links={state.links} maintenanceCosts={state.maintenanceCosts}
        />}
        {tab==="ankieta" && <Ankieta answers={state.surveyAnswers} setAnswer={setSurveyAnswer} total={surveyTotal} level={level}/>}
        {tab==="checklisty" && canSeeChecklist && <Checklisty level={level} checklist={state.checklist12} toggle={toggleChecklist}/>}
        {tab==="diagnoza" && canSeeFullPlan && <Diagnoza
          state={state} pctLatest={pctLatest} pctAvg={pctAvg} pctWeakestKey={pctWeakestKey}
          setPct={setPct} addPctCheckpoint={addPctCheckpoint}
          addGroup={addGroup} updateGroup={updateGroup} removeGroup={removeGroup}
          setAdkar={setAdkar} categoryBarrier={categoryBarrier} adkarRollup={adkarRollup}
          usesOptionalCategory={state.usesOptionalCategory} enableOptionalCategory={enableOptionalCategory}
        />}
        {tab==="plan" && canSeeFullPlan && <PlanDzialan
          actionsByCategory={actionsByCategory} categoryBarrier={categoryBarrier}
          adkarByCategory={state.adkarByCategory} groups={state.groups}
          addAction={addAction} updateAction={updateAction} removeAction={removeAction}
          usesOptionalCategory={state.usesOptionalCategory}
          milestones={state.milestones} teamMembers={state.teamMembers}
        />}
        {tab==="pulpit" && canSeeFullPlan && <Pulpit
          project={state.project} level={level} surveyTotal={surveyTotal}
          pctAvg={pctAvg} pctWeakestKey={pctWeakestKey} statusCounts={statusCounts} signals={signals}
          goTo={setTab}
        />}
        {tab==="przewodnik" && <Przewodnik/>}
      </main>

      <dialog ref={versionsDialogRef} onClose={()=>setShowVersions(false)} onCancel={()=>setShowVersions(false)}>
        <div className="inner">
          <div className="flex-between"><h2 style={{margin:0}}>Zapisane wersje</h2><button className="small" onClick={()=>setShowVersions(false)}>Zamknij</button></div>
          <p className="hint">Wersje są zapisywane lokalnie w tej przeglądarce.</p>
          <div className="versions-list">
            {versions.length===0 && <div className="row muted">Brak zapisanych wersji.</div>}
            {versions.map(v => (
              <div className="row" key={v.id}>
                <div>
                  <div>{v.name}</div>
                  <div className="muted" style={{fontSize:11}}>{new Date(v.savedAt).toLocaleString("pl-PL")}</div>
                </div>
                <div style={{display:"flex", gap:6}}>
                  <button className="small" onClick={()=>loadVersion(v)}>Wczytaj</button>
                  <button className="small" onClick={()=>deleteVersion(v.id)}>Usuń</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </dialog>

      {toast && <div style={{position:"fixed", bottom:16, right:16, background:"var(--ink)", color:"#fff", padding:"10px 16px", borderRadius:8, fontSize:13}}>{toast}</div>}

      <footer className="app">Plan Zarządzania Zmianą · Grupa Merito · wersja robocza</footer>
    </React.Fragment>
  );
}

const KARTA_FIELD_LABELS = {
  nazwa: "Nazwa projektu/programu", nick: "Nick/symbol", sponsor: "Sponsor", pm: "PM / Lider projektu",
  typProjektu: "Typ projektu", filie: "Filie objęte projektem", zwiazekZeStrategia: "Związek ze strategią",
  okresRealizacji: "Okres realizacji", powodyProjektu: "Powody podjęcia projektu", celProjektu: "Cel projektu",
  glownaKorzysc: "Główna korzyść biznesowa", budzetRazem: "Budżet razem (brutto)",
  wylaczenia: "Wyłączenia", zrodloFinansowania: "Źródło finansowania",
};

function KartaImportSection({title, count, previewPills, onApply, applyLabel}){
  if (count === 0) return null;
  return (
    <React.Fragment>
      <p className="hint" style={{margin:"0 0 6px"}}>{title} ({count}):</p>
      {previewPills && <div className="pill-list" style={{marginBottom:8}}>{previewPills}</div>}
      <button className="small" onClick={onApply} style={{marginBottom:14}}>{applyLabel}</button>
    </React.Fragment>
  );
}

function DaneProjektu({project, setField, level, surveyTotal, kartaInputRef, onKartaFile, kartaImport,
  onApplyKartaFields, onApplyKartaGroups, onApplyKartaMilestones, onApplyKartaTeam, onApplyKartaRisks,
  onApplyKartaDeliverables, onApplyKartaBudgetItems, onApplyKartaLinks, onApplyKartaMaintenanceCosts, onApplyKartaAll,
  onDismissKarta, milestones, teamMembers, risks, deliverables, budgetItems, links, maintenanceCosts}){
  const hasReference = milestones.length>0 || teamMembers.length>0 || risks.length>0 || deliverables.length>0 || budgetItems.length>0 || links.length>0 || maintenanceCosts.length>0;
  return (
    <React.Fragment>
      <div className="card">
        <h2>Wczytaj kartę projektu</h2>
        <p className="hint">
          Podaj kartę projektu (.docx, standardowy szablon Grupy Merito) — narzędzie wyciąga z niej praktycznie wszystko:
          dane ogólne, cel i kontekst, wyłączenia, budżet, grupy interesariuszy, harmonogram (kamienie milowe), skład
          zespołu (w tym sporadyczne zaangażowanie), kluczowe ryzyka, produkty projektu i powiązania z innymi projektami.
          Nic nie zostanie nadpisane bez Twojej zgody — najpierw zobaczysz podgląd i sam wybierasz, co zastosować.
        </p>
        <input ref={kartaInputRef} type="file" accept=".docx" style={{display:"none"}}
          onChange={e => { if (e.target.files[0]) onKartaFile(e.target.files[0]); e.target.value=""; }} />
        <button onClick={()=>kartaInputRef.current.click()}>Wybierz plik karty (.docx)</button>

        {kartaImport && kartaImport.failed && (
          <div className="banner warn" style={{marginTop:14}}>
            Nie rozpoznano niczego w pliku „{kartaImport.fileName}”. To może nie być karta projektu w standardowym
            szablonie Grupy Merito (albo układ tabel się różni) — wpisz dane ręcznie poniżej.
            <div style={{marginTop:8}}><button className="small" onClick={onDismissKarta}>Zamknij</button></div>
          </div>

        {kartaImport && !kartaImport.failed && (
          <div className="action-row" style={{marginTop:14}}>

            {Object.keys(kartaImport.fields).length > 0 ? (
              <table style={{marginBottom:12}}>

            <KartaImportSection title="Grupy interesariuszy" count={kartaImport.groups.length} onApply={onApplyKartaGroups}
              applyLabel={"Dodaj " + kartaImport.groups.length + " grup interesariuszy"}
              previewPills={kartaImport.groups.map((g,i) => <span key={i} className="pill">{g.nazwa}</span>)}/>

            <KartaImportSection title="Kamienie milowe z harmonogramu" count={kartaImport.milestones.length} onApply={onApplyKartaMilestones}
              applyLabel={"Dodaj " + kartaImport.milestones.length + " kamieni milowych"}
              previewPills={kartaImport.milestones.map((m,i) => <span key={i} className="pill">{m.nazwa}{m.termin?" — "+m.termin:""}</span>)}/>

            <KartaImportSection title="Skład zespołu (w tym sporadyczne zaangażowanie)" count={kartaImport.team.length} onApply={onApplyKartaTeam}
              applyLabel={"Dodaj " + kartaImport.team.length + " osób zespołu"}
              previewPills={kartaImport.team.map((t,i) => <span key={i} className="pill">{t.imie}</span>)}/>

            <KartaImportSection title="Kluczowe ryzyka projektu" count={kartaImport.risks.length} onApply={onApplyKartaRisks}
              applyLabel={"Dodaj " + kartaImport.risks.length + " ryzyk (referencyjnie)"}/>

            <KartaImportSection title="Wypracowane produkty" count={kartaImport.deliverables.length} onApply={onApplyKartaDeliverables}
              applyLabel={"Dodaj " + kartaImport.deliverables.length + " produktów (referencyjnie)"}
              previewPills={kartaImport.deliverables.map((d,i) => <span key={i} className="pill">{d.produkt}</span>)}/>

            <KartaImportSection title="Pozycje budżetowe" count={kartaImport.budgetItems.length} onApply={onApplyKartaBudgetItems}
              applyLabel={"Dodaj " + kartaImport.budgetItems.length + " pozycji budżetowych (referencyjnie)"}/>

            <KartaImportSection title="Powiązania z innymi projektami" count={kartaImport.links.length} onApply={onApplyKartaLinks}
              applyLabel={"Dodaj " + kartaImport.links.length + " powiązań (referencyjnie)"}/>

            <KartaImportSection title="Koszty utrzymania po projekcie" count={kartaImport.maintenanceCosts.length} onApply={onApplyKartaMaintenanceCosts}
              applyLabel={"Dodaj " + kartaImport.maintenanceCosts.length + " pozycji (referencyjnie)"}/>

            <div><button className="small" onClick={onDismissKarta}>Odrzuć podgląd</button></div>
