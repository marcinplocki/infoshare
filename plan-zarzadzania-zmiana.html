<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zarządzania zmianą (PZZ) — Grupa Merito</title>
<meta name="description" content="Uproszczony Plan Zarządzania Zmianą wg szablonu Grupy Merito.">
<meta name="theme-color" content="#0F2027">
<style>
  :root{
    --ink:#0F2027; --ink-soft:#27404a; --paper:#f7f8f9; --card:#ffffff;
    --line:#dfe3e6; --muted:#6b7680; --accent:#0F7173; --accent-soft:#e3f1f1;
    --red:#b3261e; --red-bg:#fdeceb; --orange:#a15c00; --orange-bg:#fdf0dc;
    --green:#1e6b3c; --green-bg:#e7f5ec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);}
  header.app{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
  header.app h1{font-size:16px;margin:0;font-weight:600;}
  header.app .sub{font-size:12px;opacity:.75;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--card);padding:7px 12px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.small{padding:4px 9px;font-size:12px;}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;background:var(--paper);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);}
  nav.tabs button{border:none;background:transparent;padding:10px 14px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:500;}
  nav.tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset;}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  .card h2{margin:0 0 4px;font-size:16px;}
  .card h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .card p.hint{color:var(--muted);font-size:12.5px;margin:2px 0 14px;}
  .grid{display:grid;gap:12px;}
  .grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .grid.cols4{grid-template-columns:repeat(4,minmax(0,1fr));}
  @media (max-width:700px){.grid.cols2,.grid.cols3,.grid.cols4{grid-template-columns:1fr;}}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:52px;}
  .field{margin-bottom:10px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .badge.orange{background:var(--orange-bg);color:var(--orange);}
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.gray{background:#eceef0;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th,table td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;}
  table th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .bar-row .label{width:150px;font-size:12.5px;flex:none;}
  .bar-track{flex:1;height:8px;background:#eceef0;border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-val{width:26px;text-align:right;font-size:12px;color:var(--muted);flex:none;}
  .pill-list{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:20px;font-size:12px;}
  .banner{border-radius:9px;padding:12px 16px;font-size:13px;margin-bottom:14px;}
  .banner.info{background:var(--accent-soft);color:var(--ink-soft);}
  .banner.warn{background:var(--orange-bg);color:var(--orange);}
  .action-row{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:#fbfcfc;}
  .action-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .muted{color:var(--muted);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .checklist label.cb{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin-bottom:8px;cursor:pointer;}
  .checklist input[type=checkbox]{margin-top:3px;width:auto;}
  footer.app{text-align:center;color:var(--muted);font-size:11.5px;padding:20px;}
  .tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);}
  .versions-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .versions-list .row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;}
  .versions-list .row:last-child{border-bottom:none;}
  dialog{border:none;border-radius:10px;padding:0;max-width:520px;width:92vw;}
  dialog .inner{padding:20px;}
  dialog::backdrop{background:rgba(15,32,39,.45);}
</style>
</head>
<body>
<div id="root">Wczytywanie…</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin></script>

<script type="text/plain" id="app-source">
const {useState, useMemo, useEffect, useRef} = React;

/* ---------- Model referencyjny (zgodny z arkuszem PZZ Grupy Merito) ---------- */

const CATEGORIES = [
  {id:"kierunek", label:"Nadają kierunek i usuwają bariery"},
  {id:"przelozeni", label:"Bezpośredni przełożeni — usuwają bariery i/lub sami zmieniają nawyki"},
  {id:"nowezasady", label:"Pracują według nowych zasad"},
  {id:"wdrozenie", label:"Przygotowują i wspierają wdrożenie"},
];
const OPTIONAL_CATEGORY = {id:"klienci", label:"Klienci / studenci (zewnętrzni odbiorcy zmiany) — opcjonalna, do przetestowania", optional:true};
const ALL_CATEGORIES = [...CATEGORIES, OPTIONAL_CATEGORY];
const MAX_ACTIONS_PER_CATEGORY = 3;
const MAX_WIP_ACTIONS = 5;

const ADKAR_DIMS = [
  {id:"awareness", label:"Awareness", sub:"świadomość potrzeby zmiany"},
  {id:"desire", label:"Desire", sub:"chęć wspierania i uczestnictwa w zmianie"},
  {id:"knowledge", label:"Knowledge", sub:"wiedza, jak pracować w nowy sposób"},
  {id:"ability", label:"Ability", sub:"praktyczne umiejętności pracy w nowy sposób"},
  {id:"reinforcement", label:"Reinforcement", sub:"trwałe stosowanie nowego sposobu pracy"},
];
const ADKAR_SUGGESTIONS = {
  awareness: "Zaplanuj wspólny rezultat wyjaśniający sens i rolę w zmianie.",
  desire: "Pokaż korzyści, daj wpływ i uruchom widoczne sponsorstwo.",
  knowledge: "Zapewnij wspólną bazę wiedzy z modułami dla różnych ról.",
  ability: "Dodaj ćwiczenia, testy i wsparcie w rzeczywistej pracy.",
  reinforcement: "Ustal właścicieli, pomiary, przeglądy i sposób reagowania na powrót do starych praktyk.",
};

const STATUS_OPTIONS = ["Do zaplanowania","W realizacji","Do weryfikacji","Zablokowane","Zrealizowane"];
const CHANNEL_SUGGESTIONS = ["mail","Intranet GM","Teams","spotkanie stacjonarne","spotkanie online","ankieta","SharePoint"];

const SURVEY = {
  partI: [
    {id:"i1", q:"Ilu obszarów działalności dotyka zmiana?", hint:"1 – jeden obszar … 5 – praktycznie wszystkie obszary"},
    {id:"i2", q:"Ilu pracowników dotyka zmiana?", hint:"1 – do 100 osób … 5 – powyżej 300 osób"},
    {id:"i3", q:"W jakim stopniu pracownicy rozumieją, po co wprowadzana jest zmiana?", hint:"1 – rozumieją sens … 5 – brak spójnego zrozumienia"},
    {id:"i4", q:"Ile mamy czasu na przygotowanie pracowników do zmiany?", hint:"1 – dużo czasu … 5 – brak czasu, zmiana musi być wdrożona bardzo szybko"},
  ],
  partII_items: [
    {id:"ii_procesy", label:"Procesy / sposób pracy"},
    {id:"ii_it", label:"Systemy IT, inne narzędzia"},
    {id:"ii_role", label:"Role i zakres obowiązków"},
    {id:"ii_nawyki", label:"Nawyki i codzienny sposób pracy"},
    {id:"ii_warunki", label:"Warunki pracy (ocena, nagradzanie, benefity)"},
    {id:"ii_lokalizacja", label:"Lokalizacja (miejsce pracy)"},
  ],
  partII_extra: {id:"ii_sukces", q:"Jaki % sukcesu zmiany zależy od zmiany zachowań/sposobu pracy ludzi?", hint:"1 – 0-20% … 5 – 81-100%"},
  partIII: [
    {id:"iii1", q:"Na ile pracownicy są obecnie obciążeni innymi zmianami?", hint:"1 – brak innych zmian … 5 – bardzo dużo zmian"},
    {id:"iii2", q:"Na ile pracownicy są otwarci na zmianę?", hint:"1 – akceptują zmiany … 5 – całkowity brak otwartości"},
  ],
};

function surveyLevel(total){
  if (total <= 25) return {poziom:1, label:"Mała zmiana", risk:"Niskie ryzyko", color:"green"};
  if (total <= 45) return {poziom:2, label:"Średnia zmiana", risk:"Średnie ryzyko", color:"orange"};
  return {poziom:3, label:"Duża zmiana", risk:"Wysokie ryzyko", color:"red"};
}

function pctTone(v){
  if (v == null || v === "") return "gray";
  if (v < 20) return "red";
  if (v < 25) return "orange";
  return "green";
}

/* ---------- Stan początkowy ---------- */

function emptySurveyAnswers(){
  const a = {};
  SURVEY.partI.forEach(q => a[q.id] = 3);
  SURVEY.partII_items.forEach(it => a[it.id] = 3);
  a[SURVEY.partII_extra.id] = 3;
  SURVEY.partIII.forEach(q => a[q.id] = 3);
  return a;
}

function emptyAdkarByCategory(){
  const o = {};
  ALL_CATEGORIES.forEach(c => {
    o[c.id] = {awareness:null, desire:null, knowledge:null, ability:null, reinforcement:null, wniosek:""};
  });
  return o;
}

function newProjectState(){
  return {
    project: {
      nazwa:"", sponsor:"", pm:"", cm:"", typProjektu:"", sposobProwadzenia:"",
      terminPrzygotowania:"", terminAktualizacji:"", dataPrzegladu:"", czestotliwosc:"",
    },
    surveyAnswers: emptySurveyAnswers(),
    pctHistory: [
      {id:cryptoId(), data:"", punktKontrolny:"Diagnoza wejściowa", definicjaSukcesu:"", przywodztwo:"", zarzadzanieProjektem:"", zarzadzanieZmiana:"", decyzja:"", kolejnyPrzeglad:""},
    ],
    groups: [],
    adkarByCategory: emptyAdkarByCategory(),
    actions: [],
    checklist12: {},
    savedAt: null,
  };
}

function cryptoId(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ---------- localStorage ---------- */

const LS_KEY = "pzz_merito_versions_v1";

function loadVersions(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ return []; }
}
function saveVersions(list){
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch(e){}
}

/* ---------- Drobne komponenty ---------- */

function Badge({tone, children}){
  return <span className={"badge " + tone}>{children}</span>;
}

function Likert({value, onChange, max=5}){
  return (
    <div style={{display:"flex", gap:6}}>
      {Array.from({length:max}, (_,i)=>i+1).map(n => (
        <button key={n} type="button" className="small"
          onClick={()=>onChange(n)}
          style={{
            width:30, height:30, padding:0, fontWeight:700,
            background: value===n ? "var(--accent)" : "#fff",
            color: value===n ? "#fff" : "var(--ink)",
            borderColor: value===n ? "var(--accent)" : "var(--line)",
          }}>{n}</button>
      ))}
    </div>
  );
}

function Field({label, hint, children}){
  return (
    <div className="field">
      <label>{label}</label>
      {children}
      {hint ? <p className="hint" style={{margin:"4px 0 0"}}>{hint}</p> : null}
    </div>
  );
}

function Bar({label, value, max=5, tone}){
  const pct = value==null ? 0 : Math.max(0, Math.min(100, (value/max)*100));
  const color = tone || (value==null ? "#cfd5d9" : value<=2 ? "var(--red)" : value===3 ? "var(--orange)" : "var(--green)");
  return (
    <div className="bar-row">
      <div className="label">{label}</div>
      <div className="bar-track"><div className="bar-fill" style={{width:pct+"%", background:color}}/></div>
      <div className="bar-val">{value==null?"–":value}</div>
    </div>
  );
}

/* ---------- Aplikacja ---------- */

function App(){
  const [state, setState] = useState(newProjectState);
  const [tab, setTab] = useState("dane");
  const [versions, setVersions] = useState(loadVersions);
  const [showVersions, setShowVersions] = useState(false);
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 2600);
    return ()=>clearTimeout(t);
  }, [toast]);

  const surveyTotal = useMemo(()=>{
    let sum = 0;
    SURVEY.partI.forEach(q => sum += Number(state.surveyAnswers[q.id]||0));
    SURVEY.partII_items.forEach(it => sum += Number(state.surveyAnswers[it.id]||0));
    sum += Number(state.surveyAnswers[SURVEY.partII_extra.id]||0);
    SURVEY.partIII.forEach(q => sum += Number(state.surveyAnswers[q.id]||0));
    return sum;
  }, [state.surveyAnswers]);
  const level = surveyLevel(surveyTotal);

  const pctLatest = state.pctHistory[state.pctHistory.length-1] || {};
  const pctNums = ["definicjaSukcesu","przywodztwo","zarzadzanieProjektem","zarzadzanieZmiana"]
    .map(k => pctLatest[k]).filter(v => v !== "" && v != null).map(Number);
  const pctAvg = pctNums.length ? (pctNums.reduce((a,b)=>a+b,0)/pctNums.length) : null;
  const pctWeakestKey = (() => {
    const labels = {definicjaSukcesu:"Definicja sukcesu", przywodztwo:"Przywództwo / sponsoring", zarzadzanieProjektem:"Zarządzanie projektem", zarzadzanieZmiana:"Zarządzanie zmianą"};
    let worst = null, worstVal = Infinity;
    Object.keys(labels).forEach(k => {
      const v = pctLatest[k];
      if (v !== "" && v != null && Number(v) < worstVal){ worstVal = Number(v); worst = labels[k]; }
    });
    return worst;
  })();

  const adkarRollup = useMemo(()=>{
    const activeCats = CATEGORIES.concat(state.usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
    return ADKAR_DIMS.map(dim => {
      const vals = activeCats
        .map(c => state.adkarByCategory[c.id]?.[dim.id])
        .filter(v => v !== null && v !== undefined && v !== "")
        .map(Number);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      const min = vals.length ? Math.min(...vals) : null;
      const atRisk = activeCats.filter(c => {
        const v = state.adkarByCategory[c.id]?.[dim.id];
        return v !== null && v !== undefined && v !== "" && Number(v) <= 2;
      }).map(c => c.label);
      return {...dim, avg, min, atRiskCount: atRisk.length, atRisk, suggestion: ADKAR_SUGGESTIONS[dim.id]};
    });
  }, [state.adkarByCategory, state.usesOptionalCategory]);

  function categoryBarrier(catId){
    const d = state.adkarByCategory[catId];
    if (!d) return null;
    let worst = null, worstVal = Infinity;
    ADKAR_DIMS.forEach(dim => {
      const v = d[dim.id];
      if (v !== null && v !== undefined && v !== "" && Number(v) < worstVal){ worstVal = Number(v); worst = dim; }
    });
    return worst;
  }

  const actionsByCategory = useMemo(()=>{
    const m = {};
    ALL_CATEGORIES.forEach(c => m[c.id] = state.actions.filter(a => a.categoryId === c.id));
    return m;
  }, [state.actions]);

  const statusCounts = useMemo(()=>{
    const m = {all: state.actions.length};
    STATUS_OPTIONS.forEach(s => m[s] = state.actions.filter(a=>a.status===s).length);
    m.linkedToFlexi = state.actions.filter(a => (a.flexiRef||"").trim() !== "").length;
    return m;
  }, [state.actions]);

  const signals = useMemo(()=>({
    brakOdpowiedzialnego: state.actions.filter(a => !(a.odpowiedzialny||"").trim()).length,
    brakTerminu: state.actions.filter(a => !(a.termin||"").trim() && !(a.kamien||"").trim()).length,
    zablokowane: state.actions.filter(a => a.status === "Zablokowane").length,
  }), [state.actions]);

  /* -------- persistence -------- */

  function persistAsNewVersion(name){
    const entry = {id:cryptoId(), name: name || (state.project.nazwa || "Bez nazwy"), savedAt: new Date().toISOString(), data: state};
    const next = [entry, ...versions].slice(0, 50);
    setVersions(next);
    saveVersions(next);
    setToast("Wersja zapisana: " + entry.name);
  }
  function loadVersion(entry){
    setState(entry.data);
    setShowVersions(false);
    setToast("Wczytano wersję: " + entry.name);
  }
  function deleteVersion(id){
    const next = versions.filter(v=>v.id!==id);
    setVersions(next);
    saveVersions(next);
  }
  function exportJson(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (state.project.nazwa || "pzz") + ".json";
    a.click(); URL.revokeObjectURL(url);
  }
  function importJson(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setState(data);
        setToast("Wczytano plik: " + file.name);
      } catch(e){ alert("Nie udało się wczytać pliku JSON."); }
    };
    reader.readAsText(file);
  }

  function exportExcel(){
    const wb = XLSX.utils.book_new();

    const daneRows = [
      ["PLAN ZARZĄDZANIA ZMIANĄ — DANE PROJEKTU"],
      [],
      ["Nazwa projektu/programu", state.project.nazwa],
      ["Sponsor", state.project.sponsor],
      ["PM", state.project.pm],
      ["CM (jeśli powołany)", state.project.cm],
      ["Typ projektu", state.project.typProjektu],
      ["Sposób prowadzenia prac", state.project.sposobProwadzenia],
      ["Termin przygotowania PZZ", state.project.terminPrzygotowania],
      ["Termin aktualizacji PZZ", state.project.terminAktualizacji],
      ["Data przeglądu", state.project.dataPrzegladu],
      ["Częstotliwość przeglądu", state.project.czestotliwosc],
      [],
      ["Liczba punktów w ankiecie skali zmiany", surveyTotal],
      ["Poziom zmiany", level.poziom + " — " + level.label],
      ["Ocena ryzyka", level.risk],
    ];
    const wsDane = XLSX.utils.aoa_to_sheet(daneRows);
    XLSX.utils.book_append_sheet(wb, wsDane, "Dane projektu");

    const diagRows = [
      ["PCT — KONDYCJA CAŁEGO PRZEDSIĘWZIĘCIA"],
      ["Data","Punkt kontrolny","Definicja sukcesu","Przywództwo/sponsoring","Zarządzanie projektem","Zarządzanie zmianą","Średnia PCT","Decyzja/działanie","Kolejny przegląd"],
      ...state.pctHistory.map(p => {
        const nums = [p.definicjaSukcesu,p.przywodztwo,p.zarzadzanieProjektem,p.zarzadzanieZmiana].filter(v=>v!=="" && v!=null).map(Number);
        const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1) : "";
        return [p.data,p.punktKontrolny,p.definicjaSukcesu,p.przywodztwo,p.zarzadzanieProjektem,p.zarzadzanieZmiana,avg,p.decyzja,p.kolejnyPrzeglad];
      }),
      [],
      ["GRUPY OBJĘTE ZMIANĄ"],
      ["Grupa","Co zmienia się w ich pracy?","Kategoria"],
      ...state.groups.map(g => [g.nazwa, g.wplyw, ALL_CATEGORIES.find(c=>c.id===g.categoryId)?.label || ""]),
      [],
      ["ADKAR PER KATEGORIA (1-5)"],
      ["Kategoria","Awareness","Desire","Knowledge","Ability","Reinforcement","Największa bariera","Wniosek"],
      ...ALL_CATEGORIES.map(c => {
        const d = state.adkarByCategory[c.id] || {};
        const b = categoryBarrier(c.id);
        return [c.label, d.awareness, d.desire, d.knowledge, d.ability, d.reinforcement, b ? b.label : "", d.wniosek || ""];
      }),
      [],
      ["ADKAR — SZYBKI SKAN"],
      ["Element","Średnia","Min","Kategorie z oceną ≤2","Podpowiedź"],
      ...adkarRollup.map(r => [r.label, r.avg!=null?r.avg.toFixed(2):"", r.min, r.atRisk.join("; "), r.suggestion]),
    ];
    const wsDiag = XLSX.utils.aoa_to_sheet(diagRows);
    XLSX.utils.book_append_sheet(wb, wsDiag, "Diagnoza");

    const planRows = [
      ["Kategoria","Działanie","Kamień milowy/etap","Termin","Odpowiedzialny","Jak sprawdzimy gotowość","Kanały komunikacji","Zadanie w Flexi","Status"],
      ...state.actions.map(a => [
        ALL_CATEGORIES.find(c=>c.id===a.categoryId)?.label || "",
        a.dzialanie, a.kamien, a.termin, a.odpowiedzialny, a.weryfikacja, a.kanaly, a.flexiRef, a.status,
      ]),
    ];
    const wsPlan = XLSX.utils.aoa_to_sheet(planRows);
    XLSX.utils.book_append_sheet(wb, wsPlan, "Plan działań");

    const pulpitRows = [
      ["PULPIT PZZ"],
      ["Skala zmiany", surveyTotal + " pkt — poziom " + level.poziom + " (" + level.label + ")"],
      ["PCT — średnia ostatniego pomiaru", pctAvg!=null?pctAvg.toFixed(1):""],
      ["PCT — najsłabszy obszar", pctWeakestKey || ""],
      [],
      ["Wszystkie działania", statusCounts.all],
      ...STATUS_OPTIONS.map(s => [s, statusCounts[s]]),
      ["Powiązane z zadaniem w Flexi", statusCounts.linkedToFlexi],
      [],
      ["SYGNAŁY DO DECYZJI"],
      ["Brak odpowiedzialnego", signals.brakOdpowiedzialnego],
      ["Brak terminu / kamienia milowego", signals.brakTerminu],
      ["Zablokowane", signals.zablokowane],
    ];
    const wsPulpit = XLSX.utils.aoa_to_sheet(pulpitRows);
    XLSX.utils.book_append_sheet(wb, wsPulpit, "Pulpit");

    XLSX.writeFile(wb, (state.project.nazwa || "PZZ") + "_export.xlsx");
  }

  /* -------- drobne mutatory -------- */

  function setProjectField(key, value){
    setState(s => ({...s, project: {...s.project, [key]: value}}));
  }
  function setSurveyAnswer(id, value){
    setState(s => ({...s, surveyAnswers: {...s.surveyAnswers, [id]: value}}));
  }
  function setPct(idx, key, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], [key]: value};
      return {...s, pctHistory: hist};
    });
  }
  function addPctCheckpoint(){
    setState(s => ({...s, pctHistory: [...s.pctHistory, {id:cryptoId(), data:"", punktKontrolny:"", definicjaSukcesu:"", przywodztwo:"", zarzadzanieProjektem:"", zarzadzanieZmiana:"", decyzja:"", kolejnyPrzeglad:""}]}));
  }
  function addGroup(){
    setState(s => ({...s, groups: [...s.groups, {id:cryptoId(), nazwa:"", wplyw:"", categoryId: CATEGORIES[0].id}]}));
  }
  function updateGroup(id, key, value){
    setState(s => ({...s, groups: s.groups.map(g => g.id===id ? {...g, [key]:value} : g)}));
  }
  function removeGroup(id){
    setState(s => ({...s, groups: s.groups.filter(g=>g.id!==id)}));
  }
  function setAdkar(catId, key, value){
    setState(s => ({...s, adkarByCategory: {...s.adkarByCategory, [catId]: {...s.adkarByCategory[catId], [key]: value}}}));
  }
  function enableOptionalCategory(){
    setState(s => ({...s, usesOptionalCategory: true}));
  }
  function addAction(categoryId){
    if ((actionsByCategory[categoryId]||[]).length >= MAX_ACTIONS_PER_CATEGORY) return;
    setState(s => ({...s, actions: [...s.actions, {
      id:cryptoId(), categoryId, dzialanie:"", kamien:"", termin:"", odpowiedzialny:"",
      weryfikacja:"", kanaly:"", flexiRef:"", status:"Do zaplanowania",
    }]}));
  }
  function updateAction(id, key, value){
    setState(s => ({...s, actions: s.actions.map(a => a.id===id ? {...a, [key]:value} : a)}));
  }
  function removeAction(id){
    setState(s => ({...s, actions: s.actions.filter(a=>a.id!==id)}));
  }
  function toggleChecklist(key){
    setState(s => ({...s, checklist12: {...s.checklist12, [key]: !s.checklist12[key]}}));
  }

  const tabsDef = [
    {id:"dane", label:"Dane projektu"},
    {id:"ankieta", label:"Ankieta — skala zmiany"},
    level.poziom < 3
      ? {id:"checklisty", label:"Checklisty (poziom " + level.poziom + ")"}
      : null,
    {id:"diagnoza", label:"Diagnoza"},
    {id:"plan", label:"Plan działań"},
    {id:"pulpit", label:"Pulpit"},
    {id:"przewodnik", label:"Przewodnik"},
  ].filter(Boolean);

  return (
    <React.Fragment>
      <header className="app">
        <div>
          <h1>Plan zarządzania zmianą — Grupa Merito</h1>
          <div className="sub">{state.project.nazwa || "Nowy projekt"} · {surveyTotal} pkt · Poziom {level.poziom} ({level.label})</div>
        </div>
        <div className="toolbar">
          <button className="ghost" onClick={()=>setShowVersions(true)}>Wersje ({versions.length})</button>
          <button className="ghost" onClick={()=>persistAsNewVersion(state.project.nazwa)}>Zapisz wersję</button>
          <button className="ghost" onClick={exportJson}>Eksport JSON</button>
          <button className="primary" onClick={exportExcel}>Eksport Excel</button>
          <input ref={fileInputRef} type="file" accept=".json" style={{display:"none"}}
            onChange={e => { if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=""; }} />
          <button className="ghost" onClick={()=>fileInputRef.current.click()}>Wczytaj JSON</button>
        </div>
      </header>

      <nav className="tabs">
        {tabsDef.map(t => (
          <button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </nav>

      <main>
        {tab==="dane" && <DaneProjektu project={state.project} setField={setProjectField} level={level} surveyTotal={surveyTotal}/>}
        {tab==="ankieta" && <Ankieta answers={state.surveyAnswers} setAnswer={setSurveyAnswer} total={surveyTotal} level={level}/>}
        {tab==="checklisty" && level.poziom<3 && <Checklisty level={level} checklist={state.checklist12} toggle={toggleChecklist}/>}
        {tab==="diagnoza" && <Diagnoza
          state={state} pctLatest={pctLatest} pctAvg={pctAvg} pctWeakestKey={pctWeakestKey}
          setPct={setPct} addPctCheckpoint={addPctCheckpoint}
          addGroup={addGroup} updateGroup={updateGroup} removeGroup={removeGroup}
          setAdkar={setAdkar} categoryBarrier={categoryBarrier} adkarRollup={adkarRollup}
          usesOptionalCategory={state.usesOptionalCategory} enableOptionalCategory={enableOptionalCategory}
        />}
        {tab==="plan" && <PlanDzialan
          actionsByCategory={actionsByCategory} categoryBarrier={categoryBarrier}
          adkarByCategory={state.adkarByCategory} groups={state.groups}
          addAction={addAction} updateAction={updateAction} removeAction={removeAction}
          usesOptionalCategory={state.usesOptionalCategory}
        />}
        {tab==="pulpit" && <Pulpit
          project={state.project} level={level} surveyTotal={surveyTotal}
          pctAvg={pctAvg} pctWeakestKey={pctWeakestKey} statusCounts={statusCounts} signals={signals}
          goTo={setTab}
        />}
        {tab==="przewodnik" && <Przewodnik/>}
      </main>

      {showVersions && (
        <dialog open onClose={()=>setShowVersions(false)}>
          <div className="inner">
            <div className="flex-between"><h2 style={{margin:0}}>Zapisane wersje</h2><button className="small" onClick={()=>setShowVersions(false)}>Zamknij</button></div>
            <p className="hint">Wersje są zapisywane lokalnie w tej przeglądarce.</p>
            <div className="versions-list">
              {versions.length===0 && <div className="row muted">Brak zapisanych wersji.</div>}
              {versions.map(v => (
                <div className="row" key={v.id}>
                  <div>
                    <div>{v.name}</div>
                    <div className="muted" style={{fontSize:11}}>{new Date(v.savedAt).toLocaleString("pl-PL")}</div>
                  </div>
                  <div style={{display:"flex", gap:6}}>
                    <button className="small" onClick={()=>loadVersion(v)}>Wczytaj</button>
                    <button className="small" onClick={()=>deleteVersion(v.id)}>Usuń</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </dialog>
      )}

      {toast && <div style={{position:"fixed", bottom:16, right:16, background:"var(--ink)", color:"#fff", padding:"10px 16px", borderRadius:8, fontSize:13}}>{toast}</div>}

      <footer className="app">Plan Zarządzania Zmianą · Grupa Merito · wersja robocza</footer>
    </React.Fragment>
  );
}

/* ---------- Widoki ---------- */

  return (
    <div className="card">
      <h2>Dane projektu</h2>
      <p className="hint">Metryka projektu/programu — punkt wyjścia dla całego planu.</p>
      <div className="grid cols2">
        <Field label="Nazwa projektu/programu"><input type="text" value={project.nazwa} onChange={e=>setField("nazwa", e.target.value)}/></Field>
        <Field label="Typ projektu"><input type="text" value={project.typProjektu} onChange={e=>setField("typProjektu", e.target.value)} placeholder="np. program, projekt, pilotaż"/></Field>
        <Field label="Sponsor"><input type="text" value={project.sponsor} onChange={e=>setField("sponsor", e.target.value)}/></Field>
        <Field label="PM / Lider projektu"><input type="text" value={project.pm} onChange={e=>setField("pm", e.target.value)}/></Field>
        <Field label="CM (Change Manager, jeśli powołany)"><input type="text" value={project.cm} onChange={e=>setField("cm", e.target.value)}/></Field>
        <Field label="Sposób prowadzenia prac"><input type="text" value={project.sposobProwadzenia} onChange={e=>setField("sposobProwadzenia", e.target.value)} placeholder="np. hybrydowy — program + pilotaże FlexiProject"/></Field>
        <Field label="Termin przygotowania PZZ"><input type="date" value={project.terminPrzygotowania} onChange={e=>setField("terminPrzygotowania", e.target.value)}/></Field>
        <Field label="Termin aktualizacji PZZ"><input type="date" value={project.terminAktualizacji} onChange={e=>setField("terminAktualizacji", e.target.value)}/></Field>
        <Field label="Data ostatniego przeglądu"><input type="date" value={project.dataPrzegladu} onChange={e=>setField("dataPrzegladu", e.target.value)}/></Field>
        <Field label="Częstotliwość przeglądu"><input type="text" value={project.czestotliwosc} onChange={e=>setField("czestotliwosc", e.target.value)} placeholder="np. co miesiąc"/></Field>
      </div>
      <h3>Wynik ankiety skali zmiany</h3>
      <div className="flex-between">
        <div>{surveyTotal} / 65 pkt</div>
        <Badge tone={level.color}>Poziom {level.poziom} — {level.label} · {level.risk}</Badge>
      </div>
      <p className="hint">Uzupełnij ankietę w zakładce „Ankieta — skala zmiany”, żeby zobaczyć pełny wynik.</p>
    </div>
  );
}

function Ankieta({answers, setAnswer, total, level}){
  return (
    <div className="card">
      <h2>Ankieta — ocena skali zmiany</h2>
      <p className="hint">Łącznie 65 punktów. 0–25 = mała zmiana (niskie ryzyko), 26–45 = średnia (średnie ryzyko), &gt;45 = duża (wysokie ryzyko). Wynik decyduje, czy korzystasz z pełnego planu (poziom 3), czy z krótszej checklisty (poziom 1–2).</p>

      <h3>Część I — Charakterystyka zmiany</h3>
      {SURVEY.partI.map(q => (
        <div key={q.id} className="flex-between" style={{marginBottom:14}}>
          <div style={{maxWidth:560}}>
            <div>{q.q}</div>
            <div className="hint" style={{margin:0}}>{q.hint}</div>
          </div>
          <Likert value={answers[q.id]} onChange={v=>setAnswer(q.id, v)}/>
        </div>
      ))}

      <h3>Część II — Wpływ zmiany na ludzi</h3>
      <p className="hint">W jakim stopniu zmiana wpłynie na poniższe elementy codziennej pracy? (1 – brak/minimalny wpływ … 5 – bardzo duży wpływ)</p>
      {SURVEY.partII_items.map(it => (
        <div key={it.id} className="flex-between" style={{marginBottom:10}}>
          <div>{it.label}</div>
          <Likert value={answers[it.id]} onChange={v=>setAnswer(it.id, v)}/>
        </div>
      ))}
      <div className="flex-between" style={{marginTop:14, marginBottom:4}}>
        <div style={{maxWidth:560}}>
          <div>{SURVEY.partII_extra.q}</div>
          <div className="hint" style={{margin:0}}>{SURVEY.partII_extra.hint}</div>
        </div>
        <Likert value={answers[SURVEY.partII_extra.id]} onChange={v=>setAnswer(SURVEY.partII_extra.id, v)}/>
      </div>

      <h3>Część III — Kontekst organizacyjny</h3>
      {SURVEY.partIII.map(q => (
        <div key={q.id} className="flex-between" style={{marginBottom:14}}>
          <div style={{maxWidth:560}}>
            <div>{q.q}</div>
            <div className="hint" style={{margin:0}}>{q.hint}</div>
          </div>
          <Likert value={answers[q.id]} onChange={v=>setAnswer(q.id, v)}/>
        </div>
      ))}

      <div className="banner info flex-between">
        <div><strong>{total} / 65 pkt</strong> — {level.label}</div>
        <Badge tone={level.color}>Poziom {level.poziom} · {level.risk}</Badge>
      </div>
    </div>
  );
}

function Checklisty({level, checklist, toggle}){
  const items = [
    {key:"sponsor1", group:"Aktywność sponsora", text:"Sponsor jest wskazany z imienia i nazwiska oraz wie, czego od niego oczekujemy."},
    {key:"sponsor2", group:"Aktywność sponsora", text:"Sponsor publicznie i regularnie komunikuje potrzebę zmiany."},
    {key:"komunikacja1", group:"Komunikowanie zmiany", text:"Jest jeden, krótki komunikat wyjaśniający sens zmiany dla osób, których ona dotyczy."},
    {key:"komunikacja2", group:"Komunikowanie zmiany", text:"Wiadomo, kto i kiedy przekaże ten komunikat grupom objętym zmianą."},
    {key:"koalicja1", group:"Tworzenie koalicji", text:"Zidentyfikowano osoby/role, które powinny wspierać zmianę wobec swoich zespołów."},
    {key:"koalicja2", group:"Tworzenie koalicji", text:"Osoby te wiedzą, czego się od nich oczekuje."},
    {key:"managerowie1", group:"Zaangażowanie menedżerów liniowych", text:"Menedżerowie liniowi wiedzą, co się zmienia dla ich zespołów."},
    {key:"managerowie2", group:"Zaangażowanie menedżerów liniowych", text:"Menedżerowie liniowi mają materiały/argumenty do rozmowy z zespołem o zmianie."},
  ];
  const groups = [...new Set(items.map(i=>i.group))];
  return (
    <div className="card">
      <div className="banner warn">
        Ten projekt kwalifikuje się do uproszczonej ścieżki — <strong>Poziom {level.poziom} ({level.label})</strong>. Pełny Plan Zarządzania Zmianą (zakładki „Diagnoza” i „Plan działań”) jest przeznaczony przede wszystkim dla dużych zmian (poziom 3) — dla tego projektu zwykle nie jest potrzebny, ale pozostaje dostępny, jeśli chcesz z niego skorzystać.
      </div>
      <h2>Checklista — poziom {level.poziom}</h2>
      <p className="hint">Wersja robocza (zaślepka). Ostateczną treść checklist dla poziomu 1 i 2 — wraz ze skróconymi pytaniami do rozmowy — przygotowuje Martyna. Poniższe pozycje to tymczasowy zestaw startowy zgodny z ustaleniami ze spotkania.</p>
      {groups.map(g => (
        <div key={g}>
          <h3>{g}</h3>
          <div className="checklist">
            {items.filter(i=>i.group===g).map(i => (
              <label key={i.key} className="cb">
                <input type="checkbox" checked={!!checklist[i.key]} onChange={()=>toggle(i.key)}/>
                <span>{i.text}</span>
              </label>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function Diagnoza({state, pctLatest, pctAvg, pctWeakestKey, setPct, addPctCheckpoint, addGroup, updateGroup, removeGroup, setAdkar, categoryBarrier, adkarRollup, usesOptionalCategory, enableOptionalCategory}){
  const activeCategories = CATEGORIES.concat(usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
  return (
    <React.Fragment>
      <div className="card">
        <h2>1. PCT — kondycja całego przedsięwzięcia</h2>
        <p className="hint">Progi robocze (nie są oficjalnymi progami Prosci): 10–19 = wymaga działania, 20–24 = wymaga uwagi, 25–30 = mocny obszar. Zawsze reaguj na najsłabszy z czterech wyników.</p>
        {state.pctHistory.map((p, idx) => (
          <div key={p.id} className="action-row">
            <div className="grid cols4">
              <Field label="Data"><input type="date" value={p.data} onChange={e=>setPct(idx,"data",e.target.value)}/></Field>
              <Field label="Punkt kontrolny"><input type="text" value={p.punktKontrolny} onChange={e=>setPct(idx,"punktKontrolny",e.target.value)}/></Field>
              <Field label="Definicja sukcesu (1-30)"><input type="number" min="1" max="30" value={p.definicjaSukcesu} onChange={e=>setPct(idx,"definicjaSukcesu",e.target.value)}/></Field>
              <Field label="Przywództwo / sponsoring (1-30)"><input type="number" min="1" max="30" value={p.przywodztwo} onChange={e=>setPct(idx,"przywodztwo",e.target.value)}/></Field>
              <Field label="Zarządzanie projektem (1-30)"><input type="number" min="1" max="30" value={p.zarzadzanieProjektem} onChange={e=>setPct(idx,"zarzadzanieProjektem",e.target.value)}/></Field>
              <Field label="Zarządzanie zmianą (1-30)"><input type="number" min="1" max="30" value={p.zarzadzanieZmiana} onChange={e=>setPct(idx,"zarzadzanieZmiana",e.target.value)}/></Field>
              <Field label="Decyzja / działanie korygujące"><input type="text" value={p.decyzja} onChange={e=>setPct(idx,"decyzja",e.target.value)}/></Field>
              <Field label="Kolejny przegląd"><input type="date" value={p.kolejnyPrzeglad} onChange={e=>setPct(idx,"kolejnyPrzeglad",e.target.value)}/></Field>
            </div>
          </div>
        ))}
        <button className="small" onClick={addPctCheckpoint}>+ Kolejny pomiar</button>
        <div className="banner info flex-between" style={{marginTop:14}}>
          <div>Średnia ostatniego pomiaru: <strong>{pctAvg!=null ? pctAvg.toFixed(1) : "–"}</strong>{pctWeakestKey ? (" · Najsłabszy obszar: " + pctWeakestKey) : ""}</div>
          <Badge tone={pctTone(pctAvg)}>{pctAvg==null?"brak danych": pctAvg<20?"wymaga działania": pctAvg<25?"wymaga uwagi":"mocny obszar"}</Badge>
        </div>
      </div>

      <div className="card">
        <div className="flex-between">
          <h2 style={{margin:0}}>2. Grupy objęte zmianą</h2>
          <button className="small" onClick={addGroup}>+ Dodaj grupę</button>
        </div>
        <p className="hint">Wpisz grupy osób, których charakter lub sposób pracy może ulec zmianie, i przypisz każdą do jednej z kategorii.</p>
        <table>
          <thead><tr><th>Grupa</th><th>Co zmienia się w ich pracy?</th><th>Kategoria</th><th></th></tr></thead>
          <tbody>
            {state.groups.map(g => (
              <tr key={g.id}>
                <td><input type="text" value={g.nazwa} onChange={e=>updateGroup(g.id,"nazwa",e.target.value)}/></td>
                <td><input type="text" value={g.wplyw} onChange={e=>updateGroup(g.id,"wplyw",e.target.value)}/></td>
                <td>
                  <select value={g.categoryId} onChange={e=>updateGroup(g.id,"categoryId",e.target.value)}>
                    {activeCategories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </td>
                <td><button className="small" onClick={()=>removeGroup(g.id)}>Usuń</button></td>
              </tr>
            ))}
            {state.groups.length===0 && <tr><td colSpan="4" className="muted">Brak grup — kliknij „Dodaj grupę”.</td></tr>}
          </tbody>
        </table>
        {!usesOptionalCategory && (
          <button className="small" style={{marginTop:10}} onClick={enableOptionalCategory}>+ Włącz kategorię „Klienci / studenci” (opcjonalnie)</button>
        )}
      </div>

      <div className="card">
        <h2>3. Ocena ADKAR dla każdej kategorii</h2>
        <p className="hint">Oceń każdą kategorię w skali 1–5. 1–2 oznacza istotną barierę, 3 wymaga uwagi, 4–5 to dobra gotowość.</p>
        {activeCategories.map(c => {
          const d = state.adkarByCategory[c.id];
          const barrier = categoryBarrier(c.id);
          const catGroups = state.groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
          return (
            <div key={c.id} className="action-row">
              <div className="top">
                <strong>{c.label}</strong>
                {barrier && <Badge tone="orange">Największa bariera: {barrier.label}</Badge>}
              </div>
              {catGroups.length>0 && <div className="pill-list" style={{marginBottom:10}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
              <div className="grid cols2">
                <div>
                  {ADKAR_DIMS.map(dim => (
                    <div key={dim.id} className="flex-between" style={{marginBottom:8}}>
                      <div style={{fontSize:12.5}}>{dim.label}<div className="muted" style={{fontSize:11}}>{dim.sub}</div></div>
                      <Likert value={d[dim.id]} onChange={v=>setAdkar(c.id, dim.id, v)}/>
                    </div>
                  ))}
                </div>
                <div>
                  <Field label="Wniosek / co trzeba osiągnąć">
                    <textarea value={d.wniosek} onChange={e=>setAdkar(c.id,"wniosek",e.target.value)} placeholder="Opisz własnymi słowami, co trzeba osiągnąć w tej kategorii."/>
                  </Field>
                  {barrier && (
                    <p className="hint">Podpowiedź dla bariery „{barrier.label}”: {ADKAR_SUGGESTIONS[barrier.id]}</p>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <h2>4. ADKAR — szybki skan</h2>
        <p className="hint">Liczy się automatycznie z ocen powyżej.</p>
        {adkarRollup.map(r => (
          <div key={r.id} style={{marginBottom:14}}>
            <Bar label={r.label} value={r.avg} max={5}/>
            <div className="hint" style={{margin:"2px 0 0 160px"}}>
              {r.min!=null ? ("min " + r.min + " · ") : ""}
              {r.atRiskCount>0 ? (r.atRiskCount + " kateg. z oceną ≤2 (" + r.atRisk.join(", ") + ")") : "brak kategorii w ryzyku"}
              {" · "}{r.suggestion}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function PlanDzialan({actionsByCategory, categoryBarrier, adkarByCategory, groups, addAction, updateAction, removeAction, usesOptionalCategory}){
  const activeCategories = CATEGORIES.concat(usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
  return (
    <div className="card">
      <h2>Plan działań</h2>
      <p className="hint">Plan na poziomie kategorii — maksymalnie {MAX_ACTIONS_PER_CATEGORY} działania na kategorię. Wpisuj własne, konkretne działania (bez gotowych podpowiedzi) i od razu dodaj kanały komunikacji w tym samym wierszu.</p>
      {activeCategories.map(c => {
        const actions = actionsByCategory[c.id] || [];
        const barrier = categoryBarrier(c.id);
        const wniosek = adkarByCategory[c.id]?.wniosek;
        const catGroups = groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
        const atLimit = actions.length >= MAX_ACTIONS_PER_CATEGORY;
        return (
          <div key={c.id} style={{marginBottom:22}}>
            <div className="flex-between">
              <div>
                <strong>{c.label}</strong>
                {barrier && <span className="tag" style={{marginLeft:8}}>bariera: {barrier.label}</span>}
              </div>
              <button className="small" disabled={atLimit} onClick={()=>addAction(c.id)}>+ Dodaj działanie ({actions.length}/{MAX_ACTIONS_PER_CATEGORY})</button>
            </div>
            {catGroups.length>0 && <div className="pill-list" style={{margin:"6px 0"}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
            {wniosek && <p className="hint" style={{margin:"4px 0 10px"}}>Wniosek z diagnozy: {wniosek}</p>}
            {atLimit && <div className="banner warn">Limit {MAX_ACTIONS_PER_CATEGORY} działań na kategorię. Rozważ połączenie działań lub rozbicie na etapy w ramach istniejących wierszy, zamiast dodawać kolejne.</div>}

            {actions.map(a => (
              <div key={a.id} className="action-row">
                <div className="top">
                  <span className="muted">Działanie</span>
                  <button className="small" onClick={()=>removeAction(a.id)}>Usuń</button>
                </div>
                <div className="grid cols2">
                  <Field label="Działanie"><textarea value={a.dzialanie} onChange={e=>updateAction(a.id,"dzialanie",e.target.value)} placeholder="Co konkretnie zrobimy?"/></Field>
                  <Field label="Jak sprawdzimy gotowość?"><textarea value={a.weryfikacja} onChange={e=>updateAction(a.id,"weryfikacja",e.target.value)} placeholder="Po czym poznamy, że grupa osiągnęła gotowość?"/></Field>
                </div>
                <div className="grid cols3">
                  <Field label="Kamień milowy / etap"><input type="text" value={a.kamien} onChange={e=>updateAction(a.id,"kamien",e.target.value)}/></Field>
                  <Field label="Termin"><input type="date" value={a.termin} onChange={e=>updateAction(a.id,"termin",e.target.value)}/></Field>
                  <Field label="Odpowiedzialny"><input type="text" value={a.odpowiedzialny} onChange={e=>updateAction(a.id,"odpowiedzialny",e.target.value)}/></Field>
                </div>
                <div className="grid cols3">
                  <Field label="Kanały komunikacji (oddziel przecinkami)">
                    <input type="text" list="channels-dl" value={a.kanaly} onChange={e=>updateAction(a.id,"kanaly",e.target.value)} placeholder="np. mail, Teams, spotkanie"/>
                  </Field>
                  <Field label="Zadanie w Flexi (nr / link)"><input type="text" value={a.flexiRef} onChange={e=>updateAction(a.id,"flexiRef",e.target.value)} placeholder="np. FLEXI-123"/></Field>
                  <Field label="Status">
                    <select value={a.status} onChange={e=>updateAction(a.id,"status",e.target.value)}>
                      {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </Field>
                </div>
              </div>
            ))}
            {actions.length===0 && <p className="muted">Brak działań w tej kategorii.</p>}
          </div>
        );
      })}
      <datalist id="channels-dl">
        {CHANNEL_SUGGESTIONS.map(c => <option key={c} value={c}/>)}
      </datalist>
    </div>
  );
}

function Pulpit({project, level, surveyTotal, pctAvg, pctWeakestKey, statusCounts, signals, goTo}){
  const wipOver = statusCounts["W realizacji"] > MAX_WIP_ACTIONS;
  return (
    <React.Fragment>
      <div className="card">
        <h2>Kontekst</h2>
        <div className="grid cols3">
          <div><div className="muted">Projekt / program</div><div>{project.nazwa || "–"}</div></div>
          <div><div className="muted">Sponsor</div><div>{project.sponsor || "–"}</div></div>
          <div><div className="muted">Sposób prowadzenia prac</div><div>{project.sposobProwadzenia || "–"}</div></div>
          <div><div className="muted">Skala zmiany</div><div><Badge tone={level.color}>{surveyTotal} pkt — poziom {level.poziom}</Badge></div></div>
          <div><div className="muted">PCT — średnia</div><div><Badge tone={pctTone(pctAvg)}>{pctAvg!=null?pctAvg.toFixed(1):"brak danych"}</Badge></div></div>
          <div><div className="muted">PCT — najsłabszy obszar</div><div>{pctWeakestKey || "–"}</div></div>
        </div>
      </div>

      <div className="card">
        <h2>Pulpit planu działań</h2>
        <div className="grid cols4">
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.all}</div><div className="muted">wszystkie</div></div>
          <div className="action-row" style={{textAlign:"center"}}>
            <div style={{fontSize:24, fontWeight:700, color: wipOver?"var(--red)":"inherit"}}>{statusCounts["W realizacji"]}</div>
            <div className="muted">w realizacji {wipOver ? "(limit " + MAX_WIP_ACTIONS + "!)" : ""}</div>
          </div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts["Zablokowane"]}</div><div className="muted">zablokowane</div></div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.linkedToFlexi}</div><div className="muted">powiązane z Flexi</div></div>
        </div>
        <p className="hint">Zasada WIP: maksymalnie {MAX_WIP_ACTIONS} działań ze statusem „W realizacji” jednocześnie — pozostałe czekają jako „Do zaplanowania”.</p>
      </div>

      <div className="card">
        <h2>Sygnały do decyzji</h2>
        <table>
          <tbody>
            <tr><td>Brak odpowiedzialnego</td><td><Badge tone={signals.brakOdpowiedzialnego>0?"orange":"green"}>{signals.brakOdpowiedzialnego}</Badge></td></tr>
            <tr><td>Brak terminu / kamienia milowego</td><td><Badge tone={signals.brakTerminu>0?"orange":"green"}>{signals.brakTerminu}</Badge></td></tr>
            <tr><td>Zablokowane</td><td><Badge tone={signals.zablokowane>0?"red":"green"}>{signals.zablokowane}</Badge></td></tr>
          </tbody>
        </table>
      </div>

      <div className="card">
        <p className="hint" style={{margin:0}}>Pełny opis sposobu pracy z PZZ — zakładka <a href="#" onClick={(e)=>{e.preventDefault(); goTo("przewodnik");}}>Przewodnik</a>.</p>
      </div>
    </React.Fragment>
  );
}

function Przewodnik(){
  return (
    <div className="card">
      <h2>Jak pracować z PZZ</h2>
      <ol>
        <li><strong>Diagnoza:</strong> uzupełnij PCT, przypisz grupy do kategorii i wykonaj oceny ADKAR.</li>
        <li><strong>Plan:</strong> wpisz działania (max {MAX_ACTIONS_PER_CATEGORY}/kategorię), sposób sprawdzenia gotowości i kanały komunikacji.</li>
        <li><strong>Pulpit:</strong> podczas przeglądu aktualizuj statusy działań i reaguj na blokady.</li>
      </ol>

      <h3>Jak utrzymać spojrzenie z lotu ptaka</h3>
      <ol>
        <li><strong>Łącz grupy w segmenty</strong> — rozdzielaj je dopiero, gdy różnią się przekazem, wsparciem, właścicielem lub terminem.</li>
        <li><strong>Projektuj rezultaty, nie listy dla grup</strong> — najpierw jeden wspólny rezultat i wszystkie objęte nim grupy; osobny wariant tylko przy różnym właścicielu, terminie, formie lub przekazie.</li>
        <li><strong>Wymagaj powiązania z projektem</strong> — każde aktywne działanie przypisz do kamienia milowego, etapu albo pracy ciągłej (BAU), i jeśli możliwe — do zadania w Flexi.</li>
        <li><strong>Planuj krocząco</strong> — horyzont „teraz” opisuj szczegółowo, kolejne okresy utrzymuj ramowo.</li>
        <li><strong>Ogranicz pracę rozpoczętą</strong> — maksymalnie {MAX_WIP_ACTIONS} działań w statusie „W realizacji”. Pozostałe czekają jako „Do zaplanowania”.</li>
      </ol>

      <h3>Co jeszcze jest w toku (otwarte tematy z zespołu)</h3>
      <ul>
        <li>Checklisty dla poziomu 1 i 2 zmiany — w przygotowaniu (Martyna); obecna wersja w zakładce „Checklisty” to zaślepka.</li>
        <li>Kategoria „Klienci / studenci” — opcjonalna, do przetestowania na żywym projekcie.</li>
        <li>Nazewnictwo „menedżerowie liniowi” — do ostatecznego uzgodnienia z HR.</li>
      </ul>
    </div>
  );
}
