// Wykres radarowy (pajęczyna) na 4 osiach zamiast klasycznego trójkąta PCT z dorzuconym czwartym
// wierzchołkiem — trójkąt ma sens tylko dla trzech wierzchołków (dorzucenie czwartego jako węzła
// centralnego zniekształca kształt znany z materiałów Prosci), a radar naturalnie traktuje
// wszystkie 4 obszary jako równoważne osie i skaluje się identycznie do pełnej oceny (6
// pytań/obszar) i szybkiej (2 pytania/obszar), bo obie są znormalizowane do wspólnej skali 1-30
// (patrz pctAreaScore). `scores` to obiekt {obszar: liczba|null} — dokładnie to, co zwraca
// pctScores/quickScores i co dostaje computeWeakestPctAreas, więc wykres zawsze pokazuje to samo,
// co baner tekstowy nad/pod nim.
function PctRadarChart({scores, weakestKeys}){
  const size = 400, center = size/2, radius = 95, labelR = radius + 50;
  const n = PCT_AREAS.length;
  const angleFor = i => (-90 + i * (360/n)) * Math.PI/180;
  const pointAt = (i, value) => {
    const a = angleFor(i);
    const r = (Math.max(0, Math.min(30, value)) / 30) * radius;
    return [center + r*Math.cos(a), center + r*Math.sin(a)];
  };
  const vertexAt = i => pointAt(i, 30);
  const dataPoints = PCT_AREAS.map((a,i) => pointAt(i, scores[a.key] ?? 0));
  const pathD = dataPoints.map((p,i) => (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ") + " Z";
  const allScored = PCT_AREAS.every(a => scores[a.key] != null);
  const anyScored = PCT_AREAS.some(a => scores[a.key] != null);
  return (
    <div>
      <svg viewBox={"0 0 "+size+" "+size} style={{width:"100%", maxWidth:400, display:"block", margin:"0 auto"}}>
        {[10,20,30].map(lvl => {
          const pts = PCT_AREAS.map((a,i) => pointAt(i, lvl).join(",")).join(" ");
          return <polygon key={lvl} points={pts} fill="none" stroke="#BABDCC" strokeWidth="1"/>;
        })}
        {PCT_AREAS.map((a,i) => {
          const [x,y] = vertexAt(i);
          return <line key={a.key} x1={center} y1={center} x2={x} y2={y} stroke="#BABDCC" strokeWidth="1"/>;
        })}
        <path d={pathD} fill="#EAF1FE" fillOpacity="0.85" stroke="#006EFA" strokeWidth="2"
          strokeDasharray={allScored ? "none" : "5 4"}/>
        {PCT_AREAS.map((a,i) => {
          const [x,y] = dataPoints[i];
          const v = scores[a.key];
          const isWeakest = weakestKeys.includes(a.key);
          return (
            <circle key={a.key} cx={x} cy={y} r={isWeakest ? 7 : 4.5}
              fill={v==null ? "#fff" : (isWeakest ? "#D64545" : "#006EFA")}
              stroke={v==null ? "#BABDCC" : "#141E50"} strokeWidth={v==null ? 1 : 1.5}/>
          );
        })}
        {PCT_AREAS.map((a,i) => {
          const angle = angleFor(i);
          const lx = center + labelR*Math.cos(angle), ly = center + labelR*Math.sin(angle);
          // Każda etykieta obszaru ma dokładnie dwa słowa — łamiemy PO KAŻDYM słowie (nie tylko
          // przy "/"), żeby wąskie osie lewa/prawa (kąt 0/180) nie wypychały tekstu poza viewBox.
          const lines = a.label.replace(" / ", " ").split(" ");
          const isWeakest = weakestKeys.includes(a.key);
          const v = scores[a.key];
          return (
            <text key={a.key} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
              fontSize="11" fontWeight={isWeakest ? 700 : 500} fill={isWeakest ? "#D64545" : "#141E50"}>
              {lines.map((line,li) => (
                <tspan key={li} x={lx} dy={li===0 ? (lines.length>1 ? -6 : 0) : 13}>{line}</tspan>
              ))}
              <tspan x={lx} dy={14} fontSize="10" fontWeight={400} fill="#4A5278">{v!=null ? "("+Math.round(v)+"/30)" : "brak danych"}</tspan>
            </text>
          );
        })}
      </svg>
      {!allScored && (
        <p className="hint" style={{textAlign:"center"}}>
          {anyScored ? "Uzupełnij pytania każdego obszaru, aby wykres pokazał pełny wynik." : "Odpowiedz na pytania poniżej, aby zobaczyć wynik na wykresie."}
        </p>
      )}
    </div>
  );
}

function Diagnoza({state, pctAvg, pctWeakestAreas, pctLatestScores, showPct, setPct, setPctAnswer, addPctCheckpoint, showQuick, quickScoresObj, quickAvg, quickWeakestAreas, setQuickAnswer, hasIncompleteGroups, addGroup, updateGroup, removeGroup, setAdkar, categoryBarrier, adkarRollup, usesOptionalCategory, enableOptionalCategory}){
  const activeCategories = CATEGORIES.concat(usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
  const missingCategory = state.groups.filter(g => !g.categoryId).length;
  const missingWplyw = state.groups.filter(g => g.categoryId && !(g.wplyw||"").trim()).length;
  // Numeracja sekcji liczona dynamicznie — pełna ocena (poziom 3) i szybka ocena (poziom 2)
  // dzielą ten sam numer kroku 1, bo dla danego projektu widoczna jest tylko jedna z nich.
  let step = 0;
  const assessmentStep = (showPct || showQuick) ? ++step : null;
  const groupsStep = ++step;
  const adkarStep = ++step;
  const skanStep = ++step;
  return (
    <React.Fragment>
      {showPct && (
        <div className="card">
          <h2>{assessmentStep}. PCT — kondycja całego przedsięwzięcia</h2>
          <p className="hint">
            Ocena pokazuje, na ile przedsięwzięcie jest przygotowane nie tylko do dostarczenia rezultatów projektu,
            ale również do ich skutecznego wdrożenia i wykorzystania w codziennej działalności organizacji. Na każde
            pytanie odpowiadasz w skali 1–5 — wynik obszaru (1–30) liczy się sam z sześciu odpowiedzi.
          </p>
          <p className="hint">Progi robocze (nie są oficjalnymi progami Prosci): 10–19 = wymaga działania, 20–24 = wymaga uwagi, 25–30 = mocny obszar. Zawsze reaguj na najsłabszy z czterech wyników.</p>
          <details style={{marginBottom:14}}>
            <summary style={{cursor:"pointer", fontWeight:600}}>Przykłady działań dla poszczególnych obszarów</summary>
            <table style={{marginTop:8}}>
              <thead><tr><th>Obszar</th><th>Przykład wpisu</th></tr></thead>
              <tbody>{PCT_AREAS.map(a => <tr key={a.key}><th style={{width:200}}>{a.label}</th><td>{a.example}</td></tr>)}</tbody>
            </table>
          </details>
          {state.pctHistory.map((p, idx) => {
            const rowScores = pctScores(p);
            const rowWeakest = computeWeakestPctAreas(rowScores);
            const isLast = idx === state.pctHistory.length - 1;
            return (
              <details key={p.id} className="action-row" open={isLast} style={{marginBottom:14}}>
                <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>
                  {p.punktKontrolny || ("Pomiar " + (idx+1))}{p.data ? " — " + p.data : ""}
                  {PCT_AREAS.some(a => rowScores[a.key]!=null) && (" · " + PCT_AREAS.map(a => a.label + " " + (rowScores[a.key]!=null ? rowScores[a.key]+"/30" : "–")).join(", "))}
                </summary>
                <div className="grid cols2" style={{marginBottom:14}}>
                  <Field label="Data"><input type="date" value={p.data} onChange={e=>setPct(idx,"data",e.target.value)}/></Field>
                  <Field label="Punkt kontrolny"><input type="text" value={p.punktKontrolny} onChange={e=>setPct(idx,"punktKontrolny",e.target.value)}/></Field>
                </div>
                {PCT_AREAS.map(a => (
                  <div key={a.key} style={{marginBottom:16}}>
                    <div className="flex-between" style={{marginBottom:6}}>
                      <h4 style={{margin:0}}>{a.label}</h4>
                      {rowScores[a.key]!=null && <Badge tone={pctTone(rowScores[a.key])}>{rowScores[a.key]}/30</Badge>}
                    </div>
                    {PCT_QUESTIONS[a.key].map((q, qi) => (
                      <div key={qi} className="flex-between" style={{marginBottom:8}}>
                        <div style={{maxWidth:520}}>{q}</div>
                        <Likert value={p.answers[a.key][qi]} onChange={v=>setPctAnswer(idx, a.key, qi, v)}/>
                      </div>
                    ))}
                  </div>
                ))}
                {rowWeakest.length > 0 && (
                  <div className="banner warn" style={{marginTop:10}}>
                    <strong>Najsłabszy obszar: {rowWeakest.map(a=>a.label+" ("+a.value+"/30)").join(" i ")}</strong>
                    {rowWeakest.map(a => <div key={a.key} style={{marginTop:4}}>{a.recommendation}</div>)}
                  </div>
                )}
                <div className="grid cols2" style={{marginTop:10}}>
                  <Field label="Działania usprawniające do kolejnego przeglądu"
                    hint="Wpisz działania, które zostaną podjęte przed kolejnym przeglądem w celu poprawy najsłabiej ocenionego obszaru lub ograniczenia zidentyfikowanych ryzyk.">
                    <input type="text" value={p.decyzja} onChange={e=>setPct(idx,"decyzja",e.target.value)}/>
                  </Field>
                  <Field label="Kolejny przegląd"><input type="date" value={p.kolejnyPrzeglad} onChange={e=>setPct(idx,"kolejnyPrzeglad",e.target.value)}/></Field>
                </div>
              </details>
            );
          })}
          <button className="small" onClick={addPctCheckpoint}>+ Kolejny pomiar</button>
          <PctRadarChart scores={pctLatestScores} weakestKeys={pctWeakestAreas.map(a=>a.key)}/>
          <div className="banner info flex-between" style={{marginTop:14}}>
            <div>Średnia ostatniego pomiaru: <strong>{pctAvg!=null ? pctAvg.toFixed(1) : "–"}</strong>{pctWeakestAreas.length ? (" · Najsłabszy obszar: " + pctWeakestAreas.map(a=>a.label).join(" i ")) : ""}</div>
            <Badge tone={pctTone(pctAvg)}>{PCT_TONE_LABELS[pctTone(pctAvg)]}</Badge>
          </div>
        </div>
      )}
      {showQuick && (
        <div className="card">
          <h2>{assessmentStep}. Szybka ocena gotowości przedsięwzięcia</h2>
          <p className="hint">
            Skrócony zestaw pytań (2 na obszar zamiast 6) — pokazuje, czy przedsięwzięcie jest gotowe nie tylko do
            dostarczenia rezultatów projektu, ale też do ich skutecznego wykorzystania w codziennej pracy. Na każde
            pytanie odpowiadasz w skali 1–5.
          </p>
          {PCT_AREAS.map(a => (
            <div key={a.key} style={{marginBottom:16}}>
              <div className="flex-between" style={{marginBottom:6}}>
                <h4 style={{margin:0}}>{a.label}</h4>
                {quickScoresObj[a.key]!=null && <Badge tone={pctTone(quickScoresObj[a.key])}>{quickScoresObj[a.key]}/30</Badge>}
              </div>
              {QUICK_ASSESSMENT_QUESTION_INDEXES[a.key].map((qIdx, i) => (
                <div key={qIdx} className="flex-between" style={{marginBottom:8}}>
                  <div style={{maxWidth:520}}>{PCT_QUESTIONS[a.key][qIdx]}</div>
                  <Likert value={state.quickAssessment[a.key][i]} onChange={v=>setQuickAnswer(a.key, i, v)}/>
                </div>
              ))}
            </div>
          ))}
          <PctRadarChart scores={quickScoresObj} weakestKeys={quickWeakestAreas.map(a=>a.key)}/>
          {quickWeakestAreas.length > 0 && (
            <div className="banner warn" style={{marginTop:10}}>
              <strong>Najsłabszy obszar: {quickWeakestAreas.map(a=>a.label+" ("+a.value+"/30)").join(" i ")}</strong>
              {quickWeakestAreas.map(a => <div key={a.key} style={{marginTop:4}}>{a.recommendation}</div>)}
            </div>
          )}
          <div className="banner info flex-between" style={{marginTop:14}}>
            <div>Średnia: <strong>{quickAvg!=null ? quickAvg.toFixed(1) : "–"}</strong>{quickWeakestAreas.length ? (" · Najsłabszy obszar: " + quickWeakestAreas.map(a=>a.label).join(" i ")) : ""}</div>
            <Badge tone={pctTone(quickAvg)}>{PCT_TONE_LABELS[pctTone(quickAvg)]}</Badge>
          </div>
        </div>
      )}

      <div className="card">
        <div className="flex-between">
          <h2 style={{margin:0}}>{groupsStep}. Grupy objęte zmianą</h2>
          <button className="small" onClick={addGroup}>+ Dodaj grupę</button>
        </div>
        <p className="hint">Wpisz grupy osób, których charakter lub sposób pracy może ulec zmianie, i przypisz każdą do jednej z kategorii.</p>
        <details style={{marginBottom:10}}>
          <summary style={{cursor:"pointer", fontWeight:600}}>Co kryje się pod poszczególnymi kategoriami?</summary>
          <table style={{marginTop:8}}>
            <tbody>{ALL_CATEGORIES.map(c => <tr key={c.id}><th style={{width:280}}>{c.label}</th><td>{c.hint}</td></tr>)}</tbody>
          </table>
        </details>
        {(missingCategory>0 || missingWplyw>0) && (
          <div className="banner warn">
            {missingCategory>0 && <div>{missingCategory} grup(y) bez przypisanej kategorii.</div>}
            {missingWplyw>0 && <div>{missingWplyw} grup(y) z kategorią, ale bez wypełnionego pola „Co zmienia się w ich pracy?”.</div>}
            Dopóki oba pola nie są uzupełnione, grupa nie trafi do diagnozy ADKAR, a zakładki <strong>Plan działań</strong> i <strong>Pulpit</strong> pozostaną ukryte.
          </div>
        )}
        <table>
          <thead><tr><th>Grupa</th><th>Co zmienia się w ich pracy?</th><th>Kategoria</th><th></th></tr></thead>
          <tbody>
            {state.groups.map(g => (
              <tr key={g.id}>
                <td><input type="text" value={g.nazwa} onChange={e=>updateGroup(g.id,"nazwa",e.target.value)}/></td>
                <td><input type="text" value={g.wplyw} onChange={e=>updateGroup(g.id,"wplyw",e.target.value)}/></td>
                <td>
                  <select value={g.categoryId} onChange={e=>updateGroup(g.id,"categoryId",e.target.value)}>
                    <option value="">— wybierz kategorię —</option>
                    {activeCategories.map(c => <option key={c.id} value={c.id} title={c.hint}>{c.label}</option>)}
                  </select>
                </td>
                <td><button className="small" onClick={()=>removeGroup(g.id)}>Usuń</button></td>
              </tr>
            ))}
            {state.groups.length===0 && <tr><td colSpan="4" className="muted">Brak grup — kliknij „Dodaj grupę”.</td></tr>}
          </tbody>
        </table>
        {!usesOptionalCategory && (
          <button className="small" style={{marginTop:10}} onClick={enableOptionalCategory}>+ Włącz kategorię „Klienci / studenci” (opcjonalnie)</button>
        )}
      </div>

      <div className="card">
        <h2>{adkarStep}. Ocena ADKAR dla każdej kategorii</h2>
        <p className="hint">
          ADKAR ocenia, na ile każda kategoria jest gotowa na zmianę: <strong>Awareness</strong> (świadomość
          potrzeby zmiany), <strong>Desire</strong> (chęć wspierania i uczestnictwa), <strong>Knowledge</strong> (wiedza,
          jak pracować w nowy sposób), <strong>Ability</strong> (praktyczne umiejętności), <strong>Reinforcement</strong> (trwałe
          stosowanie). Wynik przekłada się bezpośrednio na Plan działań — tam w pierwszej kolejności zajmujemy się
          najsłabiej ocenionym obszarem każdej kategorii.
        </p>
        <p className="hint">Oceń każdą kategorię w skali 1–5. 1–2 oznacza istotną barierę, 3 wymaga uwagi, 4–5 to dobra gotowość.</p>
        {activeCategories.map(c => {
          const d = state.adkarByCategory[c.id];
          const barriers = categoryBarrier(c.id);
          const catGroups = state.groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
          const body = (
            <React.Fragment>
              {catGroups.length>0 && <div className="pill-list" style={{marginBottom:10}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
              <div className="grid cols2">
                <div>
                  {ADKAR_DIMS.map(dim => (
                    <div key={dim.id} className="flex-between" style={{marginBottom:8}}>
                      <div style={{fontSize:12.5}}>{dim.label}<div className="muted" style={{fontSize:11}}>{dim.sub}</div></div>
                      <Likert value={d[dim.id]} onChange={v=>setAdkar(c.id, dim.id, v)}/>
                    </div>
                  ))}
                </div>
                <div>
                  <Field label="Co powinno się zmienić dla tej grupy?"
                    hint="Opisz, jaki jest docelowy, pożądany stan (nie działanie — to zaplanujesz w Planie działań).">
                    <textarea value={d.wniosek} onChange={e=>setAdkar(c.id,"wniosek",e.target.value)} placeholder="np. Pracownicy wiedzą, jak wykonywać proces w nowym systemie i stosują go w codziennej pracy."/>
                  </Field>
                  {barriers.length>0 && barriers.map(b => (
                    <div key={b.id} className="hint" style={{marginBottom:6}}>
                      <strong>Bariera „{b.label}”</strong> — {ADKAR_BARRIER_INTRO[b.id]} {ADKAR_SUGGESTIONS[b.id]}
                      <div>Przykładowe działania: {ADKAR_EXAMPLES[b.id].join(", ")}.</div>
                    </div>
                  ))}
                </div>
              </div>
            </React.Fragment>
          );
          if (catGroups.length===0){
            return (
              <details key={c.id} className="action-row">
                <summary style={{cursor:"pointer"}}><strong>{c.label}</strong> <span className="muted">(brak przypisanych grup)</span></summary>
                <div style={{marginTop:10}}>{body}</div>
              </details>
            );
          }
          return (
            <div key={c.id} className="action-row">
              <div className="top">
                <strong>{c.label}</strong>
                {barriers.length>0 && <Badge tone="orange">Największa bariera: {barriers.map(b=>b.label).join(" i ")}</Badge>}
              </div>
              {body}
            </div>
          );
        })}
      </div>

      <div className="card">
        <h2>{skanStep}. ADKAR — szybki skan</h2>
        <p className="hint">Liczy się automatycznie z ocen powyżej.</p>
        {adkarRollup.map(r => (
          <div key={r.id} style={{marginBottom:14}}>
            <Bar label={r.label} value={r.avg} max={5}/>
            <div className="hint" style={{margin:"2px 0 0 160px"}}>
              {r.min!=null ? ("min " + r.min + " · ") : ""}
              {r.atRiskCount>0 ? (r.atRiskCount + " kateg. z oceną ≤2 (" + r.atRisk.join(", ") + ")") : "brak kategorii w ryzyku"}
              {" · "}{r.suggestion}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function PlanDzialan({actionsByCategory, categoryBarrier, adkarByCategory, groups, addAction, updateAction, removeAction, usesOptionalCategory, milestones, teamMembers}){
  const activeCategories = CATEGORIES.concat(usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
  return (
    <div className="card">
      <h2>Plan działań</h2>
      <p className="hint">Dla każdej kategorii wybierz maksymalnie {MAX_ACTIONS_PER_CATEGORY} najważniejsze działania, które w największym stopniu pomogą usunąć zidentyfikowane bariery.</p>
      {activeCategories.map(c => {
        const actions = actionsByCategory[c.id] || [];
        const barriers = categoryBarrier(c.id);
        const wniosek = adkarByCategory[c.id]?.wniosek;
        const catGroups = groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
        const atLimit = actions.length >= MAX_ACTIONS_PER_CATEGORY;
        return (
          <div key={c.id} style={{marginBottom:22}}>
            <div className="flex-between">
              <div>
                <strong>{c.label}</strong>
                {barriers.length>0 && <span className="tag" style={{marginLeft:8}}>bariera: {barriers.map(b=>b.label).join(" i ")}</span>}
              </div>
              <button className="small" disabled={atLimit} onClick={()=>addAction(c.id)}>+ Dodaj działanie ({actions.length}/{MAX_ACTIONS_PER_CATEGORY})</button>
            </div>
            {catGroups.length>0 && <div className="pill-list" style={{margin:"6px 0"}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
            {wniosek && <p className="hint" style={{margin:"4px 0 10px"}}>Co powinno się zmienić dla tej grupy: {wniosek}</p>}
            {barriers.length>0 && (
              <div style={{margin:"4px 0 10px"}}>
                {barriers.map(b => (
                  <p key={b.id} className="hint" style={{margin:"2px 0"}}>
                    Przykładowe działania na barierę „{b.label}”: {ADKAR_EXAMPLES[b.id].join(", ")}.
                  </p>
                ))}
              </div>
            )}
            {atLimit && <div className="banner warn">Limit {MAX_ACTIONS_PER_CATEGORY} działań na kategorię. Rozważ połączenie działań lub rozbicie na etapy w ramach istniejących wierszy, zamiast dodawać kolejne.</div>}

            {actions.map(a => (
              <div key={a.id} className="action-row">
                <div className="top">
                  <span className="muted">Działanie</span>
                  <button className="small" onClick={()=>removeAction(a.id)}>Usuń</button>
                </div>
                <div className="grid cols2">
                  <Field label="Działanie"><textarea value={a.dzialanie} onChange={e=>updateAction(a.id,"dzialanie",e.target.value)} placeholder="Co konkretnie zrobimy?"/></Field>
                  <Field label="Jak sprawdzimy gotowość?"><textarea value={a.weryfikacja} onChange={e=>updateAction(a.id,"weryfikacja",e.target.value)} placeholder="Po czym poznamy, że grupa osiągnęła gotowość?"/></Field>
                </div>
                <div className="grid cols3">
                  <Field label="Kamień milowy / etap"
                    hint="Wskaż etap projektu lub kamień milowy, z którym powiązane jest to działanie (np. rozpoczęcie szkoleń, uruchomienie rozwiązania, pilotaż, przejście na nowy proces, stabilizacja po wdrożeniu).">
                    <input type="text" list="milestones-dl" value={a.kamien} onChange={e=>updateAction(a.id,"kamien",e.target.value)}/>
                  </Field>
                  <Field label="Termin"><input type="date" value={a.termin} onChange={e=>updateAction(a.id,"termin",e.target.value)}/></Field>
                  <Field label="Odpowiedzialny"
                    hint="Wskaż właściciela działania, który odpowiada za jego realizację, koordynację zaangażowanych osób oraz monitorowanie postępów.">
                    <input type="text" list="team-dl" value={a.odpowiedzialny} onChange={e=>updateAction(a.id,"odpowiedzialny",e.target.value)}/>
                  </Field>
                </div>
                <div className="grid cols2">
                  <Field label="Status">
                    <select value={a.status} onChange={e=>updateAction(a.id,"status",e.target.value)}>
                      {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </Field>
                  <Field label="">
                    <label style={{display:"flex", alignItems:"center", gap:8, fontWeight:400}}>
                      <input type="checkbox" checked={a.dodanoDoHarmonogramu} onChange={e=>updateAction(a.id,"dodanoDoHarmonogramu",e.target.checked)}/>
                      Dodano do harmonogramu projektu
                    </label>
                  </Field>
                </div>
                <p className="hint" style={{margin:"6px 0 0"}}>
                  Pamiętaj: działania zaplanowane w tym miejscu powinny być dodane do harmonogramu projektu.
                  Kluczowe działania należy uwzględnić również w planie projektu we FlexiProject.
                </p>
              </div>
            ))}
            {actions.length===0 && <p className="muted">Brak działań w tej kategorii.</p>}
          </div>
        );
      })}
      <datalist id="milestones-dl">
        {milestones.map(m => <option key={m.id} value={m.nazwa}/>)}
      </datalist>
      <datalist id="team-dl">
        {teamMembers.map(t => <option key={t.id} value={t.imie}/>)}
      </datalist>
    </div>
  );
}

function Pulpit({project, level, surveyTotal, readinessAvg, readinessWeakestAreas, readinessLabel, statusCounts, signals, goTo}){
  const wipOver = statusCounts["W realizacji"] > MAX_WIP_ACTIONS;
  return (
    <React.Fragment>
      <div className="card">
        <h2>Kontekst</h2>
        <div className="grid cols3">
          <div><div className="muted">Projekt / program</div><div>{project.nazwa || "–"}</div></div>
          <div><div className="muted">Sponsor</div><div>{project.sponsor || "–"}</div></div>
          <div><div className="muted">Typ projektu</div><div>{project.typProjektu || "–"}</div></div>
          <div><div className="muted">Skala zmiany</div><div><Badge tone={level.color}>{level.complete ? (surveyTotal + " pkt — poziom " + level.poziom) : "ankieta nieukończona"}</Badge></div></div>
          <div><div className="muted">{readinessLabel} — średnia</div><div><Badge tone={pctTone(readinessAvg)}>{readinessAvg!=null?readinessAvg.toFixed(1):"brak danych"}</Badge></div></div>
          <div><div className="muted">{readinessLabel} — najsłabszy obszar</div><div>{readinessWeakestAreas.length ? readinessWeakestAreas.map(a=>a.label).join(" i ") : "–"}</div></div>
        </div>
      </div>

      <div className="card">
        <h2>Pulpit planu działań</h2>
        <div className="grid cols4">
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.all}</div><div className="muted">wszystkie</div></div>
          <div className="action-row" style={{textAlign:"center"}}>
            <div style={{fontSize:24, fontWeight:700, color: wipOver?"var(--red)":"inherit"}}>{statusCounts["W realizacji"]}</div>
            <div className="muted">w realizacji {wipOver ? "(limit " + MAX_WIP_ACTIONS + "!)" : ""}</div>
          </div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts["Zablokowane"]}</div><div className="muted">zablokowane</div></div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.dodaneDoHarmonogramu}</div><div className="muted">dodane do harmonogramu</div></div>
        </div>
        <p className="hint">Zasada WIP: maksymalnie {MAX_WIP_ACTIONS} działań ze statusem „W realizacji” jednocześnie — pozostałe czekają jako „Do zaplanowania”.</p>
      </div>

      <div className="card">
        <h2>Sygnały do decyzji</h2>
        <table>
          <tbody>
            <tr><td>Brak odpowiedzialnego</td><td><Badge tone={signals.brakOdpowiedzialnego>0?"orange":"green"}>{signals.brakOdpowiedzialnego}</Badge></td></tr>
            <tr><td>Brak terminu / kamienia milowego</td><td><Badge tone={signals.brakTerminu>0?"orange":"green"}>{signals.brakTerminu}</Badge></td></tr>
            <tr><td>Zablokowane</td><td><Badge tone={signals.zablokowane>0?"red":"green"}>{signals.zablokowane}</Badge></td></tr>
          </tbody>
        </table>
      </div>

      <div className="card">
        <p className="hint" style={{margin:0}}>Pełny opis sposobu pracy z PZZ — zakładka <a href="#" onClick={(e)=>{e.preventDefault(); goTo("przewodnik");}}>Przewodnik</a>.</p>
      </div>
    </React.Fragment>
  );
}

function Przewodnik(){
  return (
    <div className="card">
      <h2>Jak pracować z PZZ</h2>
      <p className="hint">
        Zacznij od wczytania karty projektu w zakładce <strong>Dane projektu</strong> — bez tabelki „Grupy objęte
        zmianą”, tę wypełnisz później, w miejscu zależnym od skali zmiany. Potem przejdź do <strong>Ankiety
        — skala zmiany</strong>. Dopóki nie odpowiesz na wszystkie 13 pytań, narzędzie nie wie, jak duża jest
        zmiana, i nie pokazuje żadnej dalszej ścieżki. Po ukończeniu ankiety pojawia się jedna z trzech ścieżek:
      </p>
      <ul>
        <li><strong>Poziom 1 (mała zmiana):</strong> zakładka „Checklisty” — krótkie pytania o sponsora. Grupy objęte zmianą wypełnij bezpośrednio w karcie projektu.</li>
        <li><strong>Poziom 2 (średnia zmiana):</strong> „Checklisty” + „Diagnoza” (szybka ocena gotowości, grupy i ADKAR) + „Plan działań” + „Pulpit”. Grupy wypełnij tutaj, w Diagnozie — nie duplikuj tego w karcie.</li>
        <li><strong>Poziom 3 (duża zmiana):</strong> „Diagnoza” (pełne PCT + ADKAR), „Plan działań” i „Pulpit”.</li>
      </ul>
      <p className="hint">
        „Plan działań” i „Pulpit” odblokowują się dopiero, gdy każda dodana grupa ma przypisaną kategorię
        i wypełnione pole „Co zmienia się w ich pracy?” — dopóki tak nie jest, te zakładki są ukryte.
      </p>
      <p className="hint">Jeśli w trakcie pracy okaże się, że zmiana jest inna niż na starcie, wróć do „Ankiety” i zmień odpowiedzi — ścieżka przełączy się automatycznie.</p>
      <h3>Praca w Diagnozie i Planie działań</h3>
      <ol>
        <li><strong>Diagnoza:</strong> uzupełnij ocenę gotowości (pełny PCT dla dużej zmiany, szybka ocena dla średniej), przypisz grupy do kategorii i wykonaj oceny ADKAR.</li>
        <li><strong>Plan:</strong> wpisz działania (max {MAX_ACTIONS_PER_CATEGORY}/kategorię), sposób sprawdzenia gotowości i zaznacz, czy działanie trafiło do harmonogramu projektu.</li>
        <li><strong>Pulpit:</strong> podczas przeglądu aktualizuj statusy działań i reaguj na blokady.</li>
      </ol>

      <h3>Jak utrzymać spojrzenie z lotu ptaka</h3>
      <ol>
        <li><strong>Łącz grupy w segmenty</strong> — rozdzielaj je dopiero, gdy różnią się przekazem, wsparciem, właścicielem lub terminem.</li>
        <li><strong>Projektuj rezultaty, nie listy dla grup</strong> — najpierw jeden wspólny rezultat i wszystkie objęte nim grupy; osobny wariant tylko przy różnym właścicielu, terminie, formie lub przekazie.</li>
        <li><strong>Wymagaj powiązania z projektem</strong> — każde aktywne działanie przypisz do kamienia milowego, etapu albo pracy ciągłej (BAU), i dodaj je do harmonogramu projektu (kluczowe działania też do FlexiProject).</li>
        <li><strong>Planuj krocząco</strong> — horyzont „teraz” opisuj szczegółowo, kolejne okresy utrzymuj ramowo.</li>
        <li><strong>Ogranicz pracę rozpoczętą</strong> — maksymalnie {MAX_WIP_ACTIONS} działań w statusie „W realizacji”. Pozostałe czekają jako „Do zaplanowania”.</li>
      </ol>

      <h3>Co jeszcze jest w toku (otwarte tematy z zespołu)</h3>
      <ul>
        <li>Checklisty dla poziomu 1 i 2 zmiany — w przygotowaniu (Martyna); obecna wersja w zakładce „Checklisty” to zaślepka.</li>
        <li>Kategoria „Klienci / studenci” — opcjonalna, do przetestowania na żywym projekcie.</li>
        <li>Nazewnictwo „menedżerowie liniowi” — do ostatecznego uzgodnienia z HR.</li>
      </ul>
    </div>
  );
}
