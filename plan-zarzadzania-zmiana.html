<script type="text/plain" id="app-source">
const {useState, useMemo, useEffect, useRef} = React;

/* ---------- Model referencyjny (zgodny z arkuszem PZZ Grupy Merito) ---------- */

const CATEGORIES = [
  {id:"kierunek", label:"Nadają kierunek i usuwają bariery", hint:"Sponsorzy, zarząd, dyrektorzy"},
  {id:"przelozeni", label:"Bezpośredni przełożeni — usuwają bariery i/lub sami zmieniają nawyki", hint:"Kierownicy wspierający pracowników we wdrożeniu, informujący"},
  {id:"nowezasady", label:"Pracują według nowych zasad", hint:"Główni użytkownicy zmiany"},
  {id:"wdrozenie", label:"Przygotowują i wspierają wdrożenie", hint:"PM, PMO, HR, IT, trenerzy"},
];
const OPTIONAL_CATEGORY = {id:"klienci", label:"Klienci / studenci (zewnętrzni odbiorcy zmiany) — opcjonalna, do przetestowania", optional:true,
  hint:"Osoby spoza projektu odczuwające skutki zmiany i wymagające zaplanowania dedykowanych działań, np. studenci"};
const ALL_CATEGORIES = [...CATEGORIES, OPTIONAL_CATEGORY];
const MAX_ACTIONS_PER_CATEGORY = 3;
const MAX_WIP_ACTIONS = 5;

const ADKAR_DIMS = [
  {id:"awareness", label:"Awareness", sub:"świadomość potrzeby zmiany"},
  {id:"desire", label:"Desire", sub:"chęć wspierania i uczestnictwa w zmianie"},
  {id:"knowledge", label:"Knowledge", sub:"wiedza, jak pracować w nowy sposób"},
  {id:"ability", label:"Ability", sub:"praktyczne umiejętności pracy w nowy sposób"},
  {id:"reinforcement", label:"Reinforcement", sub:"trwałe stosowanie nowego sposobu pracy"},
];
const ADKAR_SUGGESTIONS = {
  awareness: "Zaplanuj wspólny rezultat wyjaśniający sens i rolę w zmianie.",
  desire: "Pokaż korzyści, daj wpływ i uruchom widoczne sponsorstwo.",
  knowledge: "Zapewnij wspólną bazę wiedzy z modułami dla różnych ról.",
  ability: "Dodaj ćwiczenia, testy i wsparcie w rzeczywistej pracy.",
  reinforcement: "Ustal właścicieli, pomiary, przeglądy i sposób reagowania na powrót do starych praktyk.",
};
// Gotowe przykłady działań na barierę — do wglądu przy diagnozie i przy planowaniu działań,
// żeby nie zaczynać od pustej kartki (uwagi zespołu: "przy zidentyfikowaniu bariery automatycznie
// warto wyświetlać przykłady/sugestię działań").
const ADKAR_BARRIER_INTRO = {
  awareness: "Jeżeli ludzie nie rozumieją, dlaczego coś robimy.",
  desire: "Jeżeli ludzie wiedzą „dlaczego”, ale nie chcą.",
  knowledge: "Jeżeli ludzie chcą, ale nie wiedzą jak.",
  ability: "Jeśli ludzie mają wiedzę, ale nie potrafią jej zastosować w praktyce.",
  reinforcement: "Jeśli ludzie już pracują nowym sposobem, ale mogą wrócić do starych nawyków.",
};
const ADKAR_EXAMPLES = {
  awareness: ["komunikacja powodów zmiany", "prezentacja korzyści", "spotkania informacyjne dla pracowników", "udział sponsora w rozmowach z kluczowymi grupami"],
  desire: ["zaangażowanie przedstawicieli grup w projektowanie rozwiązania", "indywidualne rozmowy z osobami stawiającymi największy opór", "identyfikacja i adresowanie obaw", "pokazanie korzyści dla konkretnych grup", "wykorzystanie ambasadorów zmiany"],
  knowledge: ["instrukcje krok po kroku", "baza wiedzy lub FAQ", "krótkie filmy instruktażowe", "webinary i sesje pytań i odpowiedzi", "checklisty dla użytkowników", "materiały dla menedżerów", "szkolenia"],
  ability: ["ćwiczenia na rzeczywistych przypadkach", "okres wsparcia po uruchomieniu rozwiązania", "dyżury ekspertów", "mentoring lub coaching"],
  reinforcement: ["uwzględnienie nowych zasad w procedurach", "monitorowanie wskaźników wykorzystania rozwiązania", "przeglądy po wdrożeniu", "regularne przypomnienia dla użytkowników", "omówienie efektów osiągniętych dzięki zmianie", "nagradzanie dobrych praktyk"],
};

// Opisy i przykładowe wpisy per obszar PCT — pokazywane automatycznie przy najsłabszym obszarze
// (uwagi zespołu: "w pierwszej kolejności... wskazówkę czym trzeba się zająć").
const PCT_AREAS = [
  {key:"definicjaSukcesu", label:"Definicja sukcesu",
    recommendation:"Upewnij się, że cele, korzyści i mierniki sukcesu są jednoznacznie określone oraz zrozumiałe dla kluczowych interesariuszy.",
    example:"Doprecyzowanie mierników sukcesu i uzgodnienie wartości docelowych ze Sponsorem."},
  {key:"przywodztwo", label:"Przywództwo / sponsoring",
    recommendation:"Zwiększ widoczność i zaangażowanie sponsora — regularna komunikacja, udział w kluczowych decyzjach i spotkaniach statusowych.",
    example:"Comiesięczne komunikaty Sponsora do kierowników jednostek oraz udział Sponsora w spotkaniach statusowych."},
  {key:"zarzadzanieProjektem", label:"Zarządzanie projektem",
    recommendation:"Sprawdź, czy zakres, harmonogram i ryzyka są aktualne i mają przypisanych właścicieli.",
    example:"Aktualizacja harmonogramu, przypisanie właścicieli działań i przegląd ryzyk."},
  {key:"zarzadzanieZmiana", label:"Zarządzanie zmianą",
    recommendation:"W pierwszej kolejności zaplanuj działania wspierające wykorzystanie rezultatów projektu w codziennej pracy, np. komunikację, szkolenia, wsparcie menedżerów lub dostosowanie procesów.",
    example:"Opracowanie planu komunikacji oraz spotkań informacyjnych dla grup objętych zmianą."},
];

// Zwraca WSZYSTKIE obszary PCT związane najniższym wynikiem w danym pomiarze (remis = kilka
// obszarów do zaadresowania w pierwszej kolejności, nie tylko jeden) — używane zarówno dla
// zagregowanego "ostatniego pomiaru" w pulpicie/nagłówku, jak i osobno dla każdego wiersza
// historii PCT w Diagnozie.
function computeWeakestPctAreas(row){
  if (!row) return [];
  let worstVal = Infinity;
  PCT_AREAS.forEach(a => {
    const v = row[a.key];
    if (v !== "" && v != null && Number(v) < worstVal) worstVal = Number(v);
  });
  if (worstVal === Infinity) return [];
  return PCT_AREAS.filter(a => {
    const v = row[a.key];
    return v !== "" && v != null && Number(v) === worstVal;
  }).map(a => ({...a, value: worstVal}));
}

// Pytania do oceny PCT (poziom 3, pełna) — 6 pytań na obszar, odpowiedź w skali Likerta 1-5
// (komponent <Likert>, ten sam co w Ankiecie). Konkretne, sprawdzalne fakty ("czy sponsor jest
// wskazany z imienia i nazwiska?"), nie abstrakcyjne oceny dojrzałości — żeby PM bez wiedzy
// o zarządzaniu zmianą wiedział, jak odpowiedzieć.
const PCT_QUESTIONS = {
  definicjaSukcesu: [
    "Czy dla projektu określono cele, które da się jednoznacznie sprawdzić po jego zakończeniu?",
    "Czy określono konkretne korzyści biznesowe, które projekt ma przynieść?",
    "Czy dla korzyści biznesowych określono mierniki z wartościami docelowymi (liczba, %, termin)?",
    "Czy sponsor potwierdził, że zgadza się z tak zdefiniowanymi celami i miernikami?",
    "Czy w definicji sukcesu uwzględniono nie tylko dostarczenie produktów projektu, ale też ich faktyczne wykorzystanie po zakończeniu?",
    "Czy osoby, których dotyczy zmiana, wiedzą, jak będzie wyglądał sukces tego projektu?",
  ],
  przywodztwo: [
    "Czy sponsor projektu jest wskazany z imienia i nazwiska?",
    "Czy sponsor osobiście komunikował potrzebę tej zmiany (spotkanie, mail, nagranie)?",
    "Czy sponsor uczestniczył w podjęciu kluczowych decyzji dotyczących projektu w ciągu ostatnich 3 miesięcy?",
    "Czy oprócz sponsora są inni menedżerowie/liderzy, którzy publicznie popierają tę zmianę?",
    "Czy sponsor jest dostępny dla zespołu projektowego, gdy potrzebna jest jego decyzja lub interwencja?",
    "Czy kierownictwo wyższego szczebla konsekwentnie przekazuje ten sam komunikat o zmianie (bez sprzecznych sygnałów)?",
  ],
  zarzadzanieProjektem: [
    "Czy zakres projektu jest spisany i aktualny?",
    "Czy istnieje aktualny harmonogram z konkretnymi terminami kamieni milowych?",
    "Czy ryzyka projektu są spisane i każde ma przypisaną osobę odpowiedzialną?",
    "Czy budżet projektu jest znany i śledzony na bieżąco (plan vs. wykonanie)?",
    "Czy każdy członek zespołu projektowego wie, za co dokładnie odpowiada?",
    "Czy postępy projektu są raportowane do sponsora co najmniej raz w miesiącu?",
  ],
  zarzadzanieZmiana: [
    "Czy spisano listę grup/osób, których sposób pracy zmieni się w wyniku projektu?",
    "Czy dla każdej z tych grup określono, na czym konkretnie polega zmiana w ich pracy?",
    "Czy istnieje plan komunikacji do tych grup (co, kiedy i kto komunikuje)?",
    "Czy zaplanowano konkretne szkolenia lub wsparcie potrzebne do pracy w nowy sposób?",
    "Czy sprawdzono, u kogo można się spodziewać oporu wobec zmiany i co z tym zrobić?",
    "Czy zaplanowano działania, które utrzymają nowy sposób pracy po zakończeniu projektu (np. kontrola po 3-6 miesiącach)?",
  ],
};

// Szybka ocena (poziom 2) używa podzbioru 2 najbardziej rozstrzygających pytań na obszar z
// powyższego zestawu — ten sam tekst, żeby nie dublować treści do utrzymania w dwóch miejscach.
const QUICK_ASSESSMENT_QUESTION_INDEXES = {
  definicjaSukcesu: [0, 2],
  przywodztwo: [0, 1],
  zarzadzanieProjektem: [0, 2],
  zarzadzanieZmiana: [0, 2],
};

function emptyPctAnswers(){
  const o = {};
  PCT_AREAS.forEach(a => { o[a.key] = PCT_QUESTIONS[a.key].map(()=>null); });
  return o;
}
function emptyQuickAnswers(){
  const o = {};
  PCT_AREAS.forEach(a => { o[a.key] = QUICK_ASSESSMENT_QUESTION_INDEXES[a.key].map(()=>null); });
  return o;
}
// Wynik obszaru = suma odpowiedzi (1-5 każda), znormalizowana do skali 1-30 — tak samo dla pełnej
// oceny (6 pytań x maks. 5 = 30, współczynnik 1) jak i szybkiej (2 pytania x maks. 5 = 10,
// współczynnik 3). Dzięki temu obie oceny działają na wspólnej skali z tymi samymi progami
// (pctTone), tą samą logiką najsłabszego obszaru (computeWeakestPctAreas) i tym samym wykresem
// radarowym — bez przepisywania żadnego z nich. Wynik obszaru pojawia się dopiero, gdy WSZYSTKIE
// jego pytania mają odpowiedź (tak jak dawniej pole liczbowe było puste albo wypełnione w całości).
function pctAreaScore(answers, questionCount){
  if (!answers || answers.length !== questionCount) return null;
  if (answers.some(v => v == null || v === "")) return null;
  const raw = answers.reduce((a,b)=>a+Number(b), 0);
  return raw * (30 / (questionCount * 5));
}
function pctScores(row){
  const scores = {};
  PCT_AREAS.forEach(a => { scores[a.key] = pctAreaScore(row && row.answers && row.answers[a.key], PCT_QUESTIONS[a.key].length); });
  return scores;
}
function quickScores(answers){
  const scores = {};
  PCT_AREAS.forEach(a => { scores[a.key] = pctAreaScore(answers && answers[a.key], QUICK_ASSESSMENT_QUESTION_INDEXES[a.key].length); });
  return scores;
}

const STATUS_OPTIONS = ["Do zaplanowania","W realizacji","Do weryfikacji","Zablokowane","Zrealizowane"];

/* ---------- Styl eksportu Excel (paleta marki Grupa Merito) ---------- */
const XLS_NAVY = "FF141E50";
const XLS_BLUE = "FF006EFA";
const XLS_MUTED = "FF4A5278";
const XLS_LIGHT_FILL = "FFEAF1FE";
const XLS_LINE = "FFE2E5EE";

function xlsTitleRow(ws, values){
  const row = ws.addRow(values);
  row.height = 24;
  row.font = {name:"Inter", bold:true, size:14, color:{argb:XLS_NAVY}};
  row.eachCell(c => { c.fill = {type:"pattern", pattern:"solid", fgColor:{argb:XLS_LIGHT_FILL}}; });
  return row;
}
function xlsSectionRow(ws, values){
  const row = ws.addRow(values);
  row.font = {name:"Inter", bold:true, size:12, color:{argb:XLS_NAVY}};
  row.eachCell(c => { c.border = {bottom:{style:"medium", color:{argb:XLS_BLUE}}}; });
  return row;
}
function xlsHeaderRow(ws, values){
  const row = ws.addRow(values);
  row.font = {name:"Inter", bold:true, color:{argb:XLS_NAVY}};
  row.eachCell(c => {
    c.fill = {type:"pattern", pattern:"solid", fgColor:{argb:XLS_LIGHT_FILL}};
    c.border = {bottom:{style:"thin", color:{argb:XLS_LINE}}};
  });
  return row;
}
function xlsDataRow(ws, values, accentCols){
  const row = ws.addRow(values);
  row.font = {name:"Inter", color:{argb:XLS_NAVY}};
  row.eachCell((c, colNumber) => {
    c.border = {bottom:{style:"thin", color:{argb:XLS_LINE}}};
    if (accentCols && accentCols.includes(colNumber)) c.font = {name:"Inter", bold:true, color:{argb:XLS_BLUE}};
  });
  return row;
}
function xlsLabelRow(ws, label, value, accent){
  const row = ws.addRow([label, value]);
  row.getCell(1).font = {name:"Inter", bold:true, color:{argb:XLS_NAVY}};
  row.getCell(2).font = accent ? {name:"Inter", bold:true, color:{argb:XLS_BLUE}} : {name:"Inter", color:{argb:XLS_MUTED}};
  return row;
}

// Czyta z powrotem listę wierszy zapisaną przez xlsSectionRow+xlsHeaderRow+xlsDataRow: znajduje
// wiersz-tytuł sekcji (dokładne dopasowanie pierwszej komórki), pomija wiersz nagłówka kolumn
// tuż pod nim, i zbiera kolejne wiersze aż do pierwszego pustego (separator sekcji) albo końca
// arkusza. `mapper` dostaje surowy wiersz (tablicę komórek) i zwraca obiekt do stanu aplikacji.
function xlsReadSection(rows, title, mapper){
  const idx = rows.findIndex(r => (r[0]||"").toString().trim() === title);
  if (idx === -1) return [];
  const items = [];
  for (let i = idx + 2; i < rows.length; i++){
    const r = rows[i];
    if (!r[0] && !r[1]) break;
    items.push(mapper(r));
  }
  return items;
}

// Zwraca stan "nieukończona" dopóki nie odpowiedziano na wszystkie pytania — inaczej narzędzie
// pokazywałoby poziom ryzyka wyliczony z pustych/domyślnych odpowiedzi, czyli fałszywy wynik
// zanim ktokolwiek cokolwiek wypełnił.
function surveyLevel(total, answeredCount){
  if (answeredCount < SURVEY_QUESTION_COUNT){
    return {poziom:null, label:"Ankieta nieukończona", risk:"", color:"gray", complete:false};
  }
  if (total <= 25) return {poziom:1, label:"Mała zmiana", risk:"Niskie ryzyko", color:"green", complete:true};
  if (total <= 45) return {poziom:2, label:"Średnia zmiana", risk:"Średnie ryzyko", color:"orange", complete:true};
  return {poziom:3, label:"Duża zmiana", risk:"Wysokie ryzyko", color:"red", complete:true};
}

function pctTone(v){
  if (v == null || v === "") return "gray";
  if (v < 20) return "red";
  if (v < 25) return "orange";
  return "green";
}

// Zapis/odczyt odpowiedzi Likerta do jednej komórki Excela jako lista po przecinku ("4,5,,2,3,1")
// — pusta pozycja (nieodpowiedziane pytanie) zostaje pusta, nie znika, żeby indeksy pytań się nie
// przesunęły przy odczycie.
function serializeAnswers(arr){
  return (arr||[]).map(v => v==null ? "" : v).join(",");
}
function deserializeAnswers(str, length){
  const parts = (str==null ? "" : String(str)).split(",");
  return Array.from({length}, (_,i) => {
    const v = parts[i];
    return (v===undefined || v==="") ? null : Number(v);
  });
}

// Domyślne/starsze dane (localStorage sprzed v1.7, częściowy import Excela) mogą nie mieć
// tablicy `answers` wcale albo mieć złą liczbę pytań (np. po zmianie zestawu pytań w kodzie) —
// dopełniamy brakujące odpowiedzi do null-i zamiast dać się wysypać dalszym obliczeniom.
function sanitizePctAnswers(raw){
  const out = {};
  PCT_AREAS.forEach(a => {
    const n = PCT_QUESTIONS[a.key].length;
    const src = raw && Array.isArray(raw[a.key]) ? raw[a.key] : [];
    out[a.key] = Array.from({length:n}, (_,i) => src[i] ?? null);
  });
  return out;
}
function sanitizeQuickAnswers(raw){
  const out = {};
  PCT_AREAS.forEach(a => {
    const n = QUICK_ASSESSMENT_QUESTION_INDEXES[a.key].length;
    const src = raw && Array.isArray(raw[a.key]) ? raw[a.key] : [];
    out[a.key] = Array.from({length:n}, (_,i) => src[i] ?? null);
  });
  return out;
}

function sanitizeProjectState(data){
  const base = newProjectState();
  if (!data || typeof data !== "object") return base;
  const project = (data.project && typeof data.project === "object") ? {...base.project, ...data.project} : base.project;
  const surveyAnswers = (data.surveyAnswers && typeof data.surveyAnswers === "object") ? {...base.surveyAnswers, ...data.surveyAnswers} : base.surveyAnswers;
  const pctHistoryRaw = Array.isArray(data.pctHistory) && data.pctHistory.length ? data.pctHistory : base.pctHistory;
  const pctHistory = pctHistoryRaw.map(p => ({...p, answers: sanitizePctAnswers(p.answers)}));
  const quickAssessment = sanitizeQuickAnswers(data.quickAssessment);
  const groups = Array.isArray(data.groups) ? data.groups : base.groups;
  const adkarByCategory = (data.adkarByCategory && typeof data.adkarByCategory === "object")
    ? {...base.adkarByCategory, ...data.adkarByCategory} : base.adkarByCategory;
  const actions = Array.isArray(data.actions) ? data.actions : base.actions;
  const checklist12 = (data.checklist12 && typeof data.checklist12 === "object") ? data.checklist12 : base.checklist12;
  const milestones = Array.isArray(data.milestones) ? data.milestones : base.milestones;
  const teamMembers = Array.isArray(data.teamMembers) ? data.teamMembers : base.teamMembers;
  const risks = Array.isArray(data.risks) ? data.risks : base.risks;
  const deliverables = Array.isArray(data.deliverables) ? data.deliverables : base.deliverables;
  const budgetItems = Array.isArray(data.budgetItems) ? data.budgetItems : base.budgetItems;
  const links = Array.isArray(data.links) ? data.links : base.links;
  const maintenanceCosts = Array.isArray(data.maintenanceCosts) ? data.maintenanceCosts : base.maintenanceCosts;
  return {
    ...base, ...data,
    project, surveyAnswers, pctHistory, quickAssessment, groups, adkarByCategory, actions, checklist12, milestones, teamMembers, risks,
    deliverables, budgetItems, links, maintenanceCosts,
  };
}

// Etykieta i wartość mogą siedzieć w tej samej komórce/wierszu ("Lp | ETYKIETA | wartość")
// albo etykieta zajmuje cały wiersz, a wartość jest w kolejnym (tak jest np. przy "CEL
// PROJEKTU" czy "POWODY PODJĘCIA PROJEKTU", gdzie odpowiedź to osobny akapit/lista).
// Szablony kart (uczelniana / grupowa-projektowa / programowa) różnią się nazewnictwem etykiet
// ("MENADŻER PROJEKTU" vs "MENADŻER PROGRAMU", "ZWIĄZEK" vs "POWIĄZANIE ZE STRATEGIĄ" itd.) —
// każdy matcher musi łapać wszystkie warianty, nie tylko ten z jednego przykładowego dokumentu.
const KARTA_FIELD_MATCHERS = [
  ["nazwa", /^NAZWA (PROJEKTU|PROGRAMU)/i],
  ["nick", /^NICK\/?\s*SYMBOL/i],
  ["sponsor", /^SPONSOR/i],
  ["pm", /^MENADŻER (PROJEKTU|PROGRAMU)/i],
  ["typProjektu", /^TYP (PROJEKTU|PROGRAMU)/i],
  ["filie", /^(FILIE OBJĘTE PROJEKTEM|PODMIOTY OBJĘTE (PROGRAMEM|PROJEKTEM))/i],
  ["zwiazekZeStrategia", /^(ZWIĄZEK|POWIĄZANIE) ZE STRATEGI/i],
  ["okresRealizacji", /^(OKRES|TERMIN) REALIZACJI/i],
  ["powodyProjektu", /^(POWODY PODJĘCIA (PROJEKTU|PROGRAMU)|PROBLEMY\s*\/?\s*SZANSE DO ROZWIĄZANIA)/i],
  ["celProjektu", /^CEL (PROJEKTU|PROGRAMU)/i],
  ["budzetRazem", /^RAZEM/i],
  ["wylaczenia", /^WYŁĄCZENIA/i],
  ["zrodloFinansowania", /^ŹRÓDŁO FINANSOWANIA/i],
];

// textContent samych <td> zlewa akapity/pozycje listy w jeden ciąg bez odstępu — dodajemy
// spację między blokami (<p>, <li>), żeby np. wielopunktowe "Powody podjęcia projektu" dało
// się w ogóle przeczytać.
function cellText(node){
  const blocks = node.querySelectorAll("p, li");
  const text = blocks.length
    ? Array.from(blocks).map(b => (b.textContent||"").trim()).filter(Boolean).join(" ")
    : (node.textContent || "");
  return text.replace(/\s+/g, " ").trim();
}

// Autorzy szablonów zostawiają "puste" pola z placeholderem zamiast pustego akapitu — traktujemy
// same kropki/myślniki i "n/d"/"brak" jak brak treści, żeby taki placeholder nie wylądował
// w danych projektu (zgłoszony błąd: "Powody projektu" wchodziło jako samo "…").
function isBlankish(text){
  const t = (text || "").trim();
  if (!t) return true;
  if (/^[.…\-–—_]+$/.test(t)) return true;
  if (/^(n\/?d\.?|brak)$/i.test(t)) return true;
  return false;
}
// Numer porządkowy wiersza karty (Lp) w komórce obok etykiety — nie jest nigdy prawdziwą
// wartością pola, tylko "17", "10" itp.
function isLpLike(text){
  return /^\d{1,3}$/.test((text||"").trim());
}
function isDateLike(text){
  const t = (text||"").trim();
  return /^\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}$/.test(t) || /^(Q[1-4]\s*)?20\d{2}$/i.test(t);
}
// Asercje (nie uruchamiane automatycznie — pilnują założeń przy kolejnych zmianach):
//   parseAmount("200 000")      === 200000
//   parseAmount("1 200 000")    === 1200000
//   parseAmount("120 000,50")   === 120000.5
//   parseAmount("200.000")      === 200000   (kropka tysięcy, nie ułamek)
//   parseAmount("1.200.000")    === 1200000
//   parseAmount("120,5")        === 120.5
function parseAmount(text){
  if (!text) return null;
  let cleaned = String(text).replace(/zł/gi, "").replace(/[^\d,.\s]/g, "").trim().replace(/\s+/g, "");
  if (!cleaned) return null;
  // Kropka po której następują dokładnie trzy cyfry (powtórzone grupowo, np. "1.200.000") to
  // separator tysięcy, nie przecinek dziesiętny — ale TYLKO gdy w liczbie nie ma też przecinka
  // (przecinek jednoznacznie wskazuje część ułamkową, więc kropka obok niego zawsze jest tysięcy).
  // Bez tego rozróżnienia "200.000" parsowało się na 200 zamiast 200000 — błąd cichy, bo suma
  // wychodziła 1000 razy za mała i nic tego nie sygnalizowało.
  if (!cleaned.includes(",") && /^\d{1,3}(\.\d{3})+$/.test(cleaned)){
    cleaned = cleaned.replace(/\./g, "");
  }
  const n = parseFloat(cleaned.replace(",", "."));
  return isNaN(n) ? null : n;
}
function formatAmount(n){
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

// Trzy warianty karty (uczelniana / projektu grupowego / programu) różnią się nie tylko
// nazewnictwem pól, ale i tym, KTÓRE pola w ogóle istnieją (np. karta programu nie ma
// Nick/symbolu ani tabeli zespołu, karta uczelniana nie ma Źródła finansowania — ma za to MPK).
// Rozpoznajemy typ po charakterystycznych, unikalnych dla danego wzoru etykietach, żeby UI
// mogło pokazywać "brak w tym szablonie" zamiast sugerować, że import czegoś nie wyłapał.
function detectKartaType(tables){
  // Sprawdzamy POJEDYNCZE komórki, nie cały wiersz — w wierszu z numerem porządkowym Lp
  // ("1 | NAZWA PROJEKTU* | Wdrożenie...") tekst całego wiersza zaczyna się od "1", więc
  // dopasowanie zakotwiczone znakiem ^ nigdy by się nie powiodło.
  const hasCell = re => tables.some(t => Array.from(t.rows).some(r =>
    Array.from(r.cells).some(c => re.test(cellText(c).replace(/\*/g, "").trim()))));
  if (hasCell(/^NAZWA PROGRAMU/i)) return "program";
  if (hasCell(/^MPK\b/i)) return "uczelnia";
  if (hasCell(/^NAZWA PROJEKTU/i)) return "projekt";
  return null;
}

function extractFields(tables){
  const fields = {};
  tables.forEach(table => {
    const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
    rows.forEach((cells, r) => {
      for (let i = 0; i < cells.length; i++){
        const label = cells[i].replace(/\*/g, "").trim();
        if (!label) continue;
        KARTA_FIELD_MATCHERS.forEach(([key, re]) => {
          if (fields[key] || !re.test(label)) return;
          // Wartość to komórka TUŻ OBOK etykiety (i+1), nie zawsze ostatnia w wierszu — niektóre
          // szablony mieszczą dwie pary etykieta-wartość w jednym wierszu (np. "Nick/symbol | ... |
          // Nazwa we Flexi | ..."), gdzie branie zawsze ostatniej komórki podstawiłoby cudzą wartość.
          // Sięgamy do kolejnego wiersza lub komórki PRZED etykietą TYLKO gdy etykieta nie ma
          // sąsiedniej komórki w ogóle (np. długi tekst opisowy pod nagłówkiem) — pusta-ale-istniejąca
          // komórka obok etykiety oznacza po prostu niewypełnione pole, nie powód szukać dalej.
          if (i < cells.length - 1){
            const value = cells[i + 1];
            if (value) fields[key] = value;
            return;
          }
          // Niektóre szablony scalają komórki tak, że WARTOŚĆ ląduje PRZED etykietą w tym samym
          // wierszu (np. "Wszystkie spółki korzystają... | CEL PROJEKTU*..."). Komórka po lewej
          // liczy się jako wartość tylko gdy nie jest numerem porządkowym (Lp) ani placeholderem.
          if (i > 0){
            const left = cells[i - 1];
            if (left && !isLpLike(left) && !isBlankish(left)){
              fields[key] = left;
              return;
            }
          }
          // W pozostałych przypadkach etykieta zajmuje własny wiersz, a treść jest w kolejnym —
          // bierzemy NAJDŁUŻSZĄ niepustą komórkę tego wiersza (nie zawsze ostatnią: część
          // szablonów dokleja placeholder typu "…" na końcu wiersza z prawdziwą treścią z przodu).
          const nextRow = rows[r + 1];
          if (nextRow && nextRow.length){
            const candidates = nextRow.filter(c => !isBlankish(c));
            const value = candidates.sort((a, b) => b.length - a.length)[0];
            if (value) fields[key] = value;
          }
        });
      }
    });
  });
  // "Główna korzyść biznesowa" siedzi w osobnej mini-tabeli z nagłówkiem zawierającym m.in.
  // "KORZYŚĆ BIZNESOWA", "KATEGORIA KORZYŚCI", "KIEDY WYSTĄPI?", "MIERNIK" — kolejność kolumn
  // różni się między wzorami, a pusta komórka "kategoria" w wierszu danych potrafi przesunąć
  // resztę wartości o jedną pozycję w lewo względem nagłówka. Zamiast liczyć na stałą pozycję
  // kolumny, klasyfikujemy komórki wiersza danych po TREŚCI: pierwsza data-podobna to termin,
  // pierwsza spośród pozostałych — korzyść, kolejna — miernik.
  tables.forEach(table => {
    const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
    const headerIdx = rows.findIndex(r => r.some(c => /^KORZYŚĆ BIZNESOWA/i.test(c.replace(/\*/g, "").trim())));
    if (headerIdx === -1 || fields.glownaKorzysc) return;
    const dataRow = rows[headerIdx + 1];
    if (!dataRow) return;
    const nonBlank = dataRow.filter(c => !isBlankish(c));
    if (!nonBlank.length) return;
    const dateIdx = nonBlank.findIndex(isDateLike);
    const kiedy = dateIdx !== -1 ? nonBlank[dateIdx] : "";
    const rest = nonBlank.filter((c, i) => i !== dateIdx);
    if (rest[0]){
      fields.glownaKorzysc = rest[0];
      if (kiedy) fields.korzyscTermin = kiedy;
      if (rest[1]) fields.korzyscMiernik = rest[1];
    }
  });
  return fields;
}

// "GRUPY OBJĘTE ZMIANĄ" (szablony 2026) zastąpiło "INTERESARIUSZE PROJEKTU" (starszy wzór) —
// dopasowujemy oba. Liczba kolumn różni się między wzorami (karta programu ma tylko 2: grupa +
// opis zmiany, bez trzeciej kolumny "jak przygotujemy") i tabela bywa zaśmiecona dodatkowymi
// wierszami o skali zmiany ("OCENA SKALI ZMIANY...", "LICZBA PUNKTÓW...") — odrzucamy je po treści.
function extractGroups(tables){
  const groups = [];
  const stakeholderTable = tables.find(t => /GRUPY OBJ[EĘ]TE ZMIAN|INTERESARIUSZE PROJEKTU/i.test(cellText(t.rows[0])));
  if (!stakeholderTable) return groups;
  Array.from(stakeholderTable.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 2) return;
    const grupa = cells[0];
    if (!grupa || grupa.length > 140) return;
    if (/^\d+$/.test(grupa.trim())) return; // wiersz tytułowy sekcji ("Lp | TYTUŁ"), nie dana
    if (/^(grupa( interesariuszy)?|kto\?)$/i.test(grupa)) return;
    if (/INTERESARIUSZE PROJEKTU|GRUPY OBJ[EĘ]TE ZMIAN|OCENA SKALI ZMIANY|LICZBA PUNKTÓW|KONIECZNOŚĆ PRZYGOTOWANIA|TERMIN PRZYGOTOWANIA/i.test(grupa)) return;
    groups.push({nazwa: grupa, wplyw: cells.slice(1).filter(Boolean).join(" — ")});
  });
  return groups;
}

// Kamienie milowe występują w dwóch formach zależnie od szablonu:
// A) dedykowana tabela "KLUCZOWE KAMIENIE MILOWE (PROJEKTU|PROGRAMU)" — KAŻDY numerowany
//    wiersz to kamień milowy (Lp | Nazwa | Termin);
// B) harmonogram/etapy ("ETAPY REALIZACJI", "RAMOWY PLAN REALIZACJI", "PLANOWANE DZIAŁANIA I
//    KAMIENIE MILOWE"), gdzie tylko NIEKTÓRE wiersze są kamieniami, oznaczone prefiksem
//    "Kamień milowy:" (starszy wzór) albo skrótem "KM:" (wzór 2026) na początku opisu.
// Kolumny etapu/terminu mają w Wordzie rowspan na wiele wierszy, więc liczba komórek bywa różna —
// termin to pierwsza NIEPUSTA komórka po tej z nazwą, nie zawsze ostatnia w wierszu.
function extractMilestones(tables){
  const milestones = [];
  const dedicatedTable = tables.find(t => Array.from(t.rows).some(r => /NAZWA KAMIENIA/i.test(cellText(r))));
  if (dedicatedTable){
    // Tytuł sekcji ("Lp | NAZWA SEKCJI") ma w pierwszej komórce numer karty (np. "17"), nie do
    // odróżnienia od Lp kamienia milowego samą tylko cyfrą — dlatego zaczynamy DOPIERO za
    // wierszem nagłówka kolumn ("L.p. | NAZWA KAMIENIA | TERMIN..."), a nie od początku tabeli.
    const rows = Array.from(dedicatedTable.rows).map(r => Array.from(r.cells).map(cellText));
    const headerIdx = rows.findIndex(r => r.some(c => /NAZWA KAMIENIA/i.test(c)));
    if (headerIdx !== -1){
      for (let i = headerIdx + 1; i < rows.length; i++){
        const cells = rows[i];
        if (cells.length < 2 || !/^\d+$/.test((cells[0]||"").trim())) continue;
        if (cells[1]) milestones.push({nazwa: cells[1], termin: cells[2] || ""});
      }
    }
  }
  const scheduleTable = tables.find(t => /ETAPY REALIZACJI|RAMOWY PLAN REALIZACJI|PLANOWANE DZIAŁANIA I KAMIENIE MILOWE/i.test(cellText(t.rows[0])));
  if (scheduleTable){
    Array.from(scheduleTable.rows).forEach(row => {
      const cells = Array.from(row.cells).map(cellText);
      const idx = cells.findIndex(c => /^(Kamień milowy|KM)\s*[:\s]/i.test(c));
      if (idx === -1) return;
      const nazwa = cells[idx].replace(/^(Kamień milowy|KM)\s*:?\s*/i, "").trim();
      const termin = cells.slice(idx + 1).find(c => c && c.trim()) || "";
      if (nazwa) milestones.push({nazwa, termin});
    });
  }
  return milestones;
}

// "OSOBY ZAANGAŻOWANE W PROJEKT..." (wzór 2026) zastąpiło "SKŁAD ZESPOŁU PROJEKTOWEGO..."
// (starszy wzór) i ma o kolumnę mniej (bez "szacowane zaangażowanie") — akceptujemy 3 lub 4 komórki.
function extractTeam(tables){
  const team = [];
  const table = tables.find(t => /SKŁAD ZESPOŁU PROJEKTOWEGO|OSOBY ZAANGAŻOWANE W (PROJEKT|PROGRAM)/i.test(cellText(t.rows[0])));
  if (!table) return team;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 3) return;
    const [imie, dzial, rola, zaangazowanie] = cells;
    if (!imie || /^imi. i nazwisko$/i.test(imie)) return;
    team.push({imie, dzial, rola, zaangazowanie: zaangazowanie || ""});
  });
  return team;
}

// "NAJWAŻNIEJSZE RYZYKA PROJEKTU" (uczelnie/projekty, wzór 2026) i "KLUCZOWE RYZYKA PROGRAMOWE"
// (programy) obok starszego "KLUCZOWE RYZYKA PROJEKTU".
function extractRisks(tables){
  const risks = [];
  const table = tables.find(t => /(NAJWAŻNIEJSZE|KLUCZOWE) RYZYKA/i.test(cellText(t.rows[0])));
  if (!table) return risks;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 3) return;
    const [, ryzyko, zarzadzanie] = cells;
    if (!ryzyko || /^ryzyko\b/i.test(ryzyko.trim())) return;
    risks.push({ryzyko, zarzadzanie});
  });
  return risks;
}

// "Sporadyczne zaangażowanie" ma dokładnie ten sam układ kolumn co "Skład zespołu"
// (imię | dział | zadania/rola | termin/zaangażowanie), więc to też są ludzie do podpowiedzi
// w polu "Odpowiedzialny" — dokładamy ich do tej samej listy zespołu.
function extractSporadicTeam(tables){
  const team = [];
  const table = tables.find(t => /SPORADYCZNE ZAANGAŻOWANIE DO PROJEKTU/i.test(cellText(t.rows[0])));
  if (!table) return team;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 3) return;
    const [imie, dzial, rola, zaangazowanie] = cells;
    if (!imie || /^imi. i nazwisko$/i.test(imie)) return;
    team.push({imie, dzial, rola, zaangazowanie: zaangazowanie || ""});
  });
  return team;
}

// Produkty/komponenty: kolumny i ich KOLEJNOŚĆ różnią się między wzorami (stary ma "wartość
// liczbową", nowy jej nie ma i zamienia kolejność terminu/odbiorcy; karta programu w ogóle nie ma
// "produktów", tylko "komponenty programu" z inną nazwą kolumny). Zamiast zakładać stałą pozycję,
// znajdujemy nagłówek (wiersz z komórką "L.p.") i mapujemy kolumny po treści etykiety.
function extractDeliverables(tables){
  const items = [];
  const table = tables.find(t => Array.from(t.rows).some(r =>
    /WYPRACOWANE\s+w\s+ramach\s+projektu\s+PRODUKTY|PLANOWANE\s+PRODUKT|PLANOWANE\s+KOMPONENTY/i.test(cellText(r))));
  if (!table) return items;
  const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
  const headerIdx = rows.findIndex(r => r.some(c => /^L\.?\s?P\.?$/i.test(c.trim())));
  if (headerIdx === -1) return items;
  const header = rows[headerIdx];
  const findCol = re => header.findIndex(c => re.test(c));
  const produktCol = findCol(/PRODUKT|KOMPONENT/i);
  const terminCol = findCol(/TERMIN|DATA DOSTARCZENIA|OKRES REALIZACJI/i);
  const odbiorcaCol = findCol(/ODBIERAJ|ODBIORC|GRONO/i);
  const wartoscCol = findCol(/WARTOŚĆ|LICZBOW|RODZAJ/i);
  for (let r = headerIdx + 1; r < rows.length; r++){
    const cells = rows[r];
    if (!/^\d+$/.test((cells[0] || "").trim())) continue;
    const produkt = produktCol >= 0 ? cells[produktCol] : cells[1];
    if (!produkt) continue;
    items.push({
      produkt,
      wartosc: wartoscCol >= 0 ? (cells[wartoscCol] || "") : "",
      termin: terminCol >= 0 ? (cells[terminCol] || "") : "",
      odbiorca: odbiorcaCol >= 0 ? (cells[odbiorcaCol] || "") : "",
    });
  }
  return items;
}

// Pozycje budżetowe: liczba i kolejność kolumn różni się (czasem jest Lp, czasem nie; czasem
// dochodzi "kwota dofinansowania zewnętrznego"). Zamiast zakładać pozycję, rozpoznajemy komórki
// po TREŚCI w danym wierszu: kwota to komórka złożona głównie z cyfr, pozycja to najdłuższy
// pozostały tekst — działa niezależnie od tego, która to kolumna po kolei.
function extractBudgetItems(tables){
  const items = [];
  const table = tables.find(t => /BUDŻET (PROJEKTU|PROGRAMU)/i.test(cellText(t.rows[0])) && !/SZACUNKOWE/i.test(cellText(t.rows[0])));
  if (!table) return items;
  const isAmount = c => /\d/.test(c) && /^[\d\s.,?]+$/.test(c.trim());
  const isExcludedLabel = c => /^(RAZEM|ŹRÓDŁO FINANSOWANIA|WAŻNE ZAŁOŻENIA|MPK|ZLECENIE|POZYCJA KOSZTOWA|KWOTA)/i.test(c.trim());
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText).filter(Boolean);
    // Etykiety typu "Źródło finansowania" / nagłówek kolumn mogą wylądować w KTÓREJKOLWIEK
    // komórce (nie tylko tej wybranej jako "pozycja" wg długości tekstu) — trzeba sprawdzić cały
    // wiersz, inaczej taki wiersz-etykieta (np. "ŹRÓDŁO FINANSOWANIA* | Budżet centralny IT")
    // zostanie błędnie potraktowany jak pozycja kosztowa.
    if (cells.some(isExcludedLabel)) return;
    const nonLp = cells.filter(c => !/^\d{1,3}$/.test(c.trim()));
    if (nonLp.length < 2) return;
    const amountCell = nonLp.find(isAmount);
    const textCells = nonLp.filter(c => c !== amountCell);
    const pozycja = textCells.sort((a, b) => b.length - a.length)[0];
    if (!pozycja) return;
    items.push({pozycja, kwota: amountCell || ""});
  });
  return items;
}

function extractLinks(tables){
  const links = [];
  const table = tables.find(t => /POWIĄZANIA.*PUNKTY STYKU (PROJEKTU|PROGRAMU)/i.test(cellText(t.rows[0])));
  if (!table) return links;
  Array.from(table.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 2) return;
    const [projekt, zaleznosc, wspolpraca] = cells;
    if (!projekt) return;
    if (/^\d+$/.test(projekt.trim())) return; // wiersz tytułowy sekcji ("Lp | TYTUŁ"), nie dana
    if (/^projekt\/? ?portfel/i.test(projekt)) return;
    links.push({projekt, zaleznosc: zaleznosc || "", wspolpraca: wspolpraca || ""});
  });
  return links;
}

function extractMaintenanceCosts(tables){
  const items = [];
  const table = tables.find(t => /SZACUNKOWE KOSZTY UTRZYMANIA/i.test(cellText(t.rows[0])));
  if (!table) return items;
  const rows = Array.from(table.rows).map(r => Array.from(r.cells).map(cellText));
  const headerIdx = rows.findIndex(r => r.some(c => /^ROK/i.test(c)) && r.some(c => /KATEGORI/i.test(c)));
  if (headerIdx === -1) return items;
  const rokFirst = /^ROK/i.test(rows[headerIdx][0] || "");
  if (rokFirst) {
    // wariant: wiersz = rok, kolumny ROK | kategorie | kwota (np. karta uczelniana)
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const cells = rows[i];
      if (cells.length < 3) break;
      const [rok, kategorie, kwota] = cells;
      if (!rok || /^sum/i.test(rok)) break;
      items.push({rok, kategorie, kwota: kwota || ""});
    }
  } else {
    // wariant: wiersz = kategoria kosztu, kolumny = lata; etykiety lat w kolejnym wierszu
    const years = (rows[headerIdx + 1] || []).filter(c => c && c.trim());
    for (let i = headerIdx + 2; i < rows.length; i++) {
      const cells = rows[i];
      if (cells.length < 2 || !/^\d+$/.test((cells[0] || "").trim())) break;
      const rest = cells.slice(1);
      const kategorie = rest.find(c => c && c.trim() && !/^[\d\s.,]+$/.test(c.trim())) || "";
      const amounts = rest.filter(c => c && c.trim() && /^[\d\s.,]+$/.test(c.trim()));
      if (!kategorie && !amounts.length) continue;
      items.push({rok: years.join(" / "), kategorie, kwota: amounts.join(", ")});
    }
  }
  return items;
}

// Karta projektu Grupy Merito ma stałą, numerowaną strukturę tabel. Parser dopasowuje pola po
// treści etykiety (nie po sztywnej pozycji kolumny/wiersza), ale zakłada te same nagłówki sekcji
// co w referencyjnym szablonie — inny układ karty może nic nie znaleźć (stąd podgląd przed
// zastosowaniem, a nie ciche nadpisanie danych).
function parseKartaHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tables = Array.from(doc.querySelectorAll("table"));
  const team = [...extractTeam(tables), ...extractSporadicTeam(tables)];
  return {
    kartaType: detectKartaType(tables),
    fields: extractFields(tables),
    groups: extractGroups(tables),
    milestones: extractMilestones(tables),
    team,
    risks: extractRisks(tables),
    deliverables: extractDeliverables(tables),
    budgetItems: extractBudgetItems(tables),
    links: extractLinks(tables),
    maintenanceCosts: extractMaintenanceCosts(tables),
  };
}

/* ---------- localStorage ---------- */

const LS_KEY = "pzz_merito_versions_v1";

function loadVersions(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ return []; }
}
function saveVersions(list){
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function storageIsAvailable(){
  try {
    const t = "__pzz_test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return true;
  } catch(e){ return false; }
}

/* ---------- Drobne komponenty ---------- */

function Badge({tone, children}){
  return <span className={"badge " + tone}>{children}</span>;
}

function Likert({value, onChange, max=5}){
  return (
    <div style={{display:"flex", gap:6}}>
      {Array.from({length:max}, (_,i)=>i+1).map(n => (
        <button key={n} type="button" className="small"
          onClick={()=>onChange(n)}
          style={{
            width:30, height:30, padding:0, fontWeight:700,
            background: value===n ? "var(--accent)" : "#fff",
            color: value===n ? "#fff" : "var(--ink)",
            borderColor: value===n ? "var(--accent)" : "var(--line)",
          }}>{n}</button>
      ))}
    </div>
  );
}

function Field({label, hint, children}){
  return (
    <div className="field">
      <label>{label}</label>
      {children}
      {hint ? <p className="hint" style={{margin:"4px 0 0"}}>{hint}</p> : null}
    </div>
  );
}

function Bar({label, value, max=5, tone}){
  const pct = value==null ? 0 : Math.max(0, Math.min(100, (value/max)*100));
  const color = tone || (value==null ? "#cfd5d9" : value<=2 ? "var(--red)" : value===3 ? "var(--orange)" : "var(--green)");
  return (
    <div className="bar-row">
      <div className="label">{label}</div>
      <div className="bar-track"><div className="bar-fill" style={{width:pct+"%", background:color}}/></div>
      <div className="bar-val">{value==null?"–":value}</div>
    </div>
  );
}

/* ---------- Aplikacja ---------- */

function App(){
  const [state, setState] = useState(newProjectState);
  const [tab, setTab] = useState("dane");
  const [versions, setVersions] = useState(loadVersions);
  const [storageOk] = useState(storageIsAvailable);
  const [showVersions, setShowVersions] = useState(false);
  const [toast, setToast] = useState(null);
  const [kartaImport, setKartaImport] = useState(null);
  const excelInputRef = useRef(null);
  const kartaInputRef = useRef(null);
  const versionsDialogRef = useRef(null);

  useEffect(()=>{
    const d = versionsDialogRef.current;
    if (!d) return;
    if (showVersions && !d.open) d.showModal();
    if (!showVersions && d.open) d.close();
  }, [showVersions]);

  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(null), 2600);
    return ()=>clearTimeout(t);
  }, [toast]);

  const {surveyTotal, surveyAnsweredCount} = useMemo(()=>{
    let sum = 0, answered = 0;
    const allIds = [...SURVEY.partI.map(q=>q.id), ...SURVEY.partII_items.map(it=>it.id), SURVEY.partII_extra.id, ...SURVEY.partIII.map(q=>q.id)];
    allIds.forEach(id => {
      const v = state.surveyAnswers[id];
      if (v !== null && v !== undefined && v !== ""){ sum += Number(v); answered += 1; }
    });
    return {surveyTotal: sum, surveyAnsweredCount: answered};
  }, [state.surveyAnswers]);
  const level = surveyLevel(surveyTotal, surveyAnsweredCount);

  // Ostatni WYPEŁNIONY pomiar, nie ostatni wiersz tabeli — dodanie pustego "kolejnego pomiaru"
  // na przyszły przegląd nie może cofnąć pulpitu do "brak danych", skoro realny wynik już jest.
  // Wynik per obszar to teraz suma odpowiedzi na pytania (pctScores), nie ręcznie wpisana liczba —
  // computeWeakestPctAreas/pctTone dostają ten sam kształt danych {obszar: liczba|null} co dawniej,
  // więc ich logika progów i remisów zostaje bez zmian.
  const pctLatest = [...state.pctHistory].reverse().find(p => PCT_AREAS.some(a => pctScores(p)[a.key] != null)) || {};
  const pctLatestScores = pctScores(pctLatest);
  const pctNums = PCT_AREAS.map(a => pctLatestScores[a.key]).filter(v => v != null);
  const pctAvg = pctNums.length ? (pctNums.reduce((a,b)=>a+b,0)/pctNums.length) : null;
  const pctWeakestAreas = computeWeakestPctAreas(pctLatestScores);

  // Szybka ocena gotowości (poziom 2) — ta sama logika, znormalizowana do tej samej skali 1-30
  // (patrz pctAreaScore), więc computeWeakestPctAreas/pctTone/wykres radarowy działają identycznie.
  const quickScoresObj = useMemo(()=>quickScores(state.quickAssessment), [state.quickAssessment]);
  const quickNums = PCT_AREAS.map(a => quickScoresObj[a.key]).filter(v => v != null);
  const quickAvg = quickNums.length ? (quickNums.reduce((a,b)=>a+b,0)/quickNums.length) : null;
  const quickWeakestAreas = computeWeakestPctAreas(quickScoresObj);

  // Pulpit/eksport pokazują JEDNĄ kartę "gotowości przedsięwzięcia", której źródło zależy od
  // poziomu zmiany — pełny PCT dla poziomu 3, szybka ocena dla poziomu 2 — bez nazywania szybkiej
  // oceny "PCT" w interfejsie (zespół prosił o mniej żargonu).
  const readinessAvg = level.poziom === 3 ? pctAvg : (level.poziom === 2 ? quickAvg : null);
  const readinessWeakestAreas = level.poziom === 3 ? pctWeakestAreas : (level.poziom === 2 ? quickWeakestAreas : []);
  const readinessLabel = level.poziom === 3 ? "PCT" : "Szybka ocena";

  // Budżet razem: karty rzadko mają wypełniony wiersz "RAZEM" mimo poprawnie zaimportowanych
  // pozycji budżetowych — zamiast prosić o ręczne przepisanie sumy, liczymy ją sami z pozycji.
  // Wartość z karty (jeśli podana) i tak nadpisuje to pole przy imporcie, więc tu liczy się
  // tylko jako wartość domyślna/obliczona.
  const budzetRazemComputed = useMemo(()=>{
    const nums = state.budgetItems.map(b => parseAmount(b.kwota)).filter(n => n != null);
    return nums.length ? formatAmount(nums.reduce((a,b)=>a+b,0)) : null;
  }, [state.budgetItems]);

  const adkarRollup = useMemo(()=>{
    const activeCats = CATEGORIES.concat(state.usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
    return ADKAR_DIMS.map(dim => {
      const vals = activeCats
        .map(c => state.adkarByCategory[c.id]?.[dim.id])
        .filter(v => v !== null && v !== undefined && v !== "")
        .map(Number);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      const min = vals.length ? Math.min(...vals) : null;
      const atRisk = activeCats.filter(c => {
        const v = state.adkarByCategory[c.id]?.[dim.id];
        return v !== null && v !== undefined && v !== "" && Number(v) <= 2;
      }).map(c => c.label);
      return {...dim, avg, min, atRiskCount: atRisk.length, atRisk, suggestion: ADKAR_SUGGESTIONS[dim.id]};
    });
  }, [state.adkarByCategory, state.usesOptionalCategory]);

  // Zwraca WSZYSTKIE wymiary ADKAR związane najniższą oceną w danej kategorii, nie tylko pierwszy
  // znaleziony — przy remisie (np. Knowledge i Reinforcement oba na 2) oba są barierą do zaadresowania,
  // nie tylko jeden (zgłoszony błąd: przy dwóch tak samo ocenionych obszarach tool pokazywał jeden).
  function categoryBarrier(catId){
    const d = state.adkarByCategory[catId];
    if (!d) return [];
    let worstVal = Infinity;
    ADKAR_DIMS.forEach(dim => {
      const v = d[dim.id];
      if (v !== null && v !== undefined && v !== "" && Number(v) < worstVal) worstVal = Number(v);
    });
    if (worstVal === Infinity) return [];
    return ADKAR_DIMS.filter(dim => {
      const v = d[dim.id];
      return v !== null && v !== undefined && v !== "" && Number(v) === worstVal;
    });
  }

  const actionsByCategory = useMemo(()=>{
    const m = {};
    ALL_CATEGORIES.forEach(c => m[c.id] = state.actions.filter(a => a.categoryId === c.id));
    return m;
  }, [state.actions]);

  const statusCounts = useMemo(()=>{
    const m = {all: state.actions.length};
    STATUS_OPTIONS.forEach(s => m[s] = state.actions.filter(a=>a.status===s).length);
    m.dodaneDoHarmonogramu = state.actions.filter(a => a.dodanoDoHarmonogramu).length;
    return m;
  }, [state.actions]);

  const signals = useMemo(()=>({
    brakOdpowiedzialnego: state.actions.filter(a => !(a.odpowiedzialny||"").trim()).length,
    brakTerminu: state.actions.filter(a => !(a.termin||"").trim() && !(a.kamien||"").trim()).length,
    zablokowane: state.actions.filter(a => a.status === "Zablokowane").length,
  }), [state.actions]);

  /* -------- persistence -------- */

  function persistAsNewVersion(name){
    const entry = {id:cryptoId(), name: name || (state.project.nazwa || "Bez nazwy"), savedAt: new Date().toISOString(), data: state};
    const next = [entry, ...versions].slice(0, 50);
    setVersions(next);
    const ok = saveVersions(next);
    setToast(ok
      ? "Wersja zapisana: " + entry.name
      : "Uwaga: przeglądarka zablokowała zapis na dysku — wersja jest widoczna tylko do zamknięcia karty. Użyj „Zapisz plik”, żeby jej nie stracić.");
  }
  function loadVersion(entry){
    setState(sanitizeProjectState(entry.data));
    setShowVersions(false);
    setToast("Wczytano wersję: " + entry.name);
  }
  function deleteVersion(id){
    const next = versions.filter(v=>v.id!==id);
    setVersions(next);
    saveVersions(next);
  }
  const EMPTY_KARTA_IMPORT = {kartaType:null, fields:{}, groups:[], milestones:[], team:[], risks:[], deliverables:[], budgetItems:[], links:[], maintenanceCosts:[]};

  function handleKartaFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      mammoth.convertToHtml({arrayBuffer: reader.result})
        .then(result => {
          const parsed = parseKartaHtml(result.value);
          const found = Object.keys(parsed.fields).length + parsed.groups.length + parsed.milestones.length
            + parsed.team.length + parsed.risks.length + parsed.deliverables.length + parsed.budgetItems.length
            + parsed.links.length + parsed.maintenanceCosts.length;
          setKartaImport(found === 0
            ? {fileName: file.name, ...EMPTY_KARTA_IMPORT, failed:true}
            : {fileName: file.name, ...parsed, failed:false});
        })
        .catch(() => setKartaImport({fileName: file.name, ...EMPTY_KARTA_IMPORT, failed:true}));
    };
    reader.readAsArrayBuffer(file);
  }
  function applyKartaFields(){
    if (!kartaImport) return;
    const kartaType = kartaImport.kartaType || undefined;
    setState(s => ({...s, project: {...s.project, ...kartaImport.fields, ...(kartaType ? {kartaType} : {})}}));

    setKartaImport(ki => ki ? {...ki, fields: {}} : ki);

  // Wczytuje plik zapisany przyciskiem "Zapisz plik" (Excel, ale nazwane bez żargonu formatu w
  // UI — patrz przycisk) z powrotem do stanu aplikacji — to jedyny sposób zapisu/odczytu pliku
  // w tym narzędziu (uwaga zespołu: "muszę ściągnąć zawsze tego jasona... Excel też by mógł być"
  // — Excel jest znajomy, JSON nie, a samo słowo "eksport/format" jeszcze nikomu nic nie mówi).
  // Rozpoznaje TYLKO układ wygenerowany przez "Zapisz plik" (te same nazwy arkuszy i nagłówki
  // kolumn) — dowolny inny plik .xlsx zostanie odrzucony z komunikatem, zamiast zgadywać układ.
  function importExcel(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, {type:"array"});
        const sheet = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:""}) : null;
        const dane = sheet("Dane projektu");
        const ankieta = sheet("Ankieta");
        const diag = sheet("Diagnoza");
        const plan = sheet("Plan działań");
        if (!dane || !ankieta || !diag) throw new Error("missing sheets");

        const label = row => (row[0]||"").toString().trim();
        const findRow = (rows, prefix) => rows.find(r => label(r).startsWith(prefix));
        const val = (rows, prefix) => { const r = findRow(rows, prefix); return r ? (r[1] ?? "") : ""; };

        const project = {
          nazwa: val(dane,"Nazwa projektu"), sponsor: val(dane,"Sponsor"), pm: val(dane,"PM"),
          cm: val(dane,"CM"), typProjektu: val(dane,"Typ projektu"), okresRealizacji: val(dane,"Okres realizacji"),
          terminPrzygotowania: val(dane,"Termin przygotowania"), czestotliwosc: val(dane,"Częstotliwość"),
          nick: val(dane,"Nick/symbol"), filie: val(dane,"Filie objęte"), budzetRazem: val(dane,"Budżet razem"),
          zrodloFinansowania: val(dane,"Źródło finansowania"), zwiazekZeStrategia: val(dane,"Związek ze strategią"),
          powodyProjektu: val(dane,"Powody podjęcia"), celProjektu: val(dane,"Cel projektu"),
          glownaKorzysc: val(dane,"Główna korzyść"), korzyscTermin: val(dane,"Termin wystąpienia korzyści"),
          korzyscMiernik: val(dane,"Miernik korzyści"), wylaczenia: val(dane,"Wyłączenia"),
          kartaType: val(dane,"Typ karty"),
        };
        const usesOptionalCategory = val(dane, "Kategoria „Klienci").toString().trim().toUpperCase() === "TAK";

        const milestones = xlsReadSection(dane, "KAMIENIE MILOWE Z KARTY PROJEKTU", r => ({id:cryptoId(), nazwa:r[0]||"", termin:r[1]||""}));
        const teamMembers = xlsReadSection(dane, "SKŁAD ZESPOŁU Z KARTY PROJEKTU", r => ({id:cryptoId(), imie:r[0]||"", dzial:r[1]||"", rola:r[2]||"", zaangazowanie:r[3]||""}));
        const risks = xlsReadSection(dane, "KLUCZOWE RYZYKA Z KARTY PROJEKTU", r => ({id:cryptoId(), ryzyko:r[0]||"", zarzadzanie:r[1]||""}));
        const deliverables = xlsReadSection(dane, "WYPRACOWANE PRODUKTY Z KARTY PROJEKTU", r => ({id:cryptoId(), produkt:r[0]||"", wartosc:r[1]||"", termin:r[2]||"", odbiorca:r[3]||""}));
        const budgetItems = xlsReadSection(dane, "POZYCJE BUDŻETOWE Z KARTY PROJEKTU", r => ({id:cryptoId(), pozycja:r[0]||"", kwota:r[1]||""}));
        const links = xlsReadSection(dane, "POWIĄZANIA Z INNYMI PROJEKTAMI", r => ({id:cryptoId(), projekt:r[0]||"", zaleznosc:r[1]||"", wspolpraca:r[2]||""}));
        const maintenanceCosts = xlsReadSection(dane, "KOSZTY UTRZYMANIA PO PROJEKCIE", r => ({id:cryptoId(), rok:r[0]||"", kategorie:r[1]||"", kwota:r[2]||""}));
        const checklist12 = {};
        xlsReadSection(dane, "CHECKLISTA (POZIOM 1-2)", r => r).forEach(r => {
          if (r[0]) checklist12[r[0]] = (r[2]||"").toString().trim().toUpperCase() === "TAK";
        });

        const surveyAnswers = emptySurveyAnswers();
        ankieta.forEach(row => {
          const id = label(row);
          if (!id.startsWith("survey:")) return;
          const key = id.slice(7);
          const v = row[3];
          if (v !== "" && v != null && key in surveyAnswers) surveyAnswers[key] = Number(v);
        });

        const pctHeaderIdx = diag.findIndex(r => label(r) === "Data");
        const groupsHeaderIdx = diag.findIndex(r => label(r) === "Grupa");
        const adkarHeaderIdx = diag.findIndex(r => label(r) === "Kategoria");
        const pctHistory = [];
        if (pctHeaderIdx !== -1){
          for (let i = pctHeaderIdx+1; i < diag.length; i++){
            const r = diag[i];
            if (!label(r) && !r[1]) break;
            if (label(r).startsWith("Najsłabszy obszar")) break;
            pctHistory.push({
              id:cryptoId(), data:r[0]||"", punktKontrolny:r[1]||"", decyzja:r[7]||"", kolejnyPrzeglad:r[8]||"",
              answers: {
                definicjaSukcesu: deserializeAnswers(r[9], PCT_QUESTIONS.definicjaSukcesu.length),
                przywodztwo: deserializeAnswers(r[10], PCT_QUESTIONS.przywodztwo.length),
                zarzadzanieProjektem: deserializeAnswers(r[11], PCT_QUESTIONS.zarzadzanieProjektem.length),
                zarzadzanieZmiana: deserializeAnswers(r[12], PCT_QUESTIONS.zarzadzanieZmiana.length),
              },
            });
          }
        }
        const quickAssessment = emptyQuickAnswers();
        xlsReadSection(diag, "SZYBKA OCENA GOTOWOŚCI PRZEDSIĘWZIĘCIA (POZIOM 2)", r => r).forEach(r => {
          const area = PCT_AREAS.find(a => a.label === (r[0]||"").toString().trim());
          if (!area) return;
          quickAssessment[area.key] = deserializeAnswers(r[2], QUICK_ASSESSMENT_QUESTION_INDEXES[area.key].length);
        });
        const groups = [];
        if (groupsHeaderIdx !== -1){
          for (let i = groupsHeaderIdx+1; i < diag.length; i++){
            const r = diag[i];
            if (!label(r)) break;
            const cat = ALL_CATEGORIES.find(c => c.label === (r[2]||""));
            groups.push({id:cryptoId(), nazwa:r[0]||"", wplyw:r[1]||"", categoryId: cat ? cat.id : ""});
          }
        }
        const adkarByCategory = emptyAdkarByCategory();
        if (adkarHeaderIdx !== -1){
          for (let i = adkarHeaderIdx+1; i < diag.length; i++){
            const r = diag[i];
            if (!label(r)) break;
            const cat = ALL_CATEGORIES.find(c => c.label === label(r));
            if (!cat) continue;
            adkarByCategory[cat.id] = {
              awareness: r[1] ?? null, desire: r[2] ?? null, knowledge: r[3] ?? null,
              ability: r[4] ?? null, reinforcement: r[5] ?? null, wniosek: r[7] || "",
            };
          }
        }

        const actions = [];
        if (plan){
          for (let i = 1; i < plan.length; i++){
            const r = plan[i];
            if (!label(r) && !r[1]) continue;
            const cat = ALL_CATEGORIES.find(c => c.label === label(r));
            actions.push({
              id:cryptoId(), categoryId: cat ? cat.id : "", dzialanie:r[1]||"", kamien:r[2]||"", termin:r[3]||"",
              odpowiedzialny:r[4]||"", weryfikacja:r[5]||"", dodanoDoHarmonogramu: (r[6]||"").toString().trim().toUpperCase()==="TAK",
              status: STATUS_OPTIONS.includes(r[7]) ? r[7] : "Do zaplanowania",
            });
          }
        }

        setState(s => sanitizeProjectState({
          ...s, project: {...s.project, ...project}, surveyAnswers, pctHistory, quickAssessment, groups, adkarByCategory, actions,
          usesOptionalCategory, milestones, teamMembers, risks, deliverables, budgetItems, links, maintenanceCosts, checklist12,
        }));
        setToast("Wczytano plik: " + file.name);
      } catch(e){ alert("Nie udało się wczytać tego pliku — rozpoznawany jest tylko plik zapisany przyciskiem „Zapisz plik”."); }
    };
    reader.readAsArrayBuffer(file);
  }

  /* -------- drobne mutatory -------- */

  function setProjectField(key, value){
    setState(s => ({...s, project: {...s.project, [key]: value}}));
  }
  function setSurveyAnswer(id, value){
    setState(s => ({...s, surveyAnswers: {...s.surveyAnswers, [id]: value}}));
  }
  function setPct(idx, key, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], [key]: value};
      return {...s, pctHistory: hist};
    });
  }
  function setPctAnswer(idx, areaKey, qIndex, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      const row = hist[idx];
      const answers = {...row.answers, [areaKey]: row.answers[areaKey].map((v,i)=> i===qIndex ? value : v)};
      hist[idx] = {...row, answers};
      return {...s, pctHistory: hist};
    });
  }
  function addPctCheckpoint(){
    setState(s => ({...s, pctHistory: [...s.pctHistory, {id:cryptoId(), data:"", punktKontrolny:"", decyzja:"", kolejnyPrzeglad:"", answers: emptyPctAnswers()}]}));
  }
  function setQuickAnswer(areaKey, qIndex, value){
    setState(s => ({...s, quickAssessment: {...s.quickAssessment, [areaKey]: s.quickAssessment[areaKey].map((v,i)=> i===qIndex ? value : v)}}));
  }
  function addGroup(){
    setState(s => ({...s, groups: [...s.groups, {id:cryptoId(), nazwa:"", wplyw:"", categoryId: ""}]}));
  }
  function updateGroup(id, key, value){
    setState(s => ({...s, groups: s.groups.map(g => g.id===id ? {...g, [key]:value} : g)}));
  }
  function removeGroup(id){
    setState(s => ({...s, groups: s.groups.filter(g=>g.id!==id)}));
  }
  function setAdkar(catId, key, value){
    setState(s => ({...s, adkarByCategory: {...s.adkarByCategory, [catId]: {...s.adkarByCategory[catId], [key]: value}}}));
  }
  function enableOptionalCategory(){
    setState(s => ({...s, usesOptionalCategory: true}));
  }
  function addAction(categoryId){
    if ((actionsByCategory[categoryId]||[]).length >= MAX_ACTIONS_PER_CATEGORY) return;
    setState(s => ({...s, actions: [...s.actions, {
      id:cryptoId(), categoryId, dzialanie:"", kamien:"", termin:"", odpowiedzialny:"",
      weryfikacja:"", dodanoDoHarmonogramu:false, status:"Do zaplanowania",
    }]}));
  }
  function updateAction(id, key, value){
    setState(s => ({...s, actions: s.actions.map(a => a.id===id ? {...a, [key]:value} : a)}));
  }
  function removeAction(id){
    setState(s => ({...s, actions: s.actions.filter(a=>a.id!==id)}));
  }
  function toggleChecklist(key){
    setState(s => ({...s, checklist12: {...s.checklist12, [key]: !s.checklist12[key]}}));
  }

  // Poziom 1 (mała zmiana) dostaje tylko checklistę — grupy i reszta zostają w karcie projektu.
  // Poziom 2 (średnia) dostaje checklistę I Diagnozę/Plan/Pulpit, z krótką "Szybką oceną
  // gotowości" zamiast pełnego PCT. Poziom 3 (duża) dostaje wszystko, łącznie z pełnym PCT.
  // Obie flagi liczone raz i używane też przy renderze w <main> — żeby warunek nie rozjechał
  // się między tabsDef i renderem (tak jak się rozjechał, zanim ta flaga istniała).
  const canSeeChecklist = level.complete && level.poziom < 3;
  const canSeeDiagnoza = level.complete && level.poziom >= 2;
  const canSeePct = level.complete && level.poziom === 3;
  const canSeeQuick = level.complete && level.poziom === 2;
  // Twarda blokada (nie tylko ostrzeżenie): dopóki jakaś grupa ma kategorię, ale brakuje jej
  // opisu "Co zmienia się w ich pracy?" (albo brakuje kategorii), Plan działań i Pulpit są
  // niedostępne — wymuszamy uzupełnienie diagnozy, zanim będzie można przejść dalej.
  const hasIncompleteGroups = state.groups.some(g => !g.categoryId || !(g.wplyw||"").trim());
  const canSeePlanPulpit = canSeeDiagnoza && !hasIncompleteGroups;
  const tabsDef = [
    {id:"dane", label:"Dane projektu"},
    {id:"ankieta", label:"Ankieta — skala zmiany"},
    canSeeChecklist ? {id:"checklisty", label:"Checklisty (poziom " + level.poziom + ")"} : null,
    canSeeDiagnoza ? {id:"diagnoza", label:"Diagnoza"} : null,
    canSeePlanPulpit ? {id:"plan", label:"Plan działań"} : null,
    canSeePlanPulpit ? {id:"pulpit", label:"Pulpit"} : null,
    {id:"przewodnik", label:"Przewodnik"},
  ].filter(Boolean);

  useEffect(()=>{
    if (!tabsDef.some(t => t.id === tab)) setTab("dane");
  }, [tab, tabsDef]);

  // Komunikat "co się właśnie odblokowało" — pojawia się raz, gdy ankieta ustali (albo zmieni)
  // poziom zmiany, żeby użytkownik wiedział, dokąd iść dalej, zamiast się domyślać.
  const prevPoziomRef = useRef(null);
  useEffect(()=>{
    if (level.complete && prevPoziomRef.current !== level.poziom){
      const nextLabel = level.poziom === 3 ? "Diagnoza" : "Checklisty";
      setToast("Ustalono poziom " + level.poziom + " (" + level.label + "). Przejdź do zakładki „" + nextLabel + "”, żeby zobaczyć następny krok.");
    }
    prevPoziomRef.current = level.complete ? level.poziom : null;
  }, [level.complete, level.poziom]);

  return (
    <React.Fragment>
      <header className="app">
        <div>
          <div className="brand-row">
            <span className="brand-badge">Grupa Merito</span>
            <h1>Plan zarządzania zmianą</h1>
          </div>
          <div className="sub">{state.project.nazwa || "Nowy projekt"} · {level.complete ? (surveyTotal + " pkt · Poziom " + level.poziom + " (" + level.label + ")") : ("ankieta: " + surveyAnsweredCount + "/" + SURVEY_QUESTION_COUNT + " pytań")}</div>
        </div>
        <div className="toolbar">
          <button className="ghost" onClick={()=>setShowVersions(true)}>Wersje ({versions.length})</button>
          <button className="ghost" onClick={()=>persistAsNewVersion(state.project.nazwa)}>Zapisz wersję</button>
          <button className="primary" onClick={exportExcel}
            title="Pobiera kopię projektu jako plik (Excel) — zachowaj go, wyślij e-mailem albo otwórz na innym komputerze.">
            Zapisz plik
          </button>
          <input ref={excelInputRef} type="file" accept=".xlsx" style={{display:"none"}}
            onChange={e => { if(e.target.files[0]) importExcel(e.target.files[0]); e.target.value=""; }} />
          <button className="ghost" onClick={()=>excelInputRef.current.click()}
            title="Wczytuje projekt z pliku zapisanego wcześniej przyciskiem „Zapisz plik”.">
            Otwórz plik
          </button>
        </div>
      </header>

      <nav className="tabs">
        {tabsDef.map(t => (
          <button key={t.id} className={tab===t.id?"active":""} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </nav>

      <main>
        {!storageOk && (
          <div className="banner warn">
            Ta przeglądarka blokuje lokalny zapis (localStorage) — np. tryb prywatny albo ustawienia bezpieczeństwa.
            „Zapisz wersję” nie przetrwa zamknięcia karty. Używaj „Zapisz plik” / „Otwórz plik”, żeby nie stracić pracy.
          </div>
        )}
        {tab==="dane" && <DaneProjektu project={state.project} setField={setProjectField}
          kartaInputRef={kartaInputRef} onKartaFile={handleKartaFile}
          kartaImport={kartaImport} onApplyKartaFields={applyKartaFields} onApplyKartaGroups={applyKartaGroups}
          onApplyKartaMilestones={applyKartaMilestones} onApplyKartaTeam={applyKartaTeam} onApplyKartaRisks={applyKartaRisks}
          onApplyKartaDeliverables={applyKartaDeliverables} onApplyKartaBudgetItems={applyKartaBudgetItems}
          onApplyKartaLinks={applyKartaLinks} onApplyKartaMaintenanceCosts={applyKartaMaintenanceCosts}
          onApplyKartaAll={applyKartaAll}
          onDismissKarta={dismissKartaImport}
          milestones={state.milestones} teamMembers={state.teamMembers} risks={state.risks}
          deliverables={state.deliverables} budgetItems={state.budgetItems} links={state.links} maintenanceCosts={state.maintenanceCosts}
          budzetRazemComputed={budzetRazemComputed}
        />}
        {tab==="ankieta" && <Ankieta answers={state.surveyAnswers} setAnswer={setSurveyAnswer} total={surveyTotal} level={level}/>}
        {tab==="checklisty" && canSeeChecklist && <Checklisty level={level} checklist={state.checklist12} toggle={toggleChecklist}/>}
        {tab==="diagnoza" && canSeeDiagnoza && <Diagnoza
          state={state} pctAvg={pctAvg} pctWeakestAreas={pctWeakestAreas} pctLatestScores={pctLatestScores}
          showPct={canSeePct} setPct={setPct} setPctAnswer={setPctAnswer} addPctCheckpoint={addPctCheckpoint}
          showQuick={canSeeQuick} quickScoresObj={quickScoresObj} quickAvg={quickAvg} quickWeakestAreas={quickWeakestAreas}
          setQuickAnswer={setQuickAnswer}
          hasIncompleteGroups={hasIncompleteGroups}
          addGroup={addGroup} updateGroup={updateGroup} removeGroup={removeGroup}
          setAdkar={setAdkar} categoryBarrier={categoryBarrier} adkarRollup={adkarRollup}
          usesOptionalCategory={state.usesOptionalCategory} enableOptionalCategory={enableOptionalCategory}
        />}
        {tab==="plan" && canSeePlanPulpit && <PlanDzialan
          actionsByCategory={actionsByCategory} categoryBarrier={categoryBarrier}
          adkarByCategory={state.adkarByCategory} groups={state.groups}
          addAction={addAction} updateAction={updateAction} removeAction={removeAction}
          usesOptionalCategory={state.usesOptionalCategory}
          milestones={state.milestones} teamMembers={state.teamMembers}
        />}
        {tab==="pulpit" && canSeePlanPulpit && <Pulpit
          project={state.project} level={level} surveyTotal={surveyTotal}
          readinessAvg={readinessAvg} readinessWeakestAreas={readinessWeakestAreas} readinessLabel={readinessLabel}
          statusCounts={statusCounts} signals={signals}
          goTo={setTab}
        />}
        {tab==="przewodnik" && <Przewodnik/>}
      </main>

      <dialog ref={versionsDialogRef} onClose={()=>setShowVersions(false)} onCancel={()=>setShowVersions(false)}>
        <div className="inner">
          <div className="flex-between"><h2 style={{margin:0}}>Zapisane wersje</h2><button className="small" onClick={()=>setShowVersions(false)}>Zamknij</button></div>
          <p className="hint">Wersje są zapisywane lokalnie w tej przeglądarce.</p>
          <div className="versions-list">
            {versions.length===0 && <div className="row muted">Brak zapisanych wersji.</div>}
            {versions.map(v => (
              <div className="row" key={v.id}>
                <div>
                  <div>{v.name}</div>
                  <div className="muted" style={{fontSize:11}}>{new Date(v.savedAt).toLocaleString("pl-PL")}</div>
                </div>
                <div style={{display:"flex", gap:6}}>
                  <button className="small" onClick={()=>loadVersion(v)}>Wczytaj</button>
                  <button className="small" onClick={()=>deleteVersion(v.id)}>Usuń</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </dialog>

      {toast && <div style={{position:"fixed", bottom:16, right:16, background:"var(--ink)", color:"#fff", padding:"10px 16px", borderRadius:8, fontSize:13}}>{toast}</div>}

      <footer className="app">Plan Zarządzania Zmianą · Grupa Merito · wersja robocza</footer>
    </React.Fragment>
  );
}

/* ---------- Widoki ---------- */

const KARTA_FIELD_LABELS = {
  nazwa: "Nazwa projektu/programu", nick: "Nick/symbol", sponsor: "Sponsor", pm: "PM / Lider projektu",
  typProjektu: "Typ projektu", filie: "Filie objęte projektem", zwiazekZeStrategia: "Związek ze strategią",
  okresRealizacji: "Okres realizacji", powodyProjektu: "Powody podjęcia projektu", celProjektu: "Cel projektu",
  glownaKorzysc: "Główna korzyść biznesowa", budzetRazem: "Budżet razem (brutto)",
  wylaczenia: "Wyłączenia", zrodloFinansowania: "Źródło finansowania",
  korzyscTermin: "Termin wystąpienia korzyści", korzyscMiernik: "Miernik korzyści",
};

function KartaImportSection({title, count, previewPills, onApply, applyLabel}){
  if (count === 0) return null;
  return (
    <React.Fragment>
      <p className="hint" style={{margin:"0 0 6px"}}>{title} ({count}):</p>
      {previewPills && <div className="pill-list" style={{marginBottom:8}}>{previewPills}</div>}
      <button className="small" onClick={onApply} style={{marginBottom:14}}>{applyLabel}</button>
    </React.Fragment>
  );
}

function DaneProjektu({project, setField, kartaInputRef, onKartaFile, kartaImport,
  onApplyKartaFields, onApplyKartaGroups, onApplyKartaMilestones, onApplyKartaTeam, onApplyKartaRisks,
  onApplyKartaDeliverables, onApplyKartaBudgetItems, onApplyKartaLinks, onApplyKartaMaintenanceCosts, onApplyKartaAll,
  onDismissKarta, milestones, teamMembers, risks, deliverables, budgetItems, links, maintenanceCosts, budzetRazemComputed}){
  const kartaType = project.kartaType;
  // Budżet razem: karty rzadko mają wypełniony wiersz "RAZEM" — wartość z karty (gdy podana) nadpisuje
  // wyliczoną sumę pozycji budżetowych, w przeciwnym razie pokazujemy sumę wyliczoną automatycznie.
  const budzetRazemValue = (project.budzetRazem||"").trim() || budzetRazemComputed || "";
  const budzetRazemNote = (project.budzetRazem||"").trim() ? "" : (budzetRazemComputed ? " (wyliczone automatycznie z pozycji budżetowych)" : "");
  // Pola, których dany szablon karty nie zawiera (P1.5) — pokazujemy to wyraźnie zamiast pustego pola,
  // żeby nie wyglądało na nieudany import. Karta uczelniana ma MPK/zlecenie zamiast źródła finansowania,
  // karta programu nie ma pola Nick/symbol ani tabeli składu zespołu.
  const extraFieldRows = [
    {label:"Nick/symbol", value: project.nick, absent: kartaType==="program", absentNote:"karta programu nie zawiera pola Nick/symbol"},
    {label:"Filie/podmioty objęte projektem", value: project.filie},
    {label:"Budżet razem (brutto)", value: budzetRazemValue, note: budzetRazemNote},
    {label:"Źródło finansowania", value: project.zrodloFinansowania, absent: kartaType==="uczelnia", absentNote:"karta uczelniana ma MPK/zlecenie zamiast źródła finansowania"},
    {label:"Związek ze strategią", value: project.zwiazekZeStrategia},
    {label:"Wyłączenia (czego projekt NIE obejmuje)", value: project.wylaczenia},
    {label:"Termin wystąpienia korzyści", value: project.korzyscTermin},
    {label:"Miernik korzyści", value: project.korzyscMiernik},
  ].filter(r => (r.value && r.value.trim()) || r.absent);
  const hasReference = milestones.length>0 || teamMembers.length>0 || risks.length>0 || deliverables.length>0 || budgetItems.length>0 || links.length>0 || maintenanceCosts.length>0 || extraFieldRows.length>0;
  return (
    <React.Fragment>
      <div className="card">
        <h2>Jak zacząć</h2>
        <ol>
          <li>Wczytaj kartę projektu (.docx) poniżej — bez tabelki „Grupy objęte zmianą”, tę wypełnisz w kroku 3.</li>
          <li>Przejdź do zakładki „Ankieta — skala zmiany” i odpowiedz na wszystkie pytania — to ustali poziom zmiany.</li>
          <li>
            Dla <strong>małej zmiany</strong> wypełnij tabelkę grup bezpośrednio w karcie projektu — w tym narzędziu nic
            więcej nie trzeba robić. Dla <strong>średniej i dużej zmiany</strong> wypełnij grupy i resztę diagnozy tutaj,
            w zakładce „Diagnoza” — to narzędzie eksportuje wynik jako załącznik do karty. Nie wypełniaj tabelki grup
            w obu miejscach naraz.
          </li>
        </ol>
      </div>

      <div className="card">
        <h2>Wczytaj kartę projektu</h2>
        <p className="hint">
          Podaj kartę projektu (.docx, standardowy szablon Grupy Merito) — narzędzie wyciąga z niej praktycznie wszystko:
          dane ogólne, cel i kontekst, wyłączenia, budżet, grupy interesariuszy, harmonogram (kamienie milowe), skład
          zespołu (w tym sporadyczne zaangażowanie), kluczowe ryzyka, produkty projektu i powiązania z innymi projektami.
          Nic nie zostanie nadpisane bez Twojej zgody — najpierw zobaczysz podgląd i sam wybierasz, co zastosować.
        </p>
        <input ref={kartaInputRef} type="file" accept=".docx" style={{display:"none"}}
          onChange={e => { if (e.target.files[0]) onKartaFile(e.target.files[0]); e.target.value=""; }} />
        <button onClick={()=>kartaInputRef.current.click()}>Wybierz plik karty (.docx)</button>

        {kartaImport && kartaImport.failed && (
          <div className="banner warn" style={{marginTop:14}}>
            Nie rozpoznano niczego w pliku „{kartaImport.fileName}”. To może nie być karta projektu w standardowym
            szablonie Grupy Merito (albo układ tabel się różni) — wpisz dane ręcznie poniżej.
            <div style={{marginTop:8}}><button className="small" onClick={onDismissKarta}>Zamknij</button></div>
          </div>
        )}
