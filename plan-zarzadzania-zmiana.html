// Klasyczny trójkąt PCT: definicja sukcesu w środku, na trzech ramionach przywództwo/sponsoring,
// zarządzanie projektem i zarządzanie zmianą — zamiast wykresu radarowego z v1.7 (zespół chciał
// rozpoznawalny kształt Prosci, nie czwarty wierzchołek doklejony do trójkąta). Stały, jasny
// trójkąt referencyjny (kontur zawsze tego samego rozmiaru) plus punkty na ramionach, których
// odległość od środka jest proporcjonalna do wyniku (0/30 = w środku, 30/30 = w wierzchołku) —
// ten sam mechanizm skalowania co poprzednio w radarze, tylko na 3 osiach. Węzeł centralny koduje
// wynik kolorem (jak reszta) i rozmiarem kropki (większa = lepszy wynik), bo nie ma ramienia,
// którego długość mogłaby to pokazać. `scores` to obiekt {obszar: liczba|null} — dokładnie to, co
// zwraca pctScores i co dostaje computeWeakestPctAreas, więc wykres zawsze pokazuje to samo, co
// baner tekstowy nad/pod nim.
function PctTriangle({scores, weakestKeys}){
  const size = 400, center = size/2, radius = 130, labelR = radius + 46;
  const areaOrder = ["przywodztwo", "zarzadzanieZmiana", "zarzadzanieProjektem"];
  const angles = {przywodztwo: -90, zarzadzanieZmiana: 30, zarzadzanieProjektem: 150};
  const areaByKey = {}; PCT_AREAS.forEach(a => { areaByKey[a.key] = a; });
  const vertexAt = (key, frac) => {
    const rad = angles[key] * Math.PI/180;
    return [center + radius*frac*Math.cos(rad), center + radius*frac*Math.sin(rad)];
  };
  const dataPoints = areaOrder.map(k => {
    const frac = Math.max(0, Math.min(30, scores[k] ?? 0)) / 30;
    return vertexAt(k, frac);
  });
  const pathD = dataPoints.map((p,i) => (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ") + " Z";
  const allKeys = ["definicjaSukcesu", ...areaOrder];
  const allScored = allKeys.every(k => scores[k] != null);
  const anyScored = allKeys.some(k => scores[k] != null);
  const centerVal = scores.definicjaSukcesu;
  const isCenterWeakest = weakestKeys.includes("definicjaSukcesu");
  const centerRadius = 11 + (centerVal!=null ? (Math.max(0,Math.min(30,centerVal))/30)*13 : 0);
  return (
    <div>
      <svg viewBox={"0 0 "+size+" "+size} style={{width:"100%", maxWidth:400, display:"block", margin:"0 auto"}}>
        {[1/3, 2/3, 1].map(frac => {
          const pts = areaOrder.map(k => vertexAt(k, frac).join(",")).join(" ");
          return <polygon key={frac} points={pts} fill="none" stroke="#BABDCC" strokeWidth="1"/>;
        })}
        {areaOrder.map(k => {
          const [x,y] = vertexAt(k, 1);
          return <line key={k} x1={center} y1={center} x2={x} y2={y} stroke="#BABDCC" strokeWidth="1"/>;
        })}
        <path d={pathD} fill="#EAF1FE" fillOpacity="0.85" stroke="#006EFA" strokeWidth="2"
          strokeDasharray={allScored ? "none" : "5 4"}/>
        {areaOrder.map((k,i) => {
          const [x,y] = dataPoints[i];
          const v = scores[k];
          const isWeakest = weakestKeys.includes(k);
          return (
            <circle key={k} cx={x} cy={y} r={isWeakest ? 8 : 5}
              fill={v==null ? "#fff" : (isWeakest ? "#D64545" : "#006EFA")}
              stroke={v==null ? "#BABDCC" : "#141E50"} strokeWidth={v==null ? 1 : 1.5}/>
          );
        })}
        {areaOrder.map(k => {
          const [lx,ly] = vertexAt(k, labelR/radius);
          const a = areaByKey[k];
          const lines = a.label.replace(" / ", " ").split(" ");
          const isWeakest = weakestKeys.includes(k);
          const v = scores[k];
          return (
            <text key={k} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
              fontSize="11" fontWeight={isWeakest ? 700 : 500} fill={isWeakest ? "#D64545" : "#141E50"}>
              {lines.map((line,li) => (
                <tspan key={li} x={lx} dy={li===0 ? (lines.length>1 ? -6 : 0) : 13}>{line}</tspan>
              ))}
              <tspan x={lx} dy={14} fontSize="10" fontWeight={400} fill="#4A5278">{v!=null ? "("+Math.round(v)+"/30)" : "brak danych"}</tspan>
            </text>
          );
        })}
        <circle cx={center} cy={center} r={centerRadius}
          fill={centerVal==null ? "#fff" : (isCenterWeakest ? "#D64545" : "#141E50")}
          stroke={isCenterWeakest ? "#D64545" : "#141E50"} strokeWidth={isCenterWeakest ? 2.5 : 1.5}/>
        {centerVal!=null && (
          <text x={center} y={center} textAnchor="middle" dominantBaseline="middle" fontSize="12" fontWeight="700" fill="#fff">
            {Math.round(centerVal)}
          </text>
        )}
        <text x={center} y={center+centerRadius+16} textAnchor="middle" fontSize="11"
          fontWeight={isCenterWeakest ? 700 : 500} fill={isCenterWeakest ? "#D64545" : "#141E50"}>
          Definicja sukcesu
        </text>
      </svg>
      {!allScored && (
        <p className="hint" style={{textAlign:"center"}}>
          {anyScored ? "Uzupełnij pytania każdego obszaru, aby wykres pokazał pełny wynik." : "Odpowiedz na pytania poniżej, aby zobaczyć wynik na wykresie."}
        </p>
      )}
    </div>
  );
}

function Diagnoza({state, pctAvg, pctWeakestAreas, pctLatestScores, showPct, setPct, setPctAnswer, addPctCheckpoint, addPctAction, updatePctAction, removePctAction, hasIncompleteGroups, addGroup, updateGroup, removeGroup, setAdkar, categoryBarrier, adkarRollup}){
  const missingCategory = state.groups.filter(g => !g.categoryId).length;
  const missingWplyw = state.groups.filter(g => g.categoryId && !(g.wplyw||"").trim()).length;
  const rolesWithoutGroups = CATEGORIES.some(c => !state.groups.some(g => g.categoryId === c.id));
  // Rola bez przypisanej grupy nie ma jeszcze nic do oceniania w ADKAR — ten sam filtr co w Planie
  // działań (użytkownik widział pustą, zwiniętą rolę i myślał, że musi ją wypełnić).
  const adkarVisibleCategories = CATEGORIES.filter(c => state.groups.some(g => g.categoryId === c.id));
  // Numeracja sekcji liczona dynamicznie — dla średniej zmiany nie ma sekcji PCT (tylko poziom 3
  // ją dostaje), więc "Grupy" muszą zostać krokiem 1, nie 2.
  let step = 0;
  const assessmentStep = showPct ? ++step : null;
  const groupsStep = ++step;
  const adkarStep = ++step;
  const skanStep = ++step;
  return (
    <React.Fragment>
      {showPct && (
        <div className="card">
          <h2>{assessmentStep}. PCT — kondycja całego przedsięwzięcia</h2>
          <p className="hint">
            Ocena pokazuje, na ile przedsięwzięcie jest przygotowane nie tylko do dostarczenia rezultatów projektu,
            ale również do ich skutecznego wdrożenia i wykorzystania w codziennej działalności organizacji. Wynik
            obszaru (1–30) liczy się sam z sześciu odpowiedzi.
          </p>
          <p className="hint">{LIKERT_SCALE_LEGEND}</p>
          <p className="hint">W pierwszej kolejności zajmij się obszarem ocenionym najniżej. Obszar z wynikiem poniżej 20 punktów również wymaga uwagi.</p>
          {state.pctHistory.map((p, idx) => {
            const rowScores = pctScores(p);
            const rowWeakest = computeWeakestPctAreas(rowScores);
            const isLast = idx === state.pctHistory.length - 1;
            return (
              <details key={p.id} className="action-row" open={isLast} style={{marginBottom:14}}>
                <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>
                  {p.punktKontrolny || ("Pomiar " + (idx+1))}{p.data ? " — " + p.data : ""}
                  {PCT_AREAS.some(a => rowScores[a.key]!=null) && (" · " + PCT_AREAS.map(a => a.label + " " + (rowScores[a.key]!=null ? rowScores[a.key]+"/30" : "–")).join(", "))}
                </summary>
                <div className="grid cols2" style={{marginBottom:14}}>
                  <Field label="Data"><input type="date" value={p.data} onChange={e=>setPct(idx,"data",e.target.value)}/></Field>
                  <Field label="Punkt kontrolny"><input type="text" value={p.punktKontrolny} onChange={e=>setPct(idx,"punktKontrolny",e.target.value)}/></Field>
                </div>
                {PCT_AREAS.map(a => (
                  <div key={a.key} style={{marginBottom:16}}>
                    <div className="flex-between" style={{marginBottom:6}}>
                      <h4 style={{margin:0}}>{a.label}</h4>
                      {rowScores[a.key]!=null && <Badge tone={pctTone(rowScores[a.key])}>{rowScores[a.key]}/30</Badge>}
                    </div>
                    {PCT_QUESTIONS[a.key].map((q, qi) => (
                      <div key={qi} className="flex-between" style={{marginBottom:8}}>
                        <div style={{maxWidth:520}}>{q}</div>
                        <Likert value={p.answers[a.key][qi]} onChange={v=>setPctAnswer(idx, a.key, qi, v)} labels={LIKERT_SCALE_LABELS}/>
                      </div>
                    ))}
                  </div>
                ))}
                {rowWeakest.length > 0 && (
                  <div className="banner warn" style={{marginTop:10}}>
                    <strong>Najsłabszy obszar: {rowWeakest.map(a=>a.label+" ("+a.value+"/30)").join(" i ")}</strong>
                    {rowWeakest.map(a => <div key={a.key} style={{marginTop:4}}>{a.recommendation}</div>)}
                  </div>
                )}
                <details style={{marginTop:10}}>
                  <summary style={{cursor:"pointer", fontWeight:600}}>Przykłady działań dla poszczególnych obszarów</summary>
                  <table style={{marginTop:8, marginBottom:10}}>
                    <thead><tr><th>Obszar</th><th>Przykład wpisu</th></tr></thead>
                    <tbody>{PCT_AREAS.map(a => <tr key={a.key}><th style={{width:200}}>{a.label}</th><td>{a.example}</td></tr>)}</tbody>
                  </table>
                </details>
                <p className="hint" style={{marginTop:12, fontWeight:600}}>Na podstawie tej diagnozy zaplanuj działania usprawniające dla najsłabszego obszaru.</p>
                <div className="grid cols2" style={{marginTop:4}}>
                  <Field label="Działania usprawniające do kolejnego przeglądu">
                    {p.dzialaniaUsprawniajace.map((action, ai) => (
                      <div key={ai} className="flex-between" style={{marginBottom:6, gap:8}}>
                        <input type="text" style={{flex:1}} value={action} onChange={e=>updatePctAction(idx, ai, e.target.value)}/>
                        <button className="small" onClick={()=>removePctAction(idx, ai)}>Usuń</button>
                      </div>
                    ))}
                    <button className="small" onClick={()=>addPctAction(idx)}>+ Dodaj działanie</button>
                  </Field>
                  <Field label="Kolejny przegląd"><input type="date" value={p.kolejnyPrzeglad} onChange={e=>setPct(idx,"kolejnyPrzeglad",e.target.value)}/></Field>
                </div>
              </details>
            );
          })}
          <button className="small" onClick={addPctCheckpoint}>+ Kolejny pomiar</button>
          <PctTriangle scores={pctLatestScores} weakestKeys={pctWeakestAreas.map(a=>a.key)}/>
          <div className="banner info flex-between" style={{marginTop:14}}>
            <div>Średnia ostatniego pomiaru: <strong>{pctAvg!=null ? pctAvg.toFixed(1) : "–"}</strong>{pctWeakestAreas.length ? (" · Najsłabszy obszar: " + pctWeakestAreas.map(a=>a.label).join(" i ")) : ""}</div>
            <Badge tone={pctTone(pctAvg)}>{PCT_TONE_LABELS[pctTone(pctAvg)]}</Badge>
          </div>
        </div>
      )}

      <div className="card">
        <div className="flex-between">
          <h2 style={{margin:0}}>{groupsStep}. Grupy objęte zmianą</h2>
          <button className="small" onClick={addGroup}>+ Dodaj grupę</button>
        </div>
        <p className="hint">
          Grupy zaciągnęły się z karty projektu. Od jej przyjęcia mógł minąć jakiś czas — sprawdź, czy to nadal
          wszystkie grupy, czy nie doszły nowe i czy opis zmiany w ich pracy jest aktualny.
        </p>
        <details style={{marginBottom:10}}>
          <summary style={{cursor:"pointer", fontWeight:600}}>Co kryje się pod poszczególnymi rolami wobec zmiany?</summary>
          <table style={{marginTop:8}}>
            <tbody>{CATEGORIES.map(c => <tr key={c.id}><th style={{width:280}}>{c.label}</th><td>{c.hint}</td></tr>)}</tbody>
          </table>
        </details>
        {(missingCategory>0 || missingWplyw>0) && (
          <div className="banner warn">
            {missingCategory>0 && <div>{missingCategory} grup(y) bez przypisanej roli wobec zmiany.</div>}
            {missingWplyw>0 && <div>{missingWplyw} grup(y) z rolą wobec zmiany, ale bez wypełnionego pola „Co zmienia się w ich pracy?”.</div>}
            Dopóki oba pola nie są uzupełnione, grupa nie trafi do diagnozy ADKAR, a zakładki <strong>Plan działań</strong> i <strong>Pulpit</strong> pozostaną ukryte.
          </div>
        )}
        <table>
          <thead><tr><th>Grupa</th><th>Co zmienia się w ich pracy?</th><th>Rola wobec zmiany</th><th></th></tr></thead>
          <tbody>
            {state.groups.map(g => (
              <tr key={g.id}>
                <td><input type="text" value={g.nazwa} onChange={e=>updateGroup(g.id,"nazwa",e.target.value)}/></td>
                <td><textarea style={{minHeight:38}} value={g.wplyw} onChange={e=>updateGroup(g.id,"wplyw",e.target.value)}/></td>
                <td>
                  <select value={g.categoryId} onChange={e=>updateGroup(g.id,"categoryId",e.target.value)}>
                    <option value="">— wybierz rolę wobec zmiany —</option>
                    {CATEGORIES.map(c => <option key={c.id} value={c.id} title={c.hint}>{c.label}</option>)}
                  </select>
                </td>
                <td><button className="small" onClick={()=>removeGroup(g.id)}>Usuń</button></td>
              </tr>
            ))}
            {state.groups.length===0 && <tr><td colSpan="4" className="muted">Brak grup — kliknij „Dodaj grupę”.</td></tr>}
          </tbody>
        </table>
        {state.groups.length>0 && rolesWithoutGroups && (
          <div className="banner info" style={{marginTop:10}}>
            Nie każda rola wobec zmiany ma przypisane grupy. Zastanów się, czy to świadoma decyzja — pominięcie
            którejś grupy może utrudnić przyjęcie zmiany w organizacji. Jeśli uznasz, że kogoś brakuje, wróć do
            tabeli grup i go dodaj.
          </div>
        )}
      </div>

      <div className="card">
        <h2>{adkarStep}. Ocena ADKAR dla każdej roli wobec zmiany</h2>
        <p className="hint">
          ADKAR ocenia, na ile osoby w danej roli wobec zmiany są na nią gotowe — oceniasz wspólnie wszystkie grupy
          przypisane do tej roli: <strong>Awareness</strong> (świadomość potrzeby zmiany), <strong>Desire</strong> (chęć
          wspierania i uczestnictwa), <strong>Knowledge</strong> (wiedza, jak pracować w nowy sposób), <strong>Ability</strong> (praktyczne
          umiejętności), <strong>Reinforcement</strong> (trwałe stosowanie). Wynik przekłada się bezpośrednio na Plan działań —
          tam w pierwszej kolejności zajmujemy się najsłabiej ocenionym obszarem każdej roli wobec zmiany.
        </p>
        <p className="hint">Oceń każdą rolę wobec zmiany w skali 1–5. 1–2 oznacza istotną barierę, 3 wymaga uwagi, 4–5 to dobra gotowość.</p>
        {adkarVisibleCategories.map(c => {
          const d = state.adkarByCategory[c.id];
          const barrier = categoryBarrier(c.id);
          const catGroups = state.groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
          return (
            <div key={c.id} className="action-row">
              <div className="top">
                <strong>{c.label}</strong>
                {barrier.status === "barrier" && <Badge tone="orange">Największa bariera: {barrierExportText(barrier)}</Badge>}
                {barrier.status === "ready" && <Badge tone="green">Brak istotnej bariery</Badge>}
              </div>
              {catGroups.length>0 && <div className="pill-list" style={{marginBottom:10}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
              <div className="grid cols2">
                <div>
                  {ADKAR_DIMS.map(dim => (
                    <div key={dim.id} className="flex-between" style={{marginBottom:8}}>
                      <div style={{fontSize:12.5}}>{dim.label}<div className="muted" style={{fontSize:11}}>{dim.sub}</div></div>
                      <Likert value={d[dim.id]} onChange={v=>setAdkar(c.id, dim.id, v)}/>
                    </div>
                  ))}
                </div>
                <div>
                  {barrier.status === "ready" && (
                    <div className="hint" style={{marginBottom:6}}><strong>Brak istotnej bariery</strong> — grupa jest gotowa na zmianę.</div>
                  )}
                  {barrier.status === "barrier" && barrier.dims.map(b => (
                    <div key={b.id} className="hint" style={{marginBottom:6}}>{ADKAR_BARRIER_INTRO[b.id]}</div>
                  ))}
                  {barrier.status === "barrier" && barrier.extraCount > 0 && (
                    <div className="hint" style={{marginBottom:6}}>
                      Pozostałe {barrier.extraCount} {barrier.extraCount===1?"obszar":"obszary"} z tą samą oceną również wymagają uwagi.
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <h2>{skanStep}. ADKAR — szybki skan</h2>
        <p className="hint">Liczy się automatycznie z ocen powyżej.</p>
        {adkarRollup.map(r => (
          <div key={r.id} style={{marginBottom:14}}>
            <Bar label={r.label} value={r.avg} max={5}/>
            <div className="hint" style={{margin:"2px 0 0 160px"}}>
              {r.min!=null ? ("min " + r.min + " · ") : ""}
              {r.atRiskCount>0 ? (r.atRiskCount + " role z oceną ≤2 (" + r.atRisk.join(", ") + ")") : "brak ról w ryzyku"}
              {" · "}{r.suggestion}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function PlanDzialan({actionsByCategory, categoryBarrier, groups, addAction, updateAction, removeAction, milestones}){
  // Rola bez przypisanej grupy nie ma jeszcze nic do planowania — pokazywanie jej tylko myli
  // (pusta sekcja z przyciskiem "Dodaj działanie", zgłoszone na zrzucie ekranu).
  const visibleCategories = CATEGORIES.filter(c => groups.some(g => g.categoryId === c.id));
  // v2.0: lista wyboru podpowiada WSZYSTKIE pozycje z harmonogramu karty (etapy, kamienie i zwykłe
  // działania) — pole przyjmuje też dowolny własny wpis, gdy nic pasującego nie ma na liście.
  const milestoneChoices = milestones;
  return (
    <div className="card">
      <h2>Plan działań</h2>
      <p className="hint">Dla każdej roli wobec zmiany zaplanuj 3 najważniejsze działania, które w największym stopniu pomogą usunąć zidentyfikowane bariery.</p>
      {visibleCategories.map(c => {
        const actions = actionsByCategory[c.id] || [];
        const barrier = categoryBarrier(c.id);
        const catGroups = groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
        const overSoftLimit = actions.length > MAX_ACTIONS_PER_CATEGORY;
        return (
          <div key={c.id} style={{marginBottom:22}}>
            <div className="flex-between">
              <div>
                <strong>{c.label}</strong>
                {barrier.status === "barrier" && <span className="tag" style={{marginLeft:8}}>bariera: {barrierExportText(barrier)}</span>}
              </div>
              <button className="small" onClick={()=>addAction(c.id)}>+ Dodaj działanie ({actions.length})</button>
            </div>
            {catGroups.length>0 && <div className="pill-list" style={{margin:"6px 0"}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
            {barrier.status === "barrier" && (
              <div style={{margin:"4px 0 10px"}}>
                {barrier.dims.map(b => (
                  <div key={b.id} className="hint" style={{margin:"2px 0"}}>
                    Przykładowe działania na barierę „{b.label}”: {ADKAR_EXAMPLES_SHORT[b.id].join(", ")}.
                    <details style={{marginTop:2}}>
                      <summary style={{cursor:"pointer"}}>Potrzebujesz więcej pomysłów?</summary>
                      <div style={{marginTop:2}}>{ADKAR_EXAMPLES[b.id].join(", ")}.</div>
                    </details>
                  </div>
                ))}
              </div>
            )}
            {overSoftLimit && <p className="hint">Więcej niż 3 działania — rozważ, czy da się je połączyć lub rozbić na etapy w ramach istniejących wierszy, zamiast dodawać kolejne.</p>}

            {actions.map(a => (
              <div key={a.id} className="action-row">
                <div className="top">
                  <span className="muted">Działanie</span>
                  <button className="small" onClick={()=>removeAction(a.id)}>Usuń</button>
                </div>
                <Field label="Działanie"><textarea value={a.dzialanie} onChange={e=>updateAction(a.id,"dzialanie",e.target.value)} placeholder="Co konkretnie zrobimy?"/></Field>
                <div className="grid cols3">
                  <Field label="Z jakim działaniem lub kamieniem milowym powiązane jest to działanie?"
                    hint="Możesz wybrać pozycję z listy (zaciągniętą z karty projektu) albo wpisać własną.">
                    <input type="text" list="milestones-dl" value={a.kamien} onChange={e=>updateAction(a.id,"kamien",e.target.value)}/>
                  </Field>
                  <Field label="Termin"><input type="date" value={a.termin} onChange={e=>updateAction(a.id,"termin",e.target.value)}/></Field>
                  <Field label={<React.Fragment>Odpowiedzialny{" "}
                    <span title="Wskaż właściciela działania, który odpowiada za jego realizację, koordynację zaangażowanych osób oraz monitorowanie postępów." style={{cursor:"help", color:"var(--muted)"}}>ⓘ</span>
                  </React.Fragment>}>
                    <input type="text" value={a.odpowiedzialny} onChange={e=>updateAction(a.id,"odpowiedzialny",e.target.value)}/>
                  </Field>
                </div>
                <div className="grid cols2">
                  <Field label="Status">
                    <select value={a.status} onChange={e=>updateAction(a.id,"status",e.target.value)}>
                      {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </Field>
                  <Field label="">
                    <label style={{display:"flex", alignItems:"center", gap:8, fontWeight:400}}>
                      <input type="checkbox" checked={a.dodanoDoHarmonogramu} onChange={e=>updateAction(a.id,"dodanoDoHarmonogramu",e.target.checked)}/>
                      Dodano do harmonogramu projektu
                    </label>
                  </Field>
                </div>
              </div>
            ))}
            {actions.length===0 && <p className="muted">Brak działań dla tej roli wobec zmiany.</p>}
          </div>
        );
      })}
      <div className="banner info">
        <strong>Pamiętaj:</strong> kluczowe działania powinny zostać uwzględnione w harmonogramie projektu. Jeśli
        projekt jest prowadzony w FlexiProject, dodaj je również jako zadania w systemie.
      </div>
      <div className="banner info">
        <strong>Zapisz swoją pracę:</strong> praca nie zapisuje się sama — zamknięcie karty przeglądarki bez
        eksportu oznacza jej utratę. Kliknij „Zapisz plik”, żeby zachować bieżącą wersję na dysku.
      </div>
      <datalist id="milestones-dl">
        {milestoneChoices.map(m => <option key={m.id} value={m.nazwa}/>)}
      </datalist>
    </div>
  );
}

function Pulpit({project, level, surveyTotal, pctAvg, pctWeakestAreas, statusCounts, signals, goTo}){
  const wipOver = statusCounts["W realizacji"] > MAX_WIP_ACTIONS;
  return (
    <React.Fragment>
      <div className="card">
        <h2>Kontekst</h2>
        <div className="grid cols3">
          <div><div className="muted">Projekt / program</div><div>{project.nazwa || "–"}</div></div>
          <div><div className="muted">Sponsor</div><div>{project.sponsor || "–"}</div></div>
          <div><div className="muted">Typ projektu</div><div>{project.typProjektu || "–"}</div></div>
          <div><div className="muted">Skala zmiany</div><div><Badge tone={level.color}>{level.complete ? (surveyTotal + " pkt — poziom " + level.poziom) : "ankieta nieukończona"}</Badge></div></div>
          {level.poziom === 3 && (
            <React.Fragment>
              <div><div className="muted">PCT — średnia</div><div><Badge tone={pctTone(pctAvg)}>{pctAvg!=null?pctAvg.toFixed(1):"brak danych"}</Badge></div></div>
              <div><div className="muted">PCT — najsłabszy obszar</div><div>{pctWeakestAreas.length ? pctWeakestAreas.map(a=>a.label).join(" i ") : "–"}</div></div>
            </React.Fragment>
          )}
        </div>
      </div>

      <div className="card">
        <h2>Pulpit planu działań</h2>
        <div style={{marginBottom:16}}>
          <div className="flex-between" style={{marginBottom:6}}>
            <strong>Postęp realizacji</strong>
            <span className="muted">
              {statusCounts.all>0
                ? (statusCounts["Zrealizowane"] + " z " + statusCounts.all + " działań zrealizowanych (" + Math.round(statusCounts["Zrealizowane"]/statusCounts.all*100) + "%)")
                : "brak działań"}
            </span>
          </div>
          <div className="bar-track"><div className="bar-fill" style={{width: (statusCounts.all>0 ? (statusCounts["Zrealizowane"]/statusCounts.all*100) : 0)+"%", background:"var(--green)"}}/></div>
        </div>
        <div className="grid cols4">
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.all}</div><div className="muted">wszystkie</div></div>
          <div className="action-row" style={{textAlign:"center"}}>
            <div style={{fontSize:24, fontWeight:700, color: wipOver?"var(--red)":"inherit"}}>{statusCounts["W realizacji"]}</div>
            <div className="muted">w realizacji {wipOver ? "(limit " + MAX_WIP_ACTIONS + "!)" : ""}</div>
          </div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts["Zablokowane"]}</div><div className="muted">zablokowane</div></div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.dodaneDoHarmonogramu}</div><div className="muted">dodane do harmonogramu</div></div>
        </div>
        <p className="hint">Zasada WIP: maksymalnie {MAX_WIP_ACTIONS} działań ze statusem „W realizacji” jednocześnie — pozostałe czekają jako „Do zaplanowania”.</p>
      </div>

      <div className="card">
        <h2>Sygnały do decyzji</h2>
        <table>
          <tbody>
            <tr><td>Brak odpowiedzialnego</td><td><Badge tone={signals.brakOdpowiedzialnego>0?"orange":"green"}>{signals.brakOdpowiedzialnego}</Badge></td></tr>
            <tr><td>Brak terminu / kamienia milowego</td><td><Badge tone={signals.brakTerminu>0?"orange":"green"}>{signals.brakTerminu}</Badge></td></tr>
            <tr><td>Zablokowane</td><td><Badge tone={signals.zablokowane>0?"red":"green"}>{signals.zablokowane}</Badge></td></tr>
          </tbody>
        </table>
      </div>

      <div className="card">
        <p className="hint" style={{margin:0}}>Pełny opis sposobu pracy z PZZ — zakładka <a href="#" onClick={(e)=>{e.preventDefault(); goTo("przewodnik");}}>Przewodnik</a>.</p>
      </div>
    </React.Fragment>
  );
}

function Przewodnik(){
  return (
    <div className="card">
      <h2>Jak pracować z PZZ</h2>
      <p className="hint">
        Zacznij od wczytania karty projektu w zakładce <strong>Dane projektu</strong> — metryczka, korzyści,
        etapy/kamienie i grupy objęte zmianą zaciągną się automatycznie (grupy zawsze uzupełnia się w karcie, nie
        w tym narzędziu). Potem przejdź do <strong>Ankiety — skala zmiany</strong>. Dopóki nie odpowiesz na
        wszystkie 13 pytań, narzędzie nie wie, jak duża jest zmiana, i nie pokazuje żadnej dalszej ścieżki. Po
        ukończeniu ankiety pojawia się jedna z trzech ścieżek:
      </p>
      <ul>
        <li><strong>Poziom 1 (mała zmiana):</strong> zakładka „Checklisty” — krótkie pytania o sponsora.</li>
        <li><strong>Poziom 2 (średnia zmiana):</strong> „Checklisty” + „Diagnoza” (grupy i ADKAR, bez PCT) + „Plan działań” + „Pulpit”.</li>
        <li><strong>Poziom 3 (duża zmiana):</strong> „Diagnoza” (pełne PCT + ADKAR), „Plan działań” i „Pulpit”.</li>
      </ul>
      <p className="hint">
        „Plan działań” i „Pulpit” odblokowują się dopiero, gdy każda dodana grupa ma przypisaną rolę wobec zmiany
        i wypełnione pole „Co zmienia się w ich pracy?” — dopóki tak nie jest, te zakładki są ukryte.
      </p>
      <p className="hint">Jeśli w trakcie pracy okaże się, że zmiana jest inna niż na starcie, wróć do „Ankiety” i zmień odpowiedzi — ścieżka przełączy się automatycznie.</p>
      <h3>Zapis i wznawianie pracy</h3>
      <p className="hint">
        To narzędzie działa lokalnie w przeglądarce i nic nie wysyła na serwer — ale to też znaczy, że odpowiedzi
        nie zapisują się same. Zamknięcie karty przeglądarki bez eksportu oznacza utratę pracy od ostatniego
        zapisu pliku.
      </p>
      <ol>
        <li>Żeby przerwać pracę i wrócić do niej później, kliknij <strong>„Zapisz plik”</strong> — zapisze się plik Excel na Twoim dysku.</li>
        <li>Wracając do pracy, wczytaj ten plik przyciskiem <strong>„Otwórz plik”</strong> — narzędzie odtworzy cały stan tam, gdzie skończyłeś/aś.</li>
        <li>Ten sam mechanizm służy do kolejnych aktualizacji planu: przy każdej aktualizacji importuj poprzedni plik i pracuj na nim dalej, zamiast zaczynać od nowa.</li>
      </ol>
      <h3>Praca w Diagnozie i Planie działań</h3>
      <ol>
        <li><strong>Diagnoza:</strong> (dla dużej zmiany) uzupełnij PCT, przypisz grupy do ról wobec zmiany i wykonaj oceny ADKAR.</li>
        <li><strong>Plan:</strong> wpisz działania (celuj w {MAX_ACTIONS_PER_CATEGORY} na rolę wobec zmiany) i zaznacz, czy działanie trafiło do harmonogramu projektu.</li>
        <li><strong>Pulpit:</strong> podczas przeglądu aktualizuj statusy działań i reaguj na blokady.</li>
      </ol>

      <h3>Jak utrzymać spojrzenie z lotu ptaka</h3>
      <ol>
        <li><strong>Łącz grupy w segmenty</strong> — rozdzielaj je dopiero, gdy różnią się przekazem, wsparciem, właścicielem lub terminem.</li>
        <li><strong>Projektuj rezultaty, nie listy dla grup</strong> — najpierw jeden wspólny rezultat i wszystkie objęte nim grupy; osobny wariant tylko przy różnym właścicielu, terminie, formie lub przekazie.</li>
        <li><strong>Wymagaj powiązania z projektem</strong> — każde aktywne działanie przypisz do kamienia milowego, etapu albo pracy ciągłej (BAU), i dodaj je do harmonogramu projektu (kluczowe działania też do FlexiProject).</li>
        <li><strong>Planuj krocząco</strong> — horyzont „teraz” opisuj szczegółowo, kolejne okresy utrzymuj ramowo.</li>
        <li><strong>Ogranicz pracę rozpoczętą</strong> — maksymalnie {MAX_WIP_ACTIONS} działań w statusie „W realizacji”. Pozostałe czekają jako „Do zaplanowania”.</li>
      </ol>

      <h3>Co jeszcze jest w toku (otwarte tematy z zespołu)</h3>
      <ul>
        <li>Checklisty dla poziomu 1 i 2 zmiany — w przygotowaniu (Martyna); obecna wersja w zakładce „Checklisty” to zaślepka.</li>
        <li>Nazewnictwo „menedżerowie liniowi” — do ostatecznego uzgodnienia z HR.</li>
      </ul>
    </div>
  );
}
