      <div className="card">
        <h2>Dane projektu</h2>
        <p className="hint">Metryka projektu/programu — punkt wyjścia dla całego planu.</p>
        <div className="grid cols2">
          <Field label="Nazwa projektu/programu"><input type="text" value={project.nazwa} onChange={e=>setField("nazwa", e.target.value)}/></Field>
          <Field label="Typ projektu"><input type="text" value={project.typProjektu} onChange={e=>setField("typProjektu", e.target.value)} placeholder="np. program, projekt, pilotaż"/></Field>
          <Field label="Sponsor"><input type="text" value={project.sponsor} onChange={e=>setField("sponsor", e.target.value)}/></Field>
          <Field label="PM / Lider projektu"><input type="text" value={project.pm} onChange={e=>setField("pm", e.target.value)}/></Field>
          <Field label="CM (Change Manager, jeśli powołany)"><input type="text" value={project.cm} onChange={e=>setField("cm", e.target.value)}/></Field>
          <Field label="Okres realizacji projektu"><input type="text" value={project.okresRealizacji} onChange={e=>setField("okresRealizacji", e.target.value)} placeholder="np. 02.02.2026 – 31.01.2027"/></Field>
          <Field label="Termin przygotowania PZZ"><input type="date" value={project.terminPrzygotowania} onChange={e=>setField("terminPrzygotowania", e.target.value)}/></Field>
          <Field label="Częstotliwość przeglądu PZZ"><input type="text" value={project.czestotliwosc} onChange={e=>setField("czestotliwosc", e.target.value)} placeholder="np. co miesiąc"/></Field>
        </div>
        <p className="hint" style={{marginTop:10}}>Karta projektu nie zawiera Change Managera ani rytmu przeglądu PZZ — te dwa pola zawsze trzeba wpisać ręcznie.</p>
        <h3>Wynik ankiety skali zmiany</h3>
        <div className="flex-between">
          <div>{surveyTotal} / 65 pkt</div>
          <Badge tone={level.color}>{level.complete ? ("Poziom " + level.poziom + " — " + level.label + " · " + level.risk) : level.label}</Badge>
        </div>
        <p className="hint">Uzupełnij ankietę w zakładce „Ankieta — skala zmiany”, żeby zobaczyć pełny wynik.</p>
      </div>

      <div className="card">
        <h2>Kontekst projektu</h2>
        <p className="hint">Tło z karty projektu — pomaga formułować wnioski z diagnozy. Możesz swobodnie edytować.</p>
        <div className="grid cols2">
          <Field label="Nick/symbol"><input type="text" value={project.nick} onChange={e=>setField("nick", e.target.value)} placeholder="np. APR-USOS"/></Field>
          <Field label="Filie objęte projektem"><input type="text" value={project.filie} onChange={e=>setField("filie", e.target.value)}/></Field>
          <Field label="Budżet razem (brutto)"><input type="text" value={project.budzetRazem} onChange={e=>setField("budzetRazem", e.target.value)}/></Field>
          <Field label="Źródło finansowania"><input type="text" value={project.zrodloFinansowania} onChange={e=>setField("zrodloFinansowania", e.target.value)}/></Field>
        </div>
        <Field label="Związek ze strategią"><textarea value={project.zwiazekZeStrategia} onChange={e=>setField("zwiazekZeStrategia", e.target.value)}/></Field>
        <Field label="Powody podjęcia projektu"><textarea value={project.powodyProjektu} onChange={e=>setField("powodyProjektu", e.target.value)}/></Field>
        <Field label="Cel projektu"><textarea value={project.celProjektu} onChange={e=>setField("celProjektu", e.target.value)}/></Field>
        <Field label="Główna korzyść biznesowa"><textarea value={project.glownaKorzysc} onChange={e=>setField("glownaKorzysc", e.target.value)}/></Field>
        <Field label="Wyłączenia (czego projekt NIE obejmuje)"><textarea value={project.wylaczenia} onChange={e=>setField("wylaczenia", e.target.value)}/></Field>
      </div>

      {hasReference && (
        <div className="card">
          <h2>Z karty projektu (referencyjnie)</h2>
          <p className="hint">Kamienie milowe i osoby z zespołu podpowiadają się jako opcje w polach „Kamień milowy/etap” i „Odpowiedzialny” w Planie działań. Reszta to wgląd, bez wpływu na diagnozę czy plan.</p>
          {milestones.length > 0 && (
            <details open>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Kamienie milowe ({milestones.length})</summary>
              <table style={{marginBottom:14}}>
                <thead><tr><th>Kamień milowy</th><th>Termin</th></tr></thead>
                <tbody>{milestones.map(m => <tr key={m.id}><td>{m.nazwa}</td><td>{m.termin}</td></tr>)}</tbody>
              </table>
            </details>
          )}
          {teamMembers.length > 0 && (
            <details>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Skład zespołu ({teamMembers.length})</summary>
              <table style={{marginBottom:14}}>
                <thead><tr><th>Imię i nazwisko</th><th>Dział</th><th>Rola</th></tr></thead>
                <tbody>{teamMembers.map(t => <tr key={t.id}><td>{t.imie}</td><td>{t.dzial}</td><td>{t.rola}</td></tr>)}</tbody>
              </table>
            </details>
          )}
          {risks.length > 0 && (
            <details>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Kluczowe ryzyka projektu ({risks.length})</summary>
              <table style={{marginBottom:14}}>
                <thead><tr><th>Ryzyko</th><th>Sposób zarządzania</th></tr></thead>
                <tbody>{risks.map(r => <tr key={r.id}><td>{r.ryzyko}</td><td>{r.zarzadzanie}</td></tr>)}</tbody>
              </table>
            </details>
          )}
          {deliverables.length > 0 && (
            <details>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Wypracowane produkty ({deliverables.length})</summary>
              <table style={{marginBottom:14}}>
                <thead><tr><th>Produkt</th><th>Wartość</th><th>Termin</th><th>Odbiorca</th></tr></thead>
                <tbody>{deliverables.map(d => <tr key={d.id}><td>{d.produkt}</td><td>{d.wartosc}</td><td>{d.termin}</td><td>{d.odbiorca}</td></tr>)}</tbody>
              </table>
            </details>
          )}
          {budgetItems.length > 0 && (
            <details>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Pozycje budżetowe ({budgetItems.length})</summary>
              <table style={{marginBottom:14}}>
                <thead><tr><th>Pozycja</th><th>Kwota</th></tr></thead>
                <tbody>{budgetItems.map(b => <tr key={b.id}><td>{b.pozycja}</td><td>{b.kwota}</td></tr>)}</tbody>
              </table>
            </details>
          )}
          {links.length > 0 && (
            <details>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Powiązania z innymi projektami ({links.length})</summary>
              <table style={{marginBottom:14}}>
                <thead><tr><th>Projekt</th><th>Zależność</th><th>Współpraca</th></tr></thead>
                <tbody>{links.map(l => <tr key={l.id}><td>{l.projekt}</td><td>{l.zaleznosc}</td><td>{l.wspolpraca}</td></tr>)}</tbody>
              </table>
            </details>
          )}
          {maintenanceCosts.length > 0 && (
            <details>
              <summary style={{cursor:"pointer", fontWeight:600, marginBottom:8}}>Koszty utrzymania po projekcie ({maintenanceCosts.length})</summary>
              <table>
                <thead><tr><th>Rok</th><th>Kategorie kosztów</th><th>Kwota</th></tr></thead>
                <tbody>{maintenanceCosts.map(m => <tr key={m.id}><td>{m.rok}</td><td>{m.kategorie}</td><td>{m.kwota}</td></tr>)}</tbody>
              </table>
            </details>
          )}
        </div>
      )}
    </React.Fragment>
  );
}

function Ankieta({answers, setAnswer, total, level}){
  const answeredCount = Object.values(answers).filter(v => v !== null && v !== undefined && v !== "").length;
  return (
    <div className="card">
      <h2>Ankieta — ocena skali zmiany</h2>
      <p className="hint">Łącznie 65 punktów. 0–25 = mała zmiana (niskie ryzyko), 26–45 = średnia (średnie ryzyko), &gt;45 = duża (wysokie ryzyko). Wynik decyduje, czy korzystasz z pełnego planu (poziom 3), czy z krótszej checklisty (poziom 1–2).</p>

      <h3>Część I — Charakterystyka zmiany</h3>
      {SURVEY.partI.map(q => (
        <div key={q.id} className="flex-between" style={{marginBottom:14}}>
          <div style={{maxWidth:560}}>
            <div>{q.q}</div>
            <div className="hint" style={{margin:0}}>{q.hint}</div>
          </div>
          <Likert value={answers[q.id]} onChange={v=>setAnswer(q.id, v)}/>
        </div>
      ))}

      <h3>Część II — Wpływ zmiany na ludzi</h3>
      <p className="hint">W jakim stopniu zmiana wpłynie na poniższe elementy codziennej pracy? (1 – brak/minimalny wpływ … 5 – bardzo duży wpływ)</p>
      {SURVEY.partII_items.map(it => (
        <div key={it.id} className="flex-between" style={{marginBottom:10}}>
          <div>{it.label}</div>
          <Likert value={answers[it.id]} onChange={v=>setAnswer(it.id, v)}/>
        </div>
      ))}
      <div className="flex-between" style={{marginTop:14, marginBottom:4}}>
        <div style={{maxWidth:560}}>
          <div>{SURVEY.partII_extra.q}</div>
          <div className="hint" style={{margin:0}}>{SURVEY.partII_extra.hint}</div>
        </div>
        <Likert value={answers[SURVEY.partII_extra.id]} onChange={v=>setAnswer(SURVEY.partII_extra.id, v)}/>
      </div>

      <h3>Część III — Kontekst organizacyjny</h3>
      {SURVEY.partIII.map(q => (
        <div key={q.id} className="flex-between" style={{marginBottom:14}}>
          <div style={{maxWidth:560}}>
            <div>{q.q}</div>
            <div className="hint" style={{margin:0}}>{q.hint}</div>
          </div>
          <Likert value={answers[q.id]} onChange={v=>setAnswer(q.id, v)}/>
        </div>
      ))}

      <div className={"banner flex-between " + (level.complete ? "info" : "warn")}>
        <div><strong>{total} / 65 pkt</strong> — {level.complete ? level.label : ("odpowiedziano na " + answeredCount + "/" + SURVEY_QUESTION_COUNT + " pytań")}</div>
        <Badge tone={level.color}>{level.complete ? ("Poziom " + level.poziom + " · " + level.risk) : "W trakcie"}</Badge>
      </div>
    </div>
  );
}

// Głębokość checklisty rośnie z poziomem ryzyka: poziom 1 (mała zmiana) — tylko pytania o
// sponsora; poziom 2 (średnia zmiana) — pełny zestaw poniżej. Poziom 3 nie trafia tu wcale,
// dostaje pełny Plan Zarządzania Zmianą (zakładki Diagnoza / Plan działań).
const CHECKLIST_ITEMS = [
  {key:"sponsor1", group:"Aktywność sponsora", minPoziom:1, text:"Sponsor jest wskazany z imienia i nazwiska oraz wie, czego od niego oczekujemy."},
  {key:"sponsor2", group:"Aktywność sponsora", minPoziom:1, text:"Sponsor publicznie i regularnie komunikuje potrzebę zmiany."},
  {key:"komunikacja1", group:"Komunikowanie zmiany", minPoziom:2, text:"Jest jeden, krótki komunikat wyjaśniający sens zmiany dla osób, których ona dotyczy."},
  {key:"komunikacja2", group:"Komunikowanie zmiany", minPoziom:2, text:"Wiadomo, kto i kiedy przekaże ten komunikat grupom objętym zmianą."},
  {key:"koalicja1", group:"Tworzenie koalicji", minPoziom:2, text:"Zidentyfikowano osoby/role, które powinny wspierać zmianę wobec swoich zespołów."},
  {key:"koalicja2", group:"Tworzenie koalicji", minPoziom:2, text:"Osoby te wiedzą, czego się od nich oczekuje."},
  {key:"managerowie1", group:"Zaangażowanie menedżerów liniowych", minPoziom:2, text:"Menedżerowie liniowi wiedzą, co się zmienia dla ich zespołów."},
  {key:"managerowie2", group:"Zaangażowanie menedżerów liniowych", minPoziom:2, text:"Menedżerowie liniowi mają materiały/argumenty do rozmowy z zespołem o zmianie."},
];

function Checklisty({level, checklist, toggle}){
  const items = CHECKLIST_ITEMS.filter(i => i.minPoziom <= level.poziom);
  const groups = [...new Set(items.map(i=>i.group))];
  return (
    <div className="card">
      <div className="banner warn">
        Ten projekt kwalifikuje się do uproszczonej ścieżki — <strong>Poziom {level.poziom} ({level.label})</strong>. Pełny Plan Zarządzania Zmianą (Diagnoza z PCT i ADKAR + Plan działań) jest przeznaczony dla dużych zmian (poziom 3) i dla tego projektu nie jest pokazywany — jeśli w trakcie pracy okaże się, że zmiana jest większa niż wskazała ankieta, wróć do zakładki „Ankieta” i popraw odpowiedzi.
      </div>
      <h2>Checklista — poziom {level.poziom}</h2>
      <p className="hint">
        {level.poziom === 1
          ? "Mała zmiana — tylko pytania o sponsora."
          : "Średnia zmiana — pełniejszy, ale wciąż uproszczony zestaw pytań."}
        {" "}Wersja robocza (zaślepka). Ostateczną treść checklist dla poziomu 1 i 2 — wraz ze skróconymi pytaniami do rozmowy — przygotowuje Martyna.
      </p>
      {groups.map(g => (
        <div key={g}>
          <h3>{g}</h3>
          <div className="checklist">
            {items.filter(i=>i.group===g).map(i => (
              <label key={i.key} className="cb">
                <input type="checkbox" checked={!!checklist[i.key]} onChange={()=>toggle(i.key)}/>
                <span>{i.text}</span>
              </label>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function Diagnoza({state, pctLatest, pctAvg, pctWeakestKey, setPct, addPctCheckpoint, addGroup, updateGroup, removeGroup, setAdkar, categoryBarrier, adkarRollup, usesOptionalCategory, enableOptionalCategory}){
  const activeCategories = CATEGORIES.concat(usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
  return (
    <React.Fragment>
      <div className="card">
        <h2>1. PCT — kondycja całego przedsięwzięcia</h2>
        <p className="hint">Progi robocze (nie są oficjalnymi progami Prosci): 10–19 = wymaga działania, 20–24 = wymaga uwagi, 25–30 = mocny obszar. Zawsze reaguj na najsłabszy z czterech wyników.</p>
        {state.pctHistory.map((p, idx) => (
          <div key={p.id} className="action-row">
            <div className="grid cols4">
              <Field label="Data"><input type="date" value={p.data} onChange={e=>setPct(idx,"data",e.target.value)}/></Field>
              <Field label="Punkt kontrolny"><input type="text" value={p.punktKontrolny} onChange={e=>setPct(idx,"punktKontrolny",e.target.value)}/></Field>
              <Field label="Definicja sukcesu (1-30)"><input type="number" min="1" max="30" value={p.definicjaSukcesu} onChange={e=>setPct(idx,"definicjaSukcesu",e.target.value)}/></Field>
              <Field label="Przywództwo / sponsoring (1-30)"><input type="number" min="1" max="30" value={p.przywodztwo} onChange={e=>setPct(idx,"przywodztwo",e.target.value)}/></Field>
              <Field label="Zarządzanie projektem (1-30)"><input type="number" min="1" max="30" value={p.zarzadzanieProjektem} onChange={e=>setPct(idx,"zarzadzanieProjektem",e.target.value)}/></Field>
              <Field label="Zarządzanie zmianą (1-30)"><input type="number" min="1" max="30" value={p.zarzadzanieZmiana} onChange={e=>setPct(idx,"zarzadzanieZmiana",e.target.value)}/></Field>
              <Field label="Decyzja / działanie korygujące"><input type="text" value={p.decyzja} onChange={e=>setPct(idx,"decyzja",e.target.value)}/></Field>
              <Field label="Kolejny przegląd"><input type="date" value={p.kolejnyPrzeglad} onChange={e=>setPct(idx,"kolejnyPrzeglad",e.target.value)}/></Field>
            </div>
          </div>
        ))}
        <button className="small" onClick={addPctCheckpoint}>+ Kolejny pomiar</button>
        <div className="banner info flex-between" style={{marginTop:14}}>
          <div>Średnia ostatniego pomiaru: <strong>{pctAvg!=null ? pctAvg.toFixed(1) : "–"}</strong>{pctWeakestKey ? (" · Najsłabszy obszar: " + pctWeakestKey) : ""}</div>
          <Badge tone={pctTone(pctAvg)}>{PCT_TONE_LABELS[pctTone(pctAvg)]}</Badge>
        </div>
      </div>

      <div className="card">
        <div className="flex-between">
          <h2 style={{margin:0}}>2. Grupy objęte zmianą</h2>
          <button className="small" onClick={addGroup}>+ Dodaj grupę</button>
        </div>
        <p className="hint">Wpisz grupy osób, których charakter lub sposób pracy może ulec zmianie, i przypisz każdą do jednej z kategorii.</p>
        {state.groups.some(g => !g.categoryId) && (
          <div className="banner warn">
            {state.groups.filter(g => !g.categoryId).length} grup(y) bez przypisanej kategorii — dopóki jej nie wybierzesz,
            grupa nie trafi do diagnozy ADKAR ani do Planu działań.
          </div>
        )}
        <table>
          <thead><tr><th>Grupa</th><th>Co zmienia się w ich pracy?</th><th>Kategoria</th><th></th></tr></thead>
          <tbody>
            {state.groups.map(g => (
              <tr key={g.id}>
                <td><input type="text" value={g.nazwa} onChange={e=>updateGroup(g.id,"nazwa",e.target.value)}/></td>
                <td><input type="text" value={g.wplyw} onChange={e=>updateGroup(g.id,"wplyw",e.target.value)}/></td>
                <td>
                  <select value={g.categoryId} onChange={e=>updateGroup(g.id,"categoryId",e.target.value)}>
                    <option value="">— wybierz kategorię —</option>
                    {activeCategories.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </td>
                <td><button className="small" onClick={()=>removeGroup(g.id)}>Usuń</button></td>
              </tr>
            ))}
            {state.groups.length===0 && <tr><td colSpan="4" className="muted">Brak grup — kliknij „Dodaj grupę”.</td></tr>}
          </tbody>
        </table>
        {!usesOptionalCategory && (
          <button className="small" style={{marginTop:10}} onClick={enableOptionalCategory}>+ Włącz kategorię „Klienci / studenci” (opcjonalnie)</button>
        )}
      </div>

      <div className="card">
        <h2>3. Ocena ADKAR dla każdej kategorii</h2>
        <p className="hint">Oceń każdą kategorię w skali 1–5. 1–2 oznacza istotną barierę, 3 wymaga uwagi, 4–5 to dobra gotowość.</p>
        {activeCategories.map(c => {
          const d = state.adkarByCategory[c.id];
          const barrier = categoryBarrier(c.id);
          const catGroups = state.groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
          return (
            <div key={c.id} className="action-row">
              <div className="top">
                <strong>{c.label}</strong>
                {barrier && <Badge tone="orange">Największa bariera: {barrier.label}</Badge>}
              </div>
              {catGroups.length>0 && <div className="pill-list" style={{marginBottom:10}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
              <div className="grid cols2">
                <div>
                  {ADKAR_DIMS.map(dim => (
                    <div key={dim.id} className="flex-between" style={{marginBottom:8}}>
                      <div style={{fontSize:12.5}}>{dim.label}<div className="muted" style={{fontSize:11}}>{dim.sub}</div></div>
                      <Likert value={d[dim.id]} onChange={v=>setAdkar(c.id, dim.id, v)}/>
                    </div>
                  ))}
                </div>
                <div>
                  <Field label="Wniosek / co trzeba osiągnąć">
                    <textarea value={d.wniosek} onChange={e=>setAdkar(c.id,"wniosek",e.target.value)} placeholder="Opisz własnymi słowami, co trzeba osiągnąć w tej kategorii."/>
                  </Field>
                  {barrier && (
                    <p className="hint">Podpowiedź dla bariery „{barrier.label}”: {ADKAR_SUGGESTIONS[barrier.id]}</p>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <h2>4. ADKAR — szybki skan</h2>
        <p className="hint">Liczy się automatycznie z ocen powyżej.</p>
        {adkarRollup.map(r => (
          <div key={r.id} style={{marginBottom:14}}>
            <Bar label={r.label} value={r.avg} max={5}/>
            <div className="hint" style={{margin:"2px 0 0 160px"}}>
              {r.min!=null ? ("min " + r.min + " · ") : ""}
              {r.atRiskCount>0 ? (r.atRiskCount + " kateg. z oceną ≤2 (" + r.atRisk.join(", ") + ")") : "brak kategorii w ryzyku"}
              {" · "}{r.suggestion}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function PlanDzialan({actionsByCategory, categoryBarrier, adkarByCategory, groups, addAction, updateAction, removeAction, usesOptionalCategory, milestones, teamMembers}){
  const activeCategories = CATEGORIES.concat(usesOptionalCategory ? [OPTIONAL_CATEGORY] : []);
  return (
    <div className="card">
      <h2>Plan działań</h2>
      <p className="hint">Plan na poziomie kategorii — maksymalnie {MAX_ACTIONS_PER_CATEGORY} działania na kategorię. Wpisuj własne, konkretne działania (bez gotowych podpowiedzi) i od razu dodaj kanały komunikacji w tym samym wierszu.</p>
      {activeCategories.map(c => {
        const actions = actionsByCategory[c.id] || [];
        const barrier = categoryBarrier(c.id);
        const wniosek = adkarByCategory[c.id]?.wniosek;
        const catGroups = groups.filter(g=>g.categoryId===c.id).map(g=>g.nazwa).filter(Boolean);
        const atLimit = actions.length >= MAX_ACTIONS_PER_CATEGORY;
        return (
          <div key={c.id} style={{marginBottom:22}}>
            <div className="flex-between">
              <div>
                <strong>{c.label}</strong>
                {barrier && <span className="tag" style={{marginLeft:8}}>bariera: {barrier.label}</span>}
              </div>
              <button className="small" disabled={atLimit} onClick={()=>addAction(c.id)}>+ Dodaj działanie ({actions.length}/{MAX_ACTIONS_PER_CATEGORY})</button>
            </div>
            {catGroups.length>0 && <div className="pill-list" style={{margin:"6px 0"}}>{catGroups.map(g=><span key={g} className="pill">{g}</span>)}</div>}
            {wniosek && <p className="hint" style={{margin:"4px 0 10px"}}>Wniosek z diagnozy: {wniosek}</p>}
            {atLimit && <div className="banner warn">Limit {MAX_ACTIONS_PER_CATEGORY} działań na kategorię. Rozważ połączenie działań lub rozbicie na etapy w ramach istniejących wierszy, zamiast dodawać kolejne.</div>}

            {actions.map(a => (
              <div key={a.id} className="action-row">
                <div className="top">
                  <span className="muted">Działanie</span>
                  <button className="small" onClick={()=>removeAction(a.id)}>Usuń</button>
                </div>
                <div className="grid cols2">
                  <Field label="Działanie"><textarea value={a.dzialanie} onChange={e=>updateAction(a.id,"dzialanie",e.target.value)} placeholder="Co konkretnie zrobimy?"/></Field>
                  <Field label="Jak sprawdzimy gotowość?"><textarea value={a.weryfikacja} onChange={e=>updateAction(a.id,"weryfikacja",e.target.value)} placeholder="Po czym poznamy, że grupa osiągnęła gotowość?"/></Field>
                </div>
                <div className="grid cols3">
                  <Field label="Kamień milowy / etap"><input type="text" list="milestones-dl" value={a.kamien} onChange={e=>updateAction(a.id,"kamien",e.target.value)}/></Field>
                  <Field label="Termin"><input type="date" value={a.termin} onChange={e=>updateAction(a.id,"termin",e.target.value)}/></Field>
                  <Field label="Odpowiedzialny"><input type="text" list="team-dl" value={a.odpowiedzialny} onChange={e=>updateAction(a.id,"odpowiedzialny",e.target.value)}/></Field>
                </div>
                <div className="grid cols3">
                  <Field label="Kanały komunikacji (oddziel przecinkami)">
                    <input type="text" list="channels-dl" value={a.kanaly} onChange={e=>updateAction(a.id,"kanaly",e.target.value)} placeholder="np. mail, Teams, spotkanie"/>
                  </Field>
                  <Field label="Zadanie w Flexi (nr / link)"><input type="text" value={a.flexiRef} onChange={e=>updateAction(a.id,"flexiRef",e.target.value)} placeholder="np. FLEXI-123"/></Field>
                  <Field label="Status">
                    <select value={a.status} onChange={e=>updateAction(a.id,"status",e.target.value)}>
                      {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </Field>
                </div>
              </div>
            ))}
            {actions.length===0 && <p className="muted">Brak działań w tej kategorii.</p>}
          </div>
        );
      })}
      <datalist id="channels-dl">
        {CHANNEL_SUGGESTIONS.map(c => <option key={c} value={c}/>)}
      </datalist>
      <datalist id="milestones-dl">
        {milestones.map(m => <option key={m.id} value={m.nazwa}/>)}
      </datalist>
      <datalist id="team-dl">
        {teamMembers.map(t => <option key={t.id} value={t.imie}/>)}
      </datalist>
    </div>
  );
}

function Pulpit({project, level, surveyTotal, pctAvg, pctWeakestKey, statusCounts, signals, goTo}){
  const wipOver = statusCounts["W realizacji"] > MAX_WIP_ACTIONS;
  return (
    <React.Fragment>
      <div className="card">
        <h2>Kontekst</h2>
        <div className="grid cols3">
          <div><div className="muted">Projekt / program</div><div>{project.nazwa || "–"}</div></div>
          <div><div className="muted">Sponsor</div><div>{project.sponsor || "–"}</div></div>
          <div><div className="muted">Typ projektu</div><div>{project.typProjektu || "–"}</div></div>
          <div><div className="muted">Skala zmiany</div><div><Badge tone={level.color}>{level.complete ? (surveyTotal + " pkt — poziom " + level.poziom) : "ankieta nieukończona"}</Badge></div></div>
          <div><div className="muted">PCT — średnia</div><div><Badge tone={pctTone(pctAvg)}>{pctAvg!=null?pctAvg.toFixed(1):"brak danych"}</Badge></div></div>
          <div><div className="muted">PCT — najsłabszy obszar</div><div>{pctWeakestKey || "–"}</div></div>
        </div>
      </div>

      <div className="card">
        <h2>Pulpit planu działań</h2>
        <div className="grid cols4">
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.all}</div><div className="muted">wszystkie</div></div>
          <div className="action-row" style={{textAlign:"center"}}>
            <div style={{fontSize:24, fontWeight:700, color: wipOver?"var(--red)":"inherit"}}>{statusCounts["W realizacji"]}</div>
            <div className="muted">w realizacji {wipOver ? "(limit " + MAX_WIP_ACTIONS + "!)" : ""}</div>
          </div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts["Zablokowane"]}</div><div className="muted">zablokowane</div></div>
          <div className="action-row" style={{textAlign:"center"}}><div style={{fontSize:24, fontWeight:700}}>{statusCounts.linkedToFlexi}</div><div className="muted">powiązane z Flexi</div></div>
        </div>
        <p className="hint">Zasada WIP: maksymalnie {MAX_WIP_ACTIONS} działań ze statusem „W realizacji” jednocześnie — pozostałe czekają jako „Do zaplanowania”.</p>
      </div>

      <div className="card">
        <h2>Sygnały do decyzji</h2>
        <table>
          <tbody>
            <tr><td>Brak odpowiedzialnego</td><td><Badge tone={signals.brakOdpowiedzialnego>0?"orange":"green"}>{signals.brakOdpowiedzialnego}</Badge></td></tr>
            <tr><td>Brak terminu / kamienia milowego</td><td><Badge tone={signals.brakTerminu>0?"orange":"green"}>{signals.brakTerminu}</Badge></td></tr>
            <tr><td>Zablokowane</td><td><Badge tone={signals.zablokowane>0?"red":"green"}>{signals.zablokowane}</Badge></td></tr>
          </tbody>
        </table>
      </div>

      <div className="card">
        <p className="hint" style={{margin:0}}>Pełny opis sposobu pracy z PZZ — zakładka <a href="#" onClick={(e)=>{e.preventDefault(); goTo("przewodnik");}}>Przewodnik</a>.</p>
      </div>
    </React.Fragment>
  );
}

function Przewodnik(){
  return (
    <div className="card">
      <h2>Jak pracować z PZZ</h2>
      <p className="hint">
        Wszystko zaczyna się od zakładki <strong>Ankieta — skala zmiany</strong>. Dopóki nie odpowiesz na
        wszystkie 13 pytań, narzędzie nie wie, jak duża jest zmiana, i nie pokazuje żadnej dalszej ścieżki.
        Po ukończeniu ankiety pojawia się jedna z dwóch ścieżek — nigdy obie naraz:
      </p>
      <ul>
        <li><strong>Poziom 1–2 (mała/średnia zmiana):</strong> zakładka „Checklisty” — krótka lista pytań, bez PCT i ADKAR.</li>
        <li><strong>Poziom 3 (duża zmiana):</strong> zakładki „Diagnoza”, „Plan działań” i „Pulpit” — pełny PZZ z PCT i ADKAR.</li>
      </ul>
      <p className="hint">Jeśli w trakcie pracy okaże się, że zmiana jest inna niż na starcie, wróć do „Ankiety” i zmień odpowiedzi — ścieżka przełączy się automatycznie.</p>
      <h3>Praca na pełnej ścieżce (poziom 3)</h3>
      <ol>
        <li><strong>Diagnoza:</strong> uzupełnij PCT, przypisz grupy do kategorii i wykonaj oceny ADKAR.</li>
        <li><strong>Plan:</strong> wpisz działania (max {MAX_ACTIONS_PER_CATEGORY}/kategorię), sposób sprawdzenia gotowości i kanały komunikacji.</li>
        <li><strong>Pulpit:</strong> podczas przeglądu aktualizuj statusy działań i reaguj na blokady.</li>
      </ol>

      <h3>Jak utrzymać spojrzenie z lotu ptaka</h3>
      <ol>
        <li><strong>Łącz grupy w segmenty</strong> — rozdzielaj je dopiero, gdy różnią się przekazem, wsparciem, właścicielem lub terminem.</li>
        <li><strong>Projektuj rezultaty, nie listy dla grup</strong> — najpierw jeden wspólny rezultat i wszystkie objęte nim grupy; osobny wariant tylko przy różnym właścicielu, terminie, formie lub przekazie.</li>
        <li><strong>Wymagaj powiązania z projektem</strong> — każde aktywne działanie przypisz do kamienia milowego, etapu albo pracy ciągłej (BAU), i jeśli możliwe — do zadania w Flexi.</li>
        <li><strong>Planuj krocząco</strong> — horyzont „teraz” opisuj szczegółowo, kolejne okresy utrzymuj ramowo.</li>
        <li><strong>Ogranicz pracę rozpoczętą</strong> — maksymalnie {MAX_WIP_ACTIONS} działań w statusie „W realizacji”. Pozostałe czekają jako „Do zaplanowania”.</li>
      </ol>

      <h3>Co jeszcze jest w toku (otwarte tematy z zespołu)</h3>
      <ul>
        <li>Checklisty dla poziomu 1 i 2 zmiany — w przygotowaniu (Martyna); obecna wersja w zakładce „Checklisty” to zaślepka.</li>
        <li>Kategoria „Klienci / studenci” — opcjonalna, do przetestowania na żywym projekcie.</li>
        <li>Nazewnictwo „menedżerowie liniowi” — do ostatecznego uzgodnienia z HR.</li>
      </ul>
    </div>
  );
}
