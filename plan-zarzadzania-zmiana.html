<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zarządzania zmianą (PZZ) — Grupa Merito</title>
<meta name="description" content="Uproszczony Plan Zarządzania Zmianą wg szablonu Grupy Merito.">
<meta name="theme-color" content="#141E50">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141E50; --ink-soft:#4A5278; --paper:#f0f2f5; --card:#ffffff;
    --line:#dde0ea; --muted:#4A5278; --accent:#006EFA; --accent-soft:#e7f1ff; --accent2:#BABDCC;
    --red:#9c261e; --red-bg:#fdeceb; --orange:#8a4f00; --orange-bg:#fdf0dc;
    --green:#1a5c33; --green-bg:#e7f5ec;
  }
  *{box-sizing:border-box;}
  body{margin:0;font:16px/1.55 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);}
  header.app{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
  .brand-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand-badge{display:inline-flex;align-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px;border-radius:20px;white-space:nowrap;}
  header.app h1{font-size:19px;margin:0;font-weight:900;}
  header.app .sub{font-size:14px;opacity:.9;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{font:inherit;font-size:15px;cursor:pointer;border-radius:7px;border:1.5px solid var(--line);background:var(--card);padding:9px 14px;color:var(--ink);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.small{padding:6px 11px;font-size:14px;}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;background:var(--paper);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);}
  nav.tabs button{border:none;background:transparent;padding:11px 15px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;font-size:15px;}
  nav.tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset;}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,80,.06);}
  .card h2{margin:0 0 4px;font-size:19px;font-weight:900;color:var(--ink);}
  .card h3{margin:20px 0 10px;font-size:14.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;}
  .card p.hint{color:var(--muted);font-size:14.5px;margin:2px 0 14px;}
  .grid{display:grid;gap:14px;}
  .grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .grid.cols4{grid-template-columns:repeat(4,minmax(0,1fr));}
  @media (max-width:700px){.grid.cols2,.grid.cols3,.grid.cols4{grid-template-columns:1fr;}}
  label{display:block;font-size:14.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:7px;font:inherit;font-size:15.5px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:56px;}
  .field{margin-bottom:12px;}
  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:13.5px;font-weight:700;}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .badge.orange{background:var(--orange-bg);color:var(--orange);}
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.gray{background:#e4e7ea;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:15px;}
  table th,table td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;vertical-align:top;}
  table th{color:var(--ink);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.02em;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
  .bar-row .label{width:150px;font-size:14.5px;flex:none;}
  .bar-track{flex:1;height:10px;background:#e4e7ea;border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-val{width:26px;text-align:right;font-size:14px;color:var(--muted);flex:none;}
  .pill-list{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{background:var(--accent-soft);color:var(--accent);padding:4px 11px;border-radius:20px;font-size:14px;font-weight:600;}
  .banner{border-radius:9px;padding:13px 17px;font-size:15px;margin-bottom:14px;}
  .banner.info{background:var(--accent-soft);color:var(--ink-soft);}
  .banner.warn{background:var(--orange-bg);color:var(--orange);}
  .action-row{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px;background:#fbfcfc;}
  .action-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .muted{color:var(--muted);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .checklist label.cb{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;color:var(--ink);margin-bottom:10px;cursor:pointer;}
  .checklist input[type=checkbox]{margin-top:3px;width:19px;height:19px;}
  footer.app{text-align:center;color:var(--muted);font-size:13.5px;padding:20px;}
  .tag{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);font-weight:600;}
  .versions-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .versions-list .row{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);font-size:15px;}
  .versions-list .row:last-child{border-bottom:none;}
  dialog{border:none;border-radius:10px;padding:0;max-width:520px;width:92vw;}
  dialog .inner{padding:20px;}
  dialog::backdrop{background:rgba(15,32,39,.45);}
</style>

<script type="text/plain" id="app-source">
const {useState, useMemo, useEffect, useRef} = React;

/* ---------- Model referencyjny (zgodny z arkuszem PZZ Grupy Merito) ---------- */

// "Kategoria" w interfejsie/eksporcie nazywa się teraz "rola wobec zmiany" (zespół uznał samo
// słowo "kategoria" za mylące) — identyfikatory w kodzie (CATEGORIES, categoryId, adkarByCategory,
// categoryBarrier) zostają bez zmian, żeby nie psuć zgodności zapisanych plików. "Klienci" była
// piątą, opcjonalną rolą "do przetestowania" — zespół zdecydował, że zostaje na stałe, więc jest
// tu razem z resztą (bez osobnego `OPTIONAL_CATEGORY`/przełącznika `usesOptionalCategory`).
// `oldLabel` na wpisie klienci to poprzednie brzmienie etykiety — re-import starszego pliku, w
// którym grupa ma przypisaną tę starą etykietę, ma ją nadal rozpoznać (patrz findCategoryByLabel).
const CATEGORIES = [
  {id:"kierunek", label:"Nadają kierunek i usuwają bariery",
    hint:"Osoby podejmujące kluczowe decyzje, nadające priorytet przedsięwzięciu oraz usuwające przeszkody organizacyjne. Przykłady: sponsor projektu, zarząd, rektor, kanclerz, dyrektor jednostki."},
  {id:"przelozeni", label:"Bezpośredni przełożeni — usuwają bariery i/lub sami zmieniają nawyki",
    hint:"Kierownicy wspierający swoich pracowników w przejściu przez zmianę oraz często sami pracujący w nowy sposób. Przykłady: kierownicy działów, dziekani, menedżerowie zespołów, koordynatorzy."},
  {id:"nowezasady", label:"Pracują według nowych zasad",
    hint:"Główni odbiorcy zmiany, których codzienna praca ulegnie zmianie. Przykłady: pracownicy administracyjni, dydaktyczni, specjaliści, użytkownicy nowego systemu lub procesu."},
  {id:"wdrozenie", label:"Przygotowują i wspierają wdrożenie",
    hint:"Osoby zaangażowane w realizację przedsięwzięcia i wsparcie wdrożenia. Przykłady: PM, PMO, HR, pracownicy IT, właściciel produktu, dostawcy."},
  {id:"klienci", label:"Klienci (zewnętrzni odbiorcy zmiany)",
    oldLabel:"Klienci / studenci (zewnętrzni odbiorcy zmiany) — opcjonalna, do przetestowania",
    hint:"Osoby spoza zespołu projektowego, które odczują skutki zmiany lub będą korzystać z jej rezultatów. Przykłady: studenci, kandydaci, partnerzy biznesowi."},
];
function findCategoryByLabel(label){
  return CATEGORIES.find(c => c.label === label || c.oldLabel === label);
}
const MAX_ACTIONS_PER_CATEGORY = 3;
const MAX_WIP_ACTIONS = 5;

const ADKAR_DIMS = [
  {id:"awareness", label:"Awareness", sub:"świadomość potrzeby zmiany"},
  {id:"desire", label:"Desire", sub:"chęć wspierania i uczestnictwa w zmianie"},
  {id:"knowledge", label:"Knowledge", sub:"wiedza, jak pracować w nowy sposób"},
  {id:"ability", label:"Ability", sub:"praktyczne umiejętności pracy w nowy sposób"},
  {id:"reinforcement", label:"Reinforcement", sub:"trwałe stosowanie nowego sposobu pracy"},
];
const ADKAR_SUGGESTIONS = {
  awareness: "Zaplanuj wspólny rezultat wyjaśniający sens i rolę w zmianie.",
  desire: "Pokaż korzyści, daj wpływ i uruchom widoczne sponsorstwo.",
  knowledge: "Zapewnij wspólną bazę wiedzy z modułami dla różnych ról.",
  ability: "Dodaj ćwiczenia, testy i wsparcie w rzeczywistej pracy.",
  reinforcement: "Ustal właścicieli, pomiary, przeglądy i sposób reagowania na powrót do starych praktyk.",
};
// Wyjaśnienie bariery jako opis zjawiska (nie warunek do spełnienia) — zdanie już zawiera nazwę
// bariery, więc w UI stoi samodzielnie, bez osobnego pogrubionego nagłówka z tą samą nazwą.
const ADKAR_BARRIER_INTRO = {
  awareness: "Bariera Awareness występuje, gdy ludzie nie rozumieją, dlaczego zmiana jest potrzebna.",
  desire: "Bariera Desire występuje, gdy ludzie wiedzą, dlaczego zmiana jest potrzebna, ale jej nie chcą.",
  knowledge: "Bariera Knowledge występuje, gdy ludzie chcą zmiany, ale nie wiedzą, jak ją wprowadzić.",
  ability: "Bariera Ability występuje, gdy ludzie mają wiedzę, ale nie potrafią zastosować jej w praktyce.",
  reinforcement: "Bariera Reinforcement występuje, gdy ludzie pracują już w nowy sposób, ale mogą wrócić do starych nawyków.",
};
// Pełna lista przykładów — do wglądu przy planowaniu działań (nie w ADKAR, tam wystarczy sama
// bariera i jej wyjaśnienie). ADKAR_EXAMPLES_SHORT to 5 konkretnych, gotowych do wpisania do
// harmonogramu pozycji pokazywanych domyślnie; ADKAR_EXAMPLES (ta sama treść co wcześniej) to
// pełna, dłuższa lista pod „Potrzebujesz więcej pomysłów?” — docelową, obszerniejszą listę
// przygotowują Martyna i Izabela.
const ADKAR_EXAMPLES_SHORT = {
  awareness: ["spotkanie informacyjne o powodach zmiany", "mailing do pracowników o zmianie", "krótka prezentacja na spotkaniu zespołu", "komunikat sponsora do objętych zmianą", "sesja pytań i odpowiedzi z zespołem projektowym"],
  desire: ["warsztat dla kierowników o korzyściach zmiany", "indywidualna rozmowa z osobą zgłaszającą opór", "wystąpienie ambasadora zmiany", "prezentacja korzyści dopasowana do grupy", "konsultacje robocze z przedstawicielami grupy"],
  knowledge: ["instrukcja krok po kroku dla nowego procesu", "krótki film instruktażowy", "szkolenie dla użytkowników", "FAQ z najczęstszymi pytaniami", "materiał wprowadzający dla menedżerów"],
  ability: ["warsztat praktyczny na rzeczywistych przykładach", "dyżur eksperta w pierwszym tygodniu", "sesja mentoringowa dla nowych użytkowników", "test na środowisku szkoleniowym przed startem", "wsparcie on-the-job w pierwszych dniach"],
  reinforcement: ["przegląd wskaźników wykorzystania po miesiącu", "przypomnienie mailowe o nowych zasadach", "aktualizacja procedury o nowe zasady", "krótkie podsumowanie efektów dla zespołu", "wyróżnienie osoby dobrze stosującej nowy sposób pracy"],
};
const ADKAR_EXAMPLES = {
  awareness: ["komunikacja powodów zmiany", "prezentacja korzyści", "spotkania informacyjne dla pracowników", "udział sponsora w rozmowach z kluczowymi grupami"],
  desire: ["zaangażowanie przedstawicieli grup w projektowanie rozwiązania", "indywidualne rozmowy z osobami stawiającymi największy opór", "identyfikacja i adresowanie obaw", "pokazanie korzyści dla konkretnych grup", "wykorzystanie ambasadorów zmiany"],
  knowledge: ["instrukcje krok po kroku", "baza wiedzy lub FAQ", "krótkie filmy instruktażowe", "webinary i sesje pytań i odpowiedzi", "checklisty dla użytkowników", "materiały dla menedżerów", "szkolenia"],
  ability: ["ćwiczenia na rzeczywistych przypadkach", "okres wsparcia po uruchomieniu rozwiązania", "dyżury ekspertów", "mentoring lub coaching"],
  reinforcement: ["uwzględnienie nowych zasad w procedurach", "monitorowanie wskaźników wykorzystania rozwiązania", "przeglądy po wdrożeniu", "regularne przypomnienia dla użytkowników", "omówienie efektów osiągniętych dzięki zmianie", "nagradzanie dobrych praktyk"],
};

// Opisy i przykładowe wpisy per obszar PCT — pokazywane automatycznie przy najsłabszym obszarze
// (uwagi zespołu: "w pierwszej kolejności... wskazówkę czym trzeba się zająć").
const PCT_AREAS = [
  {key:"definicjaSukcesu", label:"Definicja sukcesu",
    recommendation:"Upewnij się, że cele, korzyści i mierniki sukcesu są jednoznacznie określone oraz zrozumiałe dla kluczowych interesariuszy.",
    example:"Doprecyzowanie mierników sukcesu i uzgodnienie wartości docelowych ze Sponsorem."},
  {key:"przywodztwo", label:"Przywództwo / sponsoring",
    recommendation:"Zwiększ widoczność i zaangażowanie sponsora — regularna komunikacja, udział w kluczowych decyzjach i spotkaniach statusowych.",
    example:"Comiesięczne komunikaty Sponsora do kierowników jednostek oraz udział Sponsora w spotkaniach statusowych."},
  {key:"zarzadzanieProjektem", label:"Zarządzanie projektem",
    recommendation:"Sprawdź, czy zakres, harmonogram i ryzyka są aktualne i mają przypisanych właścicieli.",
    example:"Aktualizacja harmonogramu, przypisanie właścicieli działań i przegląd ryzyk."},
  {key:"zarzadzanieZmiana", label:"Zarządzanie zmianą",
    recommendation:"W pierwszej kolejności zaplanuj działania wspierające wykorzystanie rezultatów projektu w codziennej pracy, np. komunikację, szkolenia, wsparcie menedżerów lub dostosowanie procesów.",
    example:"Opracowanie planu komunikacji oraz spotkań informacyjnych dla grup objętych zmianą."},
];

// Zwraca WSZYSTKIE obszary PCT związane najniższym wynikiem w danym pomiarze (remis = kilka
// obszarów do zaadresowania w pierwszej kolejności, nie tylko jeden) — używane zarówno dla
// zagregowanego "ostatniego pomiaru" w pulpicie/nagłówku, jak i osobno dla każdego wiersza
// historii PCT w Diagnozie.
function computeWeakestPctAreas(row){
  if (!row) return [];
  let worstVal = Infinity;
  PCT_AREAS.forEach(a => {
    const v = row[a.key];
    if (v !== "" && v != null && Number(v) < worstVal) worstVal = Number(v);
  });
  if (worstVal === Infinity) return [];
  return PCT_AREAS.filter(a => {
    const v = row[a.key];
    return v !== "" && v != null && Number(v) === worstVal;
  }).map(a => ({...a, value: worstVal}));
}

// Pytania do oceny PCT (poziom 3, pełna) — 6 pytań na obszar, odpowiedź w skali Likerta 1-5
// (komponent <Likert>, ten sam co w Ankiecie). Konkretne, sprawdzalne fakty ("czy sponsor jest
// wskazany z imienia i nazwiska?"), nie abstrakcyjne oceny dojrzałości — żeby PM bez wiedzy
// o zarządzaniu zmianą wiedział, jak odpowiedzieć.
const PCT_QUESTIONS = {
  definicjaSukcesu: [
    "Czy dla projektu określono cele, które da się jednoznacznie sprawdzić po jego zakończeniu?",
    "Czy określono konkretne korzyści biznesowe, które projekt ma przynieść?",
    "Czy dla korzyści biznesowych określono mierniki z wartościami docelowymi (liczba, %, termin)?",
    "Czy sponsor potwierdził, że zgadza się z tak zdefiniowanymi celami i miernikami?",
    "Czy w definicji sukcesu uwzględniono nie tylko dostarczenie produktów projektu, ale też ich faktyczne wykorzystanie po zakończeniu?",
    "Czy osoby, których dotyczy zmiana, wiedzą, jak będzie wyglądał sukces tego projektu?",
  ],
  przywodztwo: [
    "Czy sponsor projektu jest wskazany z imienia i nazwiska?",
    "Czy sponsor osobiście komunikował potrzebę tej zmiany (spotkanie, mail, nagranie)?",
    "Czy sponsor uczestniczył w podjęciu kluczowych decyzji dotyczących projektu w ciągu ostatnich 3 miesięcy?",
    "Czy oprócz sponsora są inni menedżerowie/liderzy, którzy publicznie popierają tę zmianę?",
    "Czy sponsor jest dostępny dla zespołu projektowego, gdy potrzebna jest jego decyzja lub interwencja?",
    "Czy kierownictwo wyższego szczebla konsekwentnie przekazuje ten sam komunikat o zmianie (bez sprzecznych sygnałów)?",
  ],
  zarzadzanieProjektem: [
    "Czy zakres projektu jest spisany i aktualny?",
    "Czy istnieje aktualny harmonogram z konkretnymi terminami kamieni milowych?",
    "Czy ryzyka projektu są spisane i każde ma przypisaną osobę odpowiedzialną?",
    "Czy budżet projektu jest znany i śledzony na bieżąco (plan vs. wykonanie)?",
    "Czy każdy członek zespołu projektowego wie, za co dokładnie odpowiada?",
    "Czy postępy projektu są raportowane do sponsora co najmniej raz w miesiącu?",
  ],
  zarzadzanieZmiana: [
    "Czy spisano listę grup/osób, których sposób pracy zmieni się w wyniku projektu?",
    "Czy dla każdej z tych grup określono, na czym konkretnie polega zmiana w ich pracy?",
    "Czy istnieje plan komunikacji do tych grup (co, kiedy i kto komunikuje)?",
    "Czy zaplanowano konkretne szkolenia lub wsparcie potrzebne do pracy w nowy sposób?",
    "Czy sprawdzono, u kogo można się spodziewać oporu wobec zmiany i co z tym zrobić?",
    "Czy zaplanowano działania, które utrzymają nowy sposób pracy po zakończeniu projektu (np. kontrola po 3-6 miesiącach)?",
  ],
};

// Legenda skali pokazywana nad zestawem pytań PCT — bez niej "3" nie ma wspólnego znaczenia
// między osobami oceniającymi ani między kolejnymi przeglądami w czasie.
const LIKERT_SCALE_LEGEND = "Odpowiadaj w skali 1–5: 1 – nie/w ogóle, 2 – w niewielkim stopniu, 3 – częściowo, 4 – w dużym stopniu, 5 – tak, w pełni.";
const LIKERT_SCALE_LABELS = ["1 – nie/w ogóle", "2 – w niewielkim stopniu", "3 – częściowo", "4 – w dużym stopniu", "5 – tak, w pełni"];

function emptyPctAnswers(){
  const o = {};
  PCT_AREAS.forEach(a => { o[a.key] = PCT_QUESTIONS[a.key].map(()=>null); });
  return o;
}
// Wynik obszaru = suma 6 odpowiedzi (1-5 każda) — mieści się w skali 1-30 (6 pytań x maks. 5),
// więc pctTone/computeWeakestPctAreas/wykres działają na tej samej skali bez przeliczeń. Wynik
// obszaru pojawia się dopiero, gdy WSZYSTKIE jego pytania mają odpowiedź (tak jak dawniej pole
// liczbowe było puste albo wypełnione w całości).
function pctAreaScore(answers, questionCount){
  if (!answers || answers.length !== questionCount) return null;
  if (answers.some(v => v == null || v === "")) return null;
  const raw = answers.reduce((a,b)=>a+Number(b), 0);
  return raw * (30 / (questionCount * 5));
}
function pctScores(row){
  const scores = {};
  PCT_AREAS.forEach(a => { scores[a.key] = pctAreaScore(row && row.answers && row.answers[a.key], PCT_QUESTIONS[a.key].length); });
  return scores;
}

const XLS_NAVY = "FF141E50";

const XLS_LIGHT_FILL = "FFEAF1FE";

function xlsTitleRow(ws, values){

function xlsSectionRow(ws, values){

  row.eachCell(c => { c.border = {bottom:{style:"medium", color:{argb:XLS_BLUE}}}; });

function xlsHeaderRow(ws, values){

// Czyta z powrotem listę wierszy zapisaną przez xlsSectionRow+xlsHeaderRow+xlsDataRow: znajduje
// wiersz-tytuł sekcji (dokładne dopasowanie pierwszej komórki), pomija wiersz nagłówka kolumn
// tuż pod nim, i zbiera kolejne wiersze aż do pierwszego pustego (separator sekcji) albo końca
// arkusza. `mapper` dostaje surowy wiersz (tablicę komórek) i zwraca obiekt do stanu aplikacji.
function xlsReadSection(rows, title, mapper){
  const idx = rows.findIndex(r => (r[0]||"").toString().trim() === title);
  if (idx === -1) return [];
  const items = [];
  for (let i = idx + 2; i < rows.length; i++){
    const r = rows[i];
    if (!r[0] && !r[1]) break;
    items.push(mapper(r));
  }
  return items;
}

// — pusta pozycja (nieodpowiedziane pytanie) zostaje pusta, nie znika, żeby indeksy pytań się nie
// przesunęły przy odczycie.
function serializeAnswers(arr){
  return (arr||[]).map(v => v==null ? "" : v).join(",");
}
function deserializeAnswers(str, length){
  const parts = (str==null ? "" : String(str)).split(",");
  return Array.from({length}, (_,i) => {
    const v = parts[i];
    return (v===undefined || v==="") ? null : Number(v);
  });
}
// Lista wolnego tekstu (np. działania usprawniające) w jednej komórce Excela, rozdzielona " | " —
// mało prawdopodobny ciąg wewnątrz zdania, w przeciwieństwie do przecinka czy średnika.
function serializeTextList(arr){
  return (arr||[]).filter(Boolean).join(" | ");
}
function deserializeTextList(str){
  return (str==null || str==="") ? [] : String(str).split(" | ").map(s=>s.trim()).filter(Boolean);

// tablicy `answers` wcale albo mieć złą liczbę pytań (np. po zmianie zestawu pytań w kodzie) —
// dopełniamy brakujące odpowiedzi do null-i zamiast dać się wysypać dalszym obliczeniom.
function sanitizePctAnswers(raw){
  const out = {};
  PCT_AREAS.forEach(a => {
    const n = PCT_QUESTIONS[a.key].length;
    const src = raw && Array.isArray(raw[a.key]) ? raw[a.key] : [];
    out[a.key] = Array.from({length:n}, (_,i) => src[i] ?? null);
  });
  return out;
}
// v1.9 zamienia pojedyncze pole "działania usprawniające" (tekst) na listę — starsze pliki
// (Excel z v1.8, localStorage) mają tam string, który ma się wczytać jako pierwszy element listy.

  if (typeof row.decyzja === "string" && row.decyzja.trim()) return [row.decyzja.trim()];

/* ---------- Import karty projektu (.docx) ---------- */

// Z karty zaciągamy TYLKO to, z czego narzędzie realnie korzysta (uzgodnione z zespołem PMO):
// metryczkę, główne korzyści biznesowe, etapy/kamienie milowe i grupy objęte zmianą. Etykiety
// szablonów kart (uczelniana / grupowa-projektowa / programowa) różnią się nazewnictwem
// ("MENADŻER PROJEKTU" vs "MENADŻER PROGRAMU" itd.) — każdy matcher musi łapać oba warianty.
const KARTA_FIELD_MATCHERS = [
  ["nazwa", /^NAZWA (PROJEKTU|PROGRAMU)/i],
  ["typProjektu", /^TYP (PROJEKTU|PROGRAMU)/i],
  ["filie", /^(FILIE OBJĘTE PROJEKTEM|PODMIOTY OBJĘTE (PROGRAMEM|PROJEKTEM))/i],
  ["okresRealizacji", /^(OKRES|TERMIN) REALIZACJI/i],
];

// textContent samych <td> zlewa akapity/pozycje listy w jeden ciąg bez odstępu — dodajemy
// spację między blokami (<p>, <li>), żeby wielopunktowa treść dała się w ogóle przeczytać.
function cellText(node){
  const blocks = node.querySelectorAll("p, li");
  const text = blocks.length
    ? Array.from(blocks).map(b => (b.textContent||"").trim()).filter(Boolean).join(" ")
    : (node.textContent || "");
  return text.replace(/\s+/g, " ").trim();
}

// Jak cellText, ale zwraca akapity/pozycje listy OSOBNO, nie zlane spacją — potrzebne tam, gdzie
// każdy akapit to osobna osoba (sponsor/PM), a scalenie bez separatora sklejałoby dwie osoby
// w jeden nieczytelny ciąg ("Jan Nowak – Prezes Anna Kowalska – Prorektor").
function cellParagraphs(node){
  const blocks = node.querySelectorAll("p, li");
  const arr = blocks.length
    ? Array.from(blocks).map(b => (b.textContent||"").trim()).filter(Boolean)
    : [(node.textContent||"").trim()].filter(Boolean);
  return arr.map(t => t.replace(/\s+/g, " ").trim());
}

// Autorzy szablonów zostawiają "puste" pola z placeholderem zamiast pustego akapitu — traktujemy
// same kropki/myślniki i "n/d"/"brak" jak brak treści.
function isBlankish(text){
  const t = (text || "").trim();
  if (!t) return true;
  if (/^[.…\-–—_]+$/.test(t)) return true;
  if (/^(n\/?d\.?|brak)$/i.test(t)) return true;
  return false;
}
// Numer porządkowy wiersza karty (Lp) w komórce obok etykiety — nie jest nigdy prawdziwą
// wartością pola, tylko "17", "10" itp.
function isLpLike(text){
  return /^\d{1,3}$/.test((text||"").trim());
}
function isDateLike(text){
  const t = (text||"").trim();
  return /^\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}$/.test(t) || /^(Q[1-4]\s*)?20\d{2}$/i.test(t);
}

// Trzy warianty karty (uczelniana / projektu grupowego / programu) różnią się układem tabel
// etapów/kamieni milowych (patrz extractMilestones) — rozpoznajemy typ po charakterystycznych,
// unikalnych dla danego wzoru etykietach.
function detectKartaType(tables){
  // Sprawdzamy POJEDYNCZE komórki, nie cały wiersz — w wierszu z numerem porządkowym Lp
  // ("1 | NAZWA PROJEKTU* | Wdrożenie...") tekst całego wiersza zaczyna się od "1", więc
  // dopasowanie zakotwiczone znakiem ^ nigdy by się nie powiodło.
  const hasCell = re => tables.some(t => Array.from(t.rows).some(r =>
    Array.from(r.cells).some(c => re.test(cellText(c).replace(/\*/g, "").trim()))));
  if (hasCell(/^NAZWA PROGRAMU/i)) return "program";
  if (hasCell(/^MPK\b/i)) return "uczelnia";
  if (hasCell(/^NAZWA PROJEKTU/i)) return "projekt";
  return null;
}

function extractFields(tables){
  const fields = {};
  tables.forEach(table => {
    const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
    rows.forEach((cells, r) => {
      for (let i = 0; i < cells.length; i++){
        const label = cells[i].replace(/\*/g, "").trim();
        if (!label) continue;
        KARTA_FIELD_MATCHERS.forEach(([key, re]) => {
          if (fields[key] || !re.test(label)) return;
          // Wartość to komórka TUŻ OBOK etykiety (i+1), nie zawsze ostatnia w wierszu — niektóre
          // szablony mieszczą dwie pary etykieta-wartość w jednym wierszu, gdzie branie zawsze
          // ostatniej komórki podstawiłoby cudzą wartość.
          if (i < cells.length - 1){
            const value = cells[i + 1];
            if (value) fields[key] = value;
            return;
          }
          // Niektóre szablony scalają komórki tak, że WARTOŚĆ ląduje PRZED etykietą w tym samym
          // wierszu. Komórka po lewej liczy się jako wartość tylko gdy nie jest numerem
          // porządkowym (Lp) ani placeholderem.
          if (i > 0){
            const left = cells[i - 1];
            if (left && !isLpLike(left) && !isBlankish(left)){
              fields[key] = left;
              return;
            }
          }
          // W pozostałych przypadkach etykieta zajmuje własny wiersz, a treść jest w kolejnym —
          // bierzemy NAJDŁUŻSZĄ niepustą komórkę tego wiersza (nie zawsze ostatnią: część
          // szablonów dokleja placeholder typu "…" na końcu wiersza z prawdziwą treścią z przodu).
          const nextRow = rows[r + 1];
          if (nextRow && nextRow.length){
            const candidates = nextRow.filter(c => !isBlankish(c));
            const value = candidates.sort((a, b) => b.length - a.length)[0];
            if (value) fields[key] = value;
          }
        });
      }
    });
  });
  return fields;
}

// Sponsor i PM/menadżer bywają więcej niż jedną osobą — w karcie to widać na dwa sposoby: kilka
// akapitów w JEDNEJ komórce (bez separatora w tekście) albo kolejne osoby w KOLEJNYCH WIERSZACH
// tabeli (Lp/etykieta puste, tylko wartość). Działamy na surowych węzłach wiersza/komórki (nie na
// już spłaszczonym cellText), żeby rozróżnić akapity, i doklejamy kolejne wiersze, dopóki
// wyglądają na kontynuację (dokładnie jedna niepusta komórka, bez własnego Lp/etykiety).
function extractPeopleField(tables, labelRe){
  for (const table of tables){
    const rows = Array.from(table.rows);
    for (let r = 0; r < rows.length; r++){
      const cells = Array.from(rows[r].cells);
      for (let i = 0; i < cells.length; i++){
        const label = cellText(cells[i]).replace(/\*/g, "").trim();
        if (!label || !labelRe.test(label)) continue;
        const people = [];
        if (i < cells.length - 1){
          people.push(...cellParagraphs(cells[i + 1]));
        } else if (i > 0 && !isLpLike(cellText(cells[i - 1])) && !isBlankish(cellText(cells[i - 1]))){
          people.push(...cellParagraphs(cells[i - 1]));
        }
        if (!people.length && rows[r + 1]){
          const nextCells = Array.from(rows[r + 1].cells).map(cellText);
          const candidates = nextCells.filter(c => !isBlankish(c));
          const value = candidates.sort((a, b) => b.length - a.length)[0];
          if (value) people.push(value);
        }
        let next = r + 1;
        while (rows[next]){
          const nextCells = Array.from(rows[next].cells).map(cellText);
          const nonBlank = nextCells.filter(c => !isBlankish(c));
          if (nonBlank.length !== 1 || isLpLike(nonBlank[0])) break;
          people.push(nonBlank[0]);
          next++;
        }
        const cleaned = people.map(p => p.trim()).filter(p => p && !isBlankish(p));
        if (cleaned.length) return cleaned.join("; ");
      }
    }
  }
  return "";
}

// "GRUPY OBJĘTE ZMIANĄ" (szablony 2026) zastąpiło "INTERESARIUSZE PROJEKTU" (starszy wzór) —
// dopasowujemy oba. Liczba kolumn różni się między wzorami (karta programu ma tylko 2: grupa +
// opis zmiany, bez trzeciej kolumny "jak przygotujemy") i tabela bywa zaśmiecona dodatkowymi
// wierszami o skali zmiany ("OCENA SKALI ZMIANY...", "LICZBA PUNKTÓW...") — odrzucamy je po treści.
function extractGroups(tables){
  const groups = [];
  const stakeholderTable = tables.find(t => /GRUPY OBJ[EĘ]TE ZMIAN|INTERESARIUSZE PROJEKTU/i.test(cellText(t.rows[0])));
  if (!stakeholderTable) return groups;
  Array.from(stakeholderTable.rows).forEach(row => {
    const cells = Array.from(row.cells).map(cellText);
    if (cells.length < 2) return;
    const grupa = cells[0];
    if (!grupa || grupa.length > 140) return;
    if (/^\d+$/.test(grupa.trim())) return; // wiersz tytułowy sekcji ("Lp | TYTUŁ"), nie dana
    if (/^(grupa( interesariuszy)?|kto\?)$/i.test(grupa)) return;
    if (/INTERESARIUSZE PROJEKTU|GRUPY OBJ[EĘ]TE ZMIAN|OCENA SKALI ZMIANY|LICZBA PUNKTÓW|KONIECZNOŚĆ PRZYGOTOWANIA|TERMIN PRZYGOTOWANIA/i.test(grupa)) return;
    groups.push({nazwa: grupa, wplyw: cells.slice(1).filter(Boolean).join(" — ")});
  });
  return groups;
}

const MILESTONE_TYPE_LABELS = {etap: "Etap", kamien: "Kamień milowy", dzialanie: "Działanie"};

// Kamienie milowe (i etapy) występują w dwóch formach zależnie od szablonu:
// A) dedykowana tabela "KLUCZOWE KAMIENIE MILOWE (PROJEKTU|PROGRAMU)" (karta programu) — KAŻDY
//    numerowany wiersz to kamień milowy (Lp | Nazwa | Termin), bez etapów.
// B) harmonogram ("PLANOWANE DZIAŁANIA I KAMIENIE MILOWE" / "RAMOWY PLAN REALIZACJI", karta
//    projektu/uczelniana) — 3 kolumny: etap | działanie lub kamień milowy (kamienie oznaczone
//    prefiksem "KM:", starszy wzór "Kamień milowy:") | termin. Zaciągamy WSZYSTKIE wiersze, nie
//    tylko te z prefiksem — nieprefiksowane to zwykłe działania, a same nazwy etapów też się
//    przydają jako pozycje wyboru w Planie działań. Kolumna etapu bywa w Wordzie scalona
//    (rowspan) na kilka wierszy jednego etapu — mammoth wtedy pomija komórkę na kolejnych
//    wierszach, więc "dziedziczymy" ostatnio widziany etap zamiast zgadywać z pozycji.
function extractMilestones(tables){
  const milestones = [];
  const dedicatedTable = tables.find(t => Array.from(t.rows).some(r => /NAZWA KAMIENIA/i.test(cellText(r))));
  if (dedicatedTable){
    const rows = Array.from(dedicatedTable.rows).map(r => Array.from(r.cells).map(cellText));
    const headerIdx = rows.findIndex(r => r.some(c => /NAZWA KAMIENIA/i.test(c)));
    if (headerIdx !== -1){
      for (let i = headerIdx + 1; i < rows.length; i++){
        const cells = rows[i];
        if (cells.length < 2 || !/^\d+$/.test((cells[0]||"").trim())) continue;
        if (cells[1]) milestones.push({nazwa: cells[1], termin: cells[2] || "", typ: "kamien"});
      }
    }
  }
  const scheduleTable = tables.find(t => /ETAPY REALIZACJI|RAMOWY PLAN REALIZACJI|PLANOWANE DZIAŁANIA I KAMIENIE MILOWE/i.test(cellText(t.rows[0])));
  if (scheduleTable){
    const rows = Array.from(scheduleTable.rows).map(r => Array.from(r.cells).map(cellText));
    const headerIdx = rows.findIndex(r => r.some(c => /NAZWA ETAPU/i.test(c)));
    const seenEtapy = new Set();
    let lastEtap = "";
    for (let i = (headerIdx===-1 ? 1 : headerIdx+1); i < rows.length; i++){
      const cells = rows[i];
      if (cells.length < 2) continue;
      const hasEtapCol = cells.length >= 3;
      const etap = hasEtapCol ? cells[0] : lastEtap;
      const dzialanieRaw = hasEtapCol ? cells[1] : cells[0];
      const termin = (hasEtapCol ? cells[2] : cells[1]) || "";
      if (!dzialanieRaw || isBlankish(dzialanieRaw)) continue;
      if (hasEtapCol && etap && !isBlankish(etap)){
        lastEtap = etap;
        if (!seenEtapy.has(etap)){
          seenEtapy.add(etap);
          milestones.push({nazwa: etap, termin: "", typ: "etap"});
        }
      }
      const isKm = /^(Kamień milowy|KM)\s*[:\s]/i.test(dzialanieRaw);
      const nazwa = dzialanieRaw.replace(/^(Kamień milowy|KM)\s*:?\s*/i, "").trim();
      if (nazwa) milestones.push({nazwa, termin, typ: isKm ? "kamien" : "dzialanie"});
    }
  }
  return milestones;
}

// "Główna korzyść biznesowa" (może być więcej niż jedna) siedzi w mini-tabeli z nagłówkiem
// zawierającym m.in. "KORZYŚĆ BIZNESOWA", "KATEGORIA KORZYŚCI", "KIEDY WYSTĄPI?", "MIERNIK" —
// kolejność kolumn różni się między wzorami. Gdy wiersz danych ma TYLE SAMO komórek co nagłówek,
// mapujemy po pozycji kolumny z nagłówka (odporne na dowolną kolejność kolumn), ALE tylko gdy
// komórka pod "kiedy" faktycznie wygląda na datę/jest pusta — na wszystkich 3 przykładowych
// kartach pusta "kategoria" NIE znika z wiersza, tylko autor karty wpisuje w nią treść korzyści,
// przez co cała reszta wiersza przesuwa się o kolumnę mimo tej samej liczby komórek co nagłówek.
// Heurystykę z v1.6 (klasyfikacja po treści: pierwsza data-podobna to termin, pierwsza z
// pozostałych to korzyść, kolejna to miernik) używamy jako fallback zarówno dla wiersza
// KRÓTSZEGO od nagłówka, jak i dla takiego przesunięcia. Pojedyncza scalona komórka na całą
// szerokość tabeli (np. "KLUCZOWE ZAŁOŻENIA...") to nagłówek kolejnej podsekcji, nie korzyść —
// kończy listę.
function extractBenefits(tables){
  const benefits = [];
  tables.forEach(table => {
    const rows = Array.from(table.rows).map(row => Array.from(row.cells).map(cellText));
    const headerIdx = rows.findIndex(r => r.some(c => /^KORZYŚĆ BIZNESOWA/i.test(c.replace(/\*/g, "").trim())));
    if (headerIdx === -1) return;
    const header = rows[headerIdx].map(c => c.replace(/\*/g, "").trim());
    const findCol = re => header.findIndex(c => re.test(c));
    const korzyscCol = findCol(/^KORZYŚĆ BIZNESOWA/i);
    const kategoriaCol = findCol(/^KATEGORIA/i);
    const kiedyCol = findCol(/^KIEDY/i);
    const miernikCol = findCol(/^MIERNIK/i);
    for (let r = headerIdx + 1; r < rows.length; r++){
      const row = rows[r];
      const nonBlank = row.filter(c => !isBlankish(c));
      if (!nonBlank.length) break; // pusty wiersz = koniec tabeli korzyści
      // Jedna scalona komórka na całą szerokość tabeli to nagłówek kolejnej podsekcji ("KLUCZOWE
      // ZAŁOŻENIA...", "PRZYJĘTE ZAŁOŻENIA..."), nie wiersz z korzyścią — kończymy tabelę korzyści.
      if (row.length <= 1) break;
      let korzysc, kategoria, kiedy, miernik;
      // Liczba komórek zgadza się z nagłówkiem, ale to NIE gwarantuje poprawnego wyrównania: gdy
      // "kategoria" zostaje pusta, autor karty czasem i tak wpisuje treść korzyści w tę (scaloną)
      // komórkę zamiast zostawić ją pustą, przez co cała reszta wiersza przesuwa się o kolumnę
      // (potwierdzone na wszystkich 3 przykładowych kartach). Wyrównanie po pozycji ufamy tylko
      // gdy komórka "kiedy" faktycznie wygląda na datę (albo jest pusta) — inaczej to sygnał
      // przesunięcia i wracamy do heurystyki po treści.
      const kiedyLooksRight = kiedyCol < 0 || isBlankish(row[kiedyCol]) || isDateLike(row[kiedyCol]);
      if (row.length === header.length && kiedyLooksRight){
        korzysc = korzyscCol>=0 ? row[korzyscCol] : "";
        kategoria = kategoriaCol>=0 ? row[kategoriaCol] : "";
        kiedy = kiedyCol>=0 ? row[kiedyCol] : "";
        miernik = miernikCol>=0 ? row[miernikCol] : "";
      } else {
        const dateIdx = nonBlank.findIndex(isDateLike);
        kiedy = dateIdx !== -1 ? nonBlank[dateIdx] : "";
        const rest = nonBlank.filter((c, i) => i !== dateIdx);
        korzysc = rest[0] || "";
        miernik = rest[1] || "";
        kategoria = "";
      }
      if (isBlankish(korzysc)) continue;
      benefits.push({
        korzysc,
        kategoria: isBlankish(kategoria) ? "" : kategoria,
        termin: isBlankish(kiedy) ? "" : kiedy,
        miernik: isBlankish(miernik) ? "" : miernik,
      });
    }
  });
  return benefits;
}

// Karta projektu Grupy Merito ma stałą, numerowaną strukturę tabel. Parser dopasowuje pola po
// treści etykiety (nie po sztywnej pozycji kolumny/wiersza), ale zakłada te same nagłówki sekcji
// co w referencyjnym szablonie — inny układ karty może nic nie znaleźć (stąd podgląd przed
// zastosowaniem, a nie ciche nadpisanie danych).
function parseKartaHtml(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tables = Array.from(doc.querySelectorAll("table"));
  const fields = extractFields(tables);
  fields.sponsor = extractPeopleField(tables, /^SPONSOR/i);
  fields.pm = extractPeopleField(tables, /^MENADŻER (PROJEKTU|PROGRAMU)/i);
  return {
    kartaType: detectKartaType(tables),
    fields,
    groups: extractGroups(tables),
    milestones: extractMilestones(tables),
    benefits: extractBenefits(tables),
  };
}

/* ---------- localStorage ---------- */

const LS_KEY = "pzz_merito_versions_v1";

function loadVersions(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ return []; }
}
function saveVersions(list){
  try { localStorage.setItem(LS_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function storageIsAvailable(){
  try {
    const t = "__pzz_test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return true;
  } catch(e){ return false; }
}

/* ---------- Drobne komponenty ---------- */

function Badge({tone, children}){
  return <span className={"badge " + tone}>{children}</span>;
}

// `labels` (opcjonalny) to natywny tooltip (title) na każdym przycisku — nie zajmuje miejsca w
// layoucie, więc nie psuje układu przy długich pytaniach (w przeciwieństwie do podpisów na stałe
// widocznych pod przyciskami, które w gęstej liście pytań zajęłyby dodatkowy wiersz).
function Likert({value, onChange, max=5, labels}){
  return (
    <div style={{display:"flex", gap:6}}>
      {Array.from({length:max}, (_,i)=>i+1).map(n => (
        <button key={n} type="button" className="small"
          onClick={()=>onChange(n)} title={labels ? labels[n-1] : undefined}
          style={{
            width:30, height:30, padding:0, fontWeight:700,
            background: value===n ? "var(--accent)" : "#fff",
            color: value===n ? "#fff" : "var(--ink)",
            borderColor: value===n ? "var(--accent)" : "var(--line)",
          }}>{n}</button>
      ))}
    </div>
  );
}

function Field({label, hint, children}){
  return (
    <div className="field">
      <label>{label}</label>
      {children}
      {hint ? <p className="hint" style={{margin:"4px 0 0"}}>{hint}</p> : null}
    </div>
  );
}

function Bar({label, value, max=5, tone}){
  const pct = value==null ? 0 : Math.max(0, Math.min(100, (value/max)*100));
  const color = tone || (value==null ? "#cfd5d9" : value<=2 ? "var(--red)" : value===3 ? "var(--orange)" : "var(--green)");
  return (
    <div className="bar-row">
      <div className="label">{label}</div>
      <div className="bar-track"><div className="bar-fill" style={{width:pct+"%", background:color}}/></div>
      <div className="bar-val">{value==null?"–":(Math.round(value*10)/10)}</div>
    </div>
  );
}

/* ---------- Aplikacja ---------- */

function App(){
  const [state, setState] = useState(newProjectState);
  const [tab, setTab] = useState("dane");
  const [versions, setVersions] = useState(loadVersions);
  const [storageOk] = useState(storageIsAvailable);
  const [showVersions, setShowVersions] = useState(false);
  const [toast, setToast] = useState(null);
  const [kartaImport, setKartaImport] = useState(null);
  const [kartaPreImportSnapshot, setKartaPreImportSnapshot] = useState(null);
  const excelInputRef = useRef(null);
  const kartaInputRef = useRef(null);
  const versionsDialogRef = useRef(null);

  useEffect(()=>{
    const d = versionsDialogRef.current;
    if (!d) return;
    if (showVersions && !d.open) d.showModal();
    if (!showVersions && d.open) d.close();
  }, [showVersions]);

  useEffect(()=>{
    if(!toast) return;
    // Dłuższe komunikaty (np. podsumowanie zastosowanego importu karty) dostają więcej czasu na
    // ekranie niż krótkie potwierdzenia typu "Zapisano".
    const t = setTimeout(()=>setToast(null), toast.length > 60 ? 6000 : 2600);
    return ()=>clearTimeout(t);
  }, [toast]);

  const {surveyTotal, surveyAnsweredCount} = useMemo(()=>{
    let sum = 0, answered = 0;
    const allIds = [...SURVEY.partI.map(q=>q.id), ...SURVEY.partII_items.map(it=>it.id), SURVEY.partII_extra.id, ...SURVEY.partIII.map(q=>q.id)];
    allIds.forEach(id => {
      const v = state.surveyAnswers[id];
      if (v !== null && v !== undefined && v !== ""){ sum += Number(v); answered += 1; }
    });
    return {surveyTotal: sum, surveyAnsweredCount: answered};
  }, [state.surveyAnswers]);
  const level = surveyLevel(surveyTotal, surveyAnsweredCount);

  // Ostatni WYPEŁNIONY pomiar, nie ostatni wiersz tabeli — dodanie pustego "kolejnego pomiaru"
  // na przyszły przegląd nie może cofnąć pulpitu do "brak danych", skoro realny wynik już jest.
  // Wynik per obszar to teraz suma odpowiedzi na pytania (pctScores), nie ręcznie wpisana liczba —
  // computeWeakestPctAreas/pctTone dostają ten sam kształt danych {obszar: liczba|null} co dawniej,
  // więc ich logika progów i remisów zostaje bez zmian.
  const pctLatest = [...state.pctHistory].reverse().find(p => PCT_AREAS.some(a => pctScores(p)[a.key] != null)) || {};
  const pctLatestScores = pctScores(pctLatest);
  const pctNums = PCT_AREAS.map(a => pctLatestScores[a.key]).filter(v => v != null);
  const pctAvg = pctNums.length ? (pctNums.reduce((a,b)=>a+b,0)/pctNums.length) : null;
  const pctWeakestAreas = computeWeakestPctAreas(pctLatestScores);

  const adkarRollup = useMemo(()=>{
    return ADKAR_DIMS.map(dim => {
      const vals = CATEGORIES
        .map(c => state.adkarByCategory[c.id]?.[dim.id])
        .filter(v => v !== null && v !== undefined && v !== "")
        .map(Number);
      const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      const min = vals.length ? Math.min(...vals) : null;
      const atRisk = CATEGORIES.filter(c => {
        const v = state.adkarByCategory[c.id]?.[dim.id];
        return v !== null && v !== undefined && v !== "" && Number(v) <= 2;
      }).map(c => c.label);
      return {...dim, avg, min, atRiskCount: atRisk.length, atRisk, suggestion: ADKAR_SUGGESTIONS[dim.id]};
    });
  }, [state.adkarByCategory]);

  // Bariera = wymiar ADKAR z najniższą oceną, ale TYLKO gdy ta ocena jest ≤3 (spójnie z legendą:
  // 4-5 to dobra gotowość) — inaczej nawet same piątki dawałyby "barierę". Przy remisie pokazujemy
  // maks. 2 wymiary; gdy remis dotyczy 3 lub więcej, pokazujemy tylko pierwszy w kolejności ADKAR
  // (pierwszy niezaliczony wymiar blokuje kolejne) + liczbę pozostałych do osobnego komunikatu.
  // status: "empty" (nic jeszcze nie ocenione — nie pokazujemy nic), "ready" (żaden wymiar ≤3 —
  // "brak istotnej bariery"), "barrier" (dims: 1-2 wymiary, extraCount: ile jeszcze przy remisie ≥3).
  function categoryBarrier(catId){
    const d = state.adkarByCategory[catId];
    if (!d) return {status:"empty", dims:[], extraCount:0};
    let worstVal = Infinity;
    ADKAR_DIMS.forEach(dim => {
      const v = d[dim.id];
      if (v !== null && v !== undefined && v !== "" && Number(v) < worstVal) worstVal = Number(v);
    });
    if (worstVal === Infinity) return {status:"empty", dims:[], extraCount:0};
    if (worstVal > 3) return {status:"ready", dims:[], extraCount:0};
    const tied = ADKAR_DIMS.filter(dim => {
      const v = d[dim.id];
      return v !== null && v !== undefined && v !== "" && Number(v) === worstVal;
    });
    if (tied.length <= 2) return {status:"barrier", dims: tied, extraCount:0};
    return {status:"barrier", dims: [tied[0]], extraCount: tied.length - 1};
  }

  const actionsByCategory = useMemo(()=>{
    const m = {};
    CATEGORIES.forEach(c => m[c.id] = state.actions.filter(a => a.categoryId === c.id));
    return m;
  }, [state.actions]);

  const statusCounts = useMemo(()=>{
    const m = {all: state.actions.length};
    STATUS_OPTIONS.forEach(s => m[s] = state.actions.filter(a=>a.status===s).length);
    m.dodaneDoHarmonogramu = state.actions.filter(a => a.dodanoDoHarmonogramu).length;
    return m;
  }, [state.actions]);

  const signals = useMemo(()=>({
    brakOdpowiedzialnego: state.actions.filter(a => !(a.odpowiedzialny||"").trim()).length,
    brakTerminu: state.actions.filter(a => !(a.termin||"").trim() && !(a.kamien||"").trim()).length,
    zablokowane: state.actions.filter(a => a.status === "Zablokowane").length,
  }), [state.actions]);

  /* -------- persistence -------- */

  function persistAsNewVersion(name){
    const entry = {id:cryptoId(), name: name || (state.project.nazwa || "Bez nazwy"), savedAt: new Date().toISOString(), data: state};
    const next = [entry, ...versions].slice(0, 50);
    setVersions(next);
    const ok = saveVersions(next);
    setToast(ok
      ? "Wersja zapisana: " + entry.name
      : "Uwaga: przeglądarka zablokowała zapis na dysku — wersja jest widoczna tylko do zamknięcia karty. Użyj „Zapisz plik”, żeby jej nie stracić.");
  }
  function loadVersion(entry){
    setState(sanitizeProjectState(entry.data));
    setShowVersions(false);
    setToast("Wczytano wersję: " + entry.name);
  }
  function deleteVersion(id){
    const next = versions.filter(v=>v.id!==id);
    setVersions(next);
    saveVersions(next);
  }
  // Zamiast pokazywać podgląd i czekać na klik "Zastosuj wszystko naraz" (zespół po wczytaniu
  // karty nie zauważał, że trzeba to kliknąć) — zaciągnięte dane stosujemy OD RAZU po udanym
  // rozpoznaniu pliku. Metryczkę widać w edytowalnych polach poniżej (można ją tam poprawić),
  // grupy/kamienie dokładamy do istniejących list (bez duplikatów po nazwie), korzyści nadpisują
  // poprzednią listę. `kartaPreImportSnapshot` trzyma stan SPRZED importu, żeby jednym klikiem
  // dało się cofnąć cały import, gdyby karta była zła.
  function handleKartaFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      mammoth.convertToHtml({arrayBuffer: reader.result})
        .then(result => {
          const parsed = parseKartaHtml(result.value);
          const found = Object.keys(parsed.fields).length + parsed.groups.length + parsed.milestones.length + parsed.benefits.length;
          if (found === 0){ setKartaImport({fileName: file.name, failed:true}); return; }
          const snapshot = state;
          const existingGroupNames = new Set(state.groups.map(g => (g.nazwa||"").trim().toLowerCase()));
          const newGroups = parsed.groups
            .filter(g => g.nazwa && !existingGroupNames.has(g.nazwa.trim().toLowerCase()))
            .map(g => ({id:cryptoId(), nazwa:g.nazwa, wplyw:g.wplyw, categoryId: ""}));
          const existingMilestoneNames = new Set(state.milestones.map(m => (m.nazwa||"").trim().toLowerCase()));
          const newMilestones = parsed.milestones
            .filter(m => m.nazwa && !existingMilestoneNames.has(m.nazwa.trim().toLowerCase()))
            .map(m => ({id:cryptoId(), ...m}));
          setState(sanitizeProjectState({
            ...state,
            project: {...state.project, ...parsed.fields, ...(parsed.kartaType ? {kartaType: parsed.kartaType} : {})},
            groups: [...state.groups, ...newGroups],
            milestones: [...state.milestones, ...newMilestones],
            benefits: parsed.benefits.length ? parsed.benefits : state.benefits,
          }));
          setKartaPreImportSnapshot(snapshot);
          setKartaImport({
            fileName: file.name, failed:false,
            fieldsCount: Object.keys(parsed.fields).length, groupsAdded: newGroups.length,
            milestonesAdded: newMilestones.length, benefitsCount: parsed.benefits.length,
          });
          setToast("Zastosowano dane z karty: " + file.name);
        })
        .catch(() => setKartaImport({fileName: file.name, failed:true}));
    };
    reader.readAsArrayBuffer(file);
  }
  function undoKartaImport(){
    if (!kartaPreImportSnapshot) return;
    setState(kartaPreImportSnapshot);
    setKartaPreImportSnapshot(null);
    setKartaImport(null);
    setToast("Cofnięto import karty.");
  }
  function dismissKartaImport(){ setKartaImport(null); }

  // SheetJS Community (biblioteka "xlsx" używana do importu) nie potrafi zapisać kolorów ani
  // fontów w plikach .xlsx — to funkcja płatnej wersji Pro. Do STYLOWANEGO eksportu używamy
  // ExcelJS (open-source, wspiera pełne stylowanie), zgodnie z paletą marki Grupa Merito
  // (Instrukcja dla Agenta AI — Typografia i Layout): #141E50 granat, #006EFA akcent, font Inter.
  async function exportExcel(){
    const wb = new ExcelJS.Workbook();
    wb.creator = "Plan Zarządzania Zmianą — Grupa Merito";

    const wsDane = wb.addWorksheet("Dane projektu");
    wsDane.columns = [{width:45},{width:40},{width:30},{width:25}];
    xlsTitleRow(wsDane, ["PLAN ZARZĄDZANIA ZMIANĄ — DANE PROJEKTU"]);
    wsDane.addRow([]);
    xlsLabelRow(wsDane, "Nazwa projektu/programu", state.project.nazwa);
    xlsLabelRow(wsDane, "Sponsor", state.project.sponsor);
    xlsLabelRow(wsDane, "PM", state.project.pm);
    xlsLabelRow(wsDane, "Koordynator planu zarządzania zmianą (jeśli powołany)", state.project.cm);
    xlsLabelRow(wsDane, "Typ projektu", state.project.typProjektu);
    xlsLabelRow(wsDane, "Filie objęte projektem", state.project.filie);
    xlsLabelRow(wsDane, "Okres realizacji projektu", state.project.okresRealizacji);
    xlsLabelRow(wsDane, "Termin przygotowania PZZ", state.project.terminPrzygotowania);
    xlsLabelRow(wsDane, "Częstotliwość aktualizacji", state.project.czestotliwosc);

  // Wczytuje plik zapisany przyciskiem "Zapisz plik" (Excel, ale nazwane bez żargonu formatu w
  // UI — patrz przycisk) z powrotem do stanu aplikacji — to jedyny sposób zapisu/odczytu pliku
  // w tym narzędziu (uwaga zespołu: "muszę ściągnąć zawsze tego jasona... Excel też by mógł być"
  // — Excel jest znajomy, JSON nie, a samo słowo "eksport/format" jeszcze nikomu nic nie mówi).
  // Rozpoznaje TYLKO układ wygenerowany przez "Zapisz plik" (te same nazwy arkuszy i nagłówki
  // kolumn) — dowolny inny plik .xlsx zostanie odrzucony z komunikatem, zamiast zgadywać układ.
  function importExcel(file){
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const wb = XLSX.read(reader.result, {type:"array"});
        const sheet = name => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:""}) : null;
        const dane = sheet("Dane projektu");
        const ankieta = sheet("Ankieta");
        const diag = sheet("Diagnoza");
        const plan = sheet("Plan działań");
        if (!dane || !ankieta || !diag) throw new Error("missing sheets");

        const label = row => (row[0]||"").toString().trim();
        const findRow = (rows, prefix) => rows.find(r => label(r).startsWith(prefix));
        const val = (rows, prefix) => { const r = findRow(rows, prefix); return r ? (r[1] ?? "") : ""; };

        const project = {
          nazwa: val(dane,"Nazwa projektu"), sponsor: val(dane,"Sponsor"), pm: val(dane,"PM"),
          // v2.0 zmienił etykietę "CM" na "Koordynator..." — starsze pliki nadal mają starą etykietę.
          cm: val(dane,"Koordynator planu") || val(dane,"CM"),
          typProjektu: val(dane,"Typ projektu"), filie: val(dane,"Filie objęte"),
          okresRealizacji: val(dane,"Okres realizacji"),
          terminPrzygotowania: val(dane,"Termin przygotowania"), czestotliwosc: val(dane,"Częstotliwość"),
        };

        let benefits = xlsReadSection(dane, "GŁÓWNE KORZYŚCI BIZNESOWE Z KARTY PROJEKTU", r => ({korzysc:r[0]||"", kategoria:r[1]||"", termin:r[2]||"", miernik:r[3]||""}));
        if (!benefits.length){
          // v1.8 miał jedną korzyść wprost w polach projektu, nie osobną sekcję listy.
          const oldKorzysc = val(dane, "Główna korzyść biznesowa");
          if (oldKorzysc) benefits = [{korzysc: oldKorzysc, kategoria:"", termin: val(dane,"Termin wystąpienia korzyści"), miernik: val(dane,"Miernik korzyści")}];
        }

        let milestones = xlsReadSection(dane, "ETAPY I KAMIENIE MILOWE Z KARTY PROJEKTU", r => {
          const typEntry = Object.entries(MILESTONE_TYPE_LABELS).find(([,lbl]) => lbl === (r[2]||"").toString().trim());
          return {id:cryptoId(), nazwa:r[0]||"", termin:r[1]||"", typ: typEntry ? typEntry[0] : "dzialanie"};
        });
        if (!milestones.length){
          // v1.8 miał tylko kamienie milowe (bez etapów/typu) pod starą nazwą sekcji.
          milestones = xlsReadSection(dane, "KAMIENIE MILOWE Z KARTY PROJEKTU", r => ({id:cryptoId(), nazwa:r[0]||"", termin:r[1]||"", typ:"kamien"}));
        }
        const checklist12 = {};
        xlsReadSection(dane, "CHECKLISTA (POZIOM 1-2)", r => r).forEach(r => {
          if (r[0]) checklist12[r[0]] = (r[2]||"").toString().trim().toUpperCase() === "TAK";
        });

        const surveyAnswers = emptySurveyAnswers();
        ankieta.forEach(row => {
          const id = label(row);
          if (!id.startsWith("survey:")) return;
          const key = id.slice(7);
          const v = row[3];
          if (v !== "" && v != null && key in surveyAnswers) surveyAnswers[key] = Number(v);
        });

        const pctHeaderIdx = diag.findIndex(r => label(r) === "Data");
        const groupsHeaderIdx = diag.findIndex(r => label(r) === "Grupa");
        const adkarHeaderIdx = diag.findIndex(r => label(r) === "Kategoria" || label(r) === "Rola wobec zmiany");
        const pctHistory = [];
        if (pctHeaderIdx !== -1){
          for (let i = pctHeaderIdx+1; i < diag.length; i++){
            const r = diag[i];
            if (!label(r) && !r[1]) break;
            if (label(r).startsWith("Najsłabszy obszar")) break;
            pctHistory.push({
              id:cryptoId(), data:r[0]||"", punktKontrolny:r[1]||"",
              dzialaniaUsprawniajace: deserializeTextList(r[7]), kolejnyPrzeglad:r[8]||"",
              answers: {
                definicjaSukcesu: deserializeAnswers(r[9], PCT_QUESTIONS.definicjaSukcesu.length),
                przywodztwo: deserializeAnswers(r[10], PCT_QUESTIONS.przywodztwo.length),
                zarzadzanieProjektem: deserializeAnswers(r[11], PCT_QUESTIONS.zarzadzanieProjektem.length),
                zarzadzanieZmiana: deserializeAnswers(r[12], PCT_QUESTIONS.zarzadzanieZmiana.length),
              },
            });
          }
        }
        const groups = [];
        if (groupsHeaderIdx !== -1){
          for (let i = groupsHeaderIdx+1; i < diag.length; i++){
            const r = diag[i];
            if (!label(r)) break;
            const cat = findCategoryByLabel(r[2]||"");
            groups.push({id:cryptoId(), nazwa:r[0]||"", wplyw:r[1]||"", categoryId: cat ? cat.id : ""});
          }
        }
        const adkarByCategory = emptyAdkarByCategory();
        if (adkarHeaderIdx !== -1){
          for (let i = adkarHeaderIdx+1; i < diag.length; i++){
            const r = diag[i];
            if (!label(r)) break;
            const cat = findCategoryByLabel(label(r));
            if (!cat) continue;
            adkarByCategory[cat.id] = {
              awareness: r[1] ?? null, desire: r[2] ?? null, knowledge: r[3] ?? null,
              ability: r[4] ?? null, reinforcement: r[5] ?? null,
            };
          }
        }

        const actions = [];
        if (plan){
          // v2.0 usunął kolumnę "Jak sprawdzimy gotowość" (środek wiersza) — starsze pliki nadal ją
          // mają, więc kolumny "Dodano do harmonogramu"/"Status" siedzą tam o jedną pozycję dalej.
          // Rozpoznajemy układ po treści nagłówka, nie tylko po liczbie kolumn.
          const planHasWeryfikacja = plan[0] && plan[0].some(c => (c||"").toString().trim() === "Jak sprawdzimy gotowość");
          const dodanoIdx = planHasWeryfikacja ? 6 : 5;
          const statusIdx = planHasWeryfikacja ? 7 : 6;
          for (let i = 1; i < plan.length; i++){
            const r = plan[i];
            if (!label(r) && !r[1]) continue;
            const cat = findCategoryByLabel(label(r));
            actions.push({
              id:cryptoId(), categoryId: cat ? cat.id : "", dzialanie:r[1]||"", kamien:r[2]||"", termin:r[3]||"",
              odpowiedzialny:r[4]||"", dodanoDoHarmonogramu: (r[dodanoIdx]||"").toString().trim().toUpperCase()==="TAK",
              status: STATUS_OPTIONS.includes(r[statusIdx]) ? r[statusIdx] : "Do zaplanowania",
            });
          }
        }

        // Import może od razu "dokończyć" ankietę (plik miał już komplet odpowiedzi) — bez tego
        // efekt "Ustalono poziom X" (poniżej, reaguje na zmianę level.poziom) nadpisałby toast
        // "Wczytano plik" milisekundy później. Aktualizujemy ref PRZED setState, żeby ten efekt
        // uznał poziom za już znany.
        const importedAllIds = [...SURVEY.partI.map(q=>q.id), ...SURVEY.partII_items.map(it=>it.id), SURVEY.partII_extra.id, ...SURVEY.partIII.map(q=>q.id)];
        let importedTotal = 0, importedAnswered = 0;
        importedAllIds.forEach(id => {
          const v = surveyAnswers[id];
          if (v !== null && v !== undefined && v !== ""){ importedTotal += Number(v); importedAnswered += 1; }
        });
        const importedLevel = surveyLevel(importedTotal, importedAnswered);
        prevPoziomRef.current = importedLevel.complete ? importedLevel.poziom : null;

        setState(s => sanitizeProjectState({
          ...s, project: {...s.project, ...project}, surveyAnswers, pctHistory, groups, adkarByCategory, actions,
          milestones, benefits, checklist12,
        }));
        setToast("Wczytano plik: " + file.name);
      } catch(e){ alert("Nie udało się wczytać tego pliku — rozpoznawany jest tylko plik zapisany przyciskiem „Zapisz plik”."); }
    };
    reader.readAsArrayBuffer(file);
  }

  /* -------- drobne mutatory -------- */

  function setProjectField(key, value){
    setState(s => ({...s, project: {...s.project, [key]: value}}));
  }
  function setSurveyAnswer(id, value){
    setState(s => ({...s, surveyAnswers: {...s.surveyAnswers, [id]: value}}));
  }
  function setPct(idx, key, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], [key]: value};
      return {...s, pctHistory: hist};
    });
  }
  function setPctAnswer(idx, areaKey, qIndex, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      const row = hist[idx];
      const answers = {...row.answers, [areaKey]: row.answers[areaKey].map((v,i)=> i===qIndex ? value : v)};
      hist[idx] = {...row, answers};
      return {...s, pctHistory: hist};
    });
  }
  function addPctCheckpoint(){
    setState(s => ({...s, pctHistory: [...s.pctHistory, {id:cryptoId(), data:"", punktKontrolny:"", dzialaniaUsprawniajace:[], kolejnyPrzeglad:"", answers: emptyPctAnswers()}]}));
  }
  function addPctAction(idx){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], dzialaniaUsprawniajace: [...hist[idx].dzialaniaUsprawniajace, ""]};
      return {...s, pctHistory: hist};
    });
  }
  function updatePctAction(idx, actionIdx, value){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], dzialaniaUsprawniajace: hist[idx].dzialaniaUsprawniajace.map((v,i)=> i===actionIdx ? value : v)};
      return {...s, pctHistory: hist};
    });
  }
  function removePctAction(idx, actionIdx){
    setState(s => {
      const hist = s.pctHistory.slice();
      hist[idx] = {...hist[idx], dzialaniaUsprawniajace: hist[idx].dzialaniaUsprawniajace.filter((_,i)=> i!==actionIdx)};
      return {...s, pctHistory: hist};
    });
  }
  function addGroup(){
    setState(s => ({...s, groups: [...s.groups, {id:cryptoId(), nazwa:"", wplyw:"", categoryId: ""}]}));
  }
  function updateGroup(id, key, value){
    setState(s => ({...s, groups: s.groups.map(g => g.id===id ? {...g, [key]:value} : g)}));
  }
  function removeGroup(id){
    setState(s => ({...s, groups: s.groups.filter(g=>g.id!==id)}));
  }
  function setAdkar(catId, key, value){
    setState(s => ({...s, adkarByCategory: {...s.adkarByCategory, [catId]: {...s.adkarByCategory[catId], [key]: value}}}));
  }
  function addAction(categoryId){
    setState(s => ({...s, actions: [...s.actions, {
      id:cryptoId(), categoryId, dzialanie:"", kamien:"", termin:"", odpowiedzialny:"",
      dodanoDoHarmonogramu:false, status:"Do zaplanowania",
    }]}));
  }
  function updateAction(id, key, value){
    setState(s => ({...s, actions: s.actions.map(a => a.id===id ? {...a, [key]:value} : a)}));
  }
  function removeAction(id){
    setState(s => ({...s, actions: s.actions.filter(a=>a.id!==id)}));
  }
  function toggleChecklist(key){
    setState(s => ({...s, checklist12: {...s.checklist12, [key]: !s.checklist12[key]}}));
  }

  // Poziom 1 (mała zmiana) dostaje tylko checklistę — grupy i reszta zostają w karcie projektu.
  // Poziom 2 (średnia) dostaje checklistę + Diagnozę (grupy, ADKAR) + Plan/Pulpit, bez PCT.
  // Poziom 3 (duża) dostaje wszystko, łącznie z pełnym PCT.
  // Flagi liczone raz i używane też przy renderze w <main> — żeby warunek nie rozjechał się
  // między tabsDef i renderem (tak jak się rozjechał, zanim ta flaga istniała).
  const canSeeChecklist = level.complete && level.poziom < 3;
  const canSeeDiagnoza = level.complete && level.poziom >= 2;
  const canSeePct = level.complete && level.poziom === 3;
  // Twarda blokada (nie tylko ostrzeżenie): dopóki jakaś grupa ma rolę wobec zmiany, ale brakuje
  // jej opisu "Co zmienia się w ich pracy?" (albo brakuje samej roli), Plan działań i Pulpit są
  // niedostępne — wymuszamy uzupełnienie diagnozy, zanim będzie można przejść dalej.
  const hasIncompleteGroups = state.groups.some(g => !g.categoryId || !(g.wplyw||"").trim());
  const canSeePlanPulpit = canSeeDiagnoza && !hasIncompleteGroups;
  const tabsDef = [
    {id:"dane", label:"Dane projektu"},
    {id:"ankieta", label:"Ankieta — skala zmiany"},
    canSeeChecklist ? {id:"checklisty", label:"Checklisty (poziom " + level.poziom + ")"} : null,
    canSeeDiagnoza ? {id:"diagnoza", label:"Diagnoza"} : null,
    canSeePlanPulpit ? {id:"plan", label:"Plan działań"} : null,
    canSeePlanPulpit ? {id:"pulpit", label:"Pulpit"} : null,
    {id:"przewodnik", label:"Przewodnik"},
  ].filter(Boolean);

  useEffect(()=>{
    if (!tabsDef.some(t => t.id === tab)) setTab("dane");
  }, [tab, tabsDef]);

  // Komunikat "co się właśnie odblokowało" — pojawia się raz, gdy ankieta ustali (albo zmieni)
  // poziom zmiany, żeby użytkownik wiedział, dokąd iść dalej, zamiast się domyślać.
  const prevPoziomRef = useRef(null);
  useEffect(()=>{
    if (level.complete && prevPoziomRef.current !== level.poziom){
      const nextLabel = level.poziom >= 2 ? "Diagnoza" : "Checklisty";
